<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Game</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <div class="w-full max-w-md flex flex-col gap-4">
        <!-- Top Navigation / Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-5xl font-black text-[#776e65] tracking-wide">2048</h1>
            <div class="flex gap-2">
                <div class="bg-[#bbada0] rounded-lg px-4 py-2 text-center min-w-[75px]">
                    <div class="text-xs font-bold text-[#eee4da] uppercase tracking-wider">Score</div>
                    <div id="score" class="text-xl font-extrabold text-white">0</div>
                </div>
                <div class="bg-[#bbada0] rounded-lg px-4 py-2 text-center min-w-[75px]">
                    <div class="text-xs font-bold text-[#eee4da] uppercase tracking-wider">Bester</div>
                    <div id="best-score" class="text-xl font-extrabold text-white">0</div>
                </div>
            </div>
        </div>

        <!-- Controls Subheader -->
        <div class="flex justify-between items-center text-sm font-semibold">
            <p class="text-[#776e65]/80">Füge Kacheln zusammen zu <span class="font-bold text-[#776e65]">2048!</span></p>
            <button id="restart-btn" class="bg-[#8f7a66] hover:bg-[#9f8a76] text-white px-4 py-2 rounded-lg font-bold transition-all shadow-md active:scale-95">
                Neues Spiel
            </button>
        </div>

        <!-- Game Container -->
        <div class="relative w-full aspect-square">
            <!-- Background Grid (4x4) -->
            <div id="grid-background" class="grid-container w-full h-full grid grid-cols-4 grid-rows-4 gap-3">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>

            <!-- Dynamic Tile Layer -->
            <div id="tile-container" class="absolute inset-0 p-3 pointer-events-none"></div>

            <!-- Game Over / Win Overlay -->
            <div id="overlay" class="absolute inset-0 bg-white/85 rounded-xl flex flex-col items-center justify-center gap-4 transition-opacity duration-300 opacity-0 pointer-events-none z-20 backdrop-blur-sm">
                <h2 id="overlay-title" class="text-4xl font-extrabold text-[#776e65]">Spiel Vorbei!</h2>
                <p id="overlay-msg" class="text-lg font-medium text-[#776e65]/80 text-center px-4"></p>
                <div class="flex gap-3">
                    <button id="keep-going-btn" class="hidden bg-[#8f7a66] text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-[#9f8a76] transition-all">
                        Weiterspielen
                    </button>
                    <button id="try-again-btn" class="bg-[#8f7a66] text-white px-5 py-2.5 rounded-lg font-bold shadow-md hover:bg-[#9f8a76] transition-all">
                        Erneut versuchen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Instructions Footer -->
    <footer class="w-full max-w-md text-center text-xs text-[#776e65]/70 mt-6">
        <p><strong>Steuerung:</strong> Pfeiltasten / WASD oder Auf dem Bildschirm wischen.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
