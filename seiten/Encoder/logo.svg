<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Encoder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17313a"/>
      <stop offset="1" stop-color="#0b1417"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53e6c6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity=".35" stroke-width="2"/>

  <!-- Code-Symbol  </>  -->
  <g fill="none" stroke="#7fe9d6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M40 44 L22 64 L40 84"/>
    <path d="M88 44 L106 64 L88 84"/>
    <path d="M72 38 L56 90" stroke="#49b7a6"/>
  </g>

  <!-- Zip-Reißverschluss quer darüber -->
  <g stroke="#cfe9e4" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="30" y1="30" x2="98" y2="98"/>
    <line x1="34" y1="26" x2="40" y2="32"/>
    <line x1="44" y1="36" x2="50" y2="42"/>
    <line x1="54" y1="46" x2="60" y2="52"/>
    <line x1="74" y1="66" x2="80" y2="72"/>
    <line x1="84" y1="76" x2="90" y2="82"/>
  </g>
  <!-- Zip-Schieber -->
  <rect x="58" y="58" width="14" height="18" rx="3" transform="rotate(45 65 67)" fill="#2dd4bf"/>

  <!-- Schloss (verschlüsselt) unten rechts -->
  <g transform="translate(78 78)">
    <circle cx="19" cy="19" r="23" fill="#0b1417" stroke="#2dd4bf" stroke-opacity=".4" stroke-width="2"/>
    <path d="M11 15 V11 a8 8 0 0 1 16 0 V15" fill="none" stroke="url(#lock)" stroke-width="4" stroke-linecap="round"/>
    <rect x="8" y="15" width="22" height="17" rx="4" fill="url(#lock)"/>
    <circle cx="19" cy="22" r="2.6" fill="#0b1417"/>
    <rect x="17.8" y="23" width="2.4" height="6" rx="1.2" fill="#0b1417"/>
  </g>
</svg>
