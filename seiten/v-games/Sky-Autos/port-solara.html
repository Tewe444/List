<!DOCTYPE html>

<style>

<script>
window.__start=false;
function __status(t,err){var e=document.getElementById('status');e.innerHTML=t;e.style.color=err?'#ff6b6b':'#ffd9b0';}
function __go(){window.__start=true;if(window.__openCreator){window.__openCreator();}else{__status('Einen Moment – die 3D-Engine lädt noch, es geht automatisch weiter …');}}
window.addEventListener('error',function(e){if(/three\.js nicht geladen/.test(e.message||''))return;__status('Fehler: '+(e.message||e)+' (Zeile '+(e.lineno||'?')+')',true);document.getElementById('title').style.display='flex';});
window.addEventListener('unhandledrejection',function(e){var m=e.reason&&e.reason.message||String(e.reason);if(/pointer ?lock/i.test(m))return;__status('Fehler: '+m,true);});
setTimeout(function(){if(!window.__openCreator)__status('Die 3D-Engine konnte nicht geladen werden. Lade die Datei herunter und öffne sie direkt in Chrome, Edge oder Firefox – mit Internetverbindung (nicht in einer Vorschau).',true);},25000);
</script>

<script type="module">
// ================= ENGINE LADEN =================
const ADDONS=['postprocessing/EffectComposer.js','postprocessing/RenderPass.js','postprocessing/UnrealBloomPass.js','postprocessing/OutputPass.js','postprocessing/ShaderPass.js','objects/Sky.js','utils/BufferGeometryUtils.js'];
const SOURCES=[
 {three:'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm',add:p=>`https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/${p}/+esm`},
 {three:'https://esm.sh/three@0.160.0',add:p=>`https://esm.sh/three@0.160.0/examples/jsm/${p}`},
 {three:'https://unpkg.com/three@0.160.0/build/three.module.js?module',add:p=>`https://unpkg.com/three@0.160.0/examples/jsm/${p}?module`},
];
let THREE,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,ShaderPass,Sky,mergeGeometries;
for(const src of SOURCES){
 try{
  const m=await Promise.all([import(src.three),...ADDONS.map(p=>import(src.add(p)))]);
  THREE=m[0];EffectComposer=m[1].EffectComposer;RenderPass=m[2].RenderPass;UnrealBloomPass=m[3].UnrealBloomPass;OutputPass=m[4].OutputPass;ShaderPass=m[5].ShaderPass;Sky=m[6].Sky;mergeGeometries=m[7].mergeGeometries;
  if(THREE.WebGLRenderer&&EffectComposer&&Sky&&mergeGeometries)break;THREE=null;
 }catch(e){console.warn('Quelle fehlgeschlagen:',src.three,e);THREE=null;}
}
if(!THREE){__status('Die 3D-Engine konnte nicht geladen werden. Lade die Datei herunter und öffne sie direkt in Chrome, Edge oder Firefox – mit Internetverbindung (nicht in einer Vorschau).',true);throw new Error('three.js nicht geladen');}
__status('Stadt wird gebaut …');
await new Promise(r=>setTimeout(r,30));

// ================= HELFER =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand=mulberry32(90210);
const R=(a,b)=>a+rand()*(b-a);
const pickR=a=>a[Math.floor(rand()*a.length)];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angWrap=x=>((x+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
const lerpAng=(a,b,t)=>a+angWrap(b-a)*Math.min(1,t);
const $=id=>document.getElementById(id);
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpE=new THREE.Euler(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3(),tmpV=new THREE.Vector3(),tmpC=new THREE.Color();

// ================= RENDERER =================
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xb9d3ea,220,1500);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.5,6000);
const pmrem=new THREE.PMREMGenerator(renderer);

const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.55,0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},vig:{value:.38},sat:{value:1.12},con:{value:1.06}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform float vig,sat,con;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));c.rgb=mix(vec3(l),c.rgb,sat);c.rgb=clamp((c.rgb-.5)*con+.5,0.,1.);float d=distance(vUv,vec2(.5));c.rgb*=1.-vig*smoothstep(.38,.9,d);gl_FragColor=c;}`});
composer.addPass(grade);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

const allMats=[];
function M(p){const m=new THREE.MeshStandardMaterial(p);allMats.push(m);return m;}
const matCache={};
function cm(color,rough=.8,metal=0){const k=color+'_'+rough+'_'+metal;return matCache[k]||(matCache[k]=M({color,roughness:rough,metalness:metal}));}
function mesh(geo,mat,x=0,y=0,z=0,cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;return m;}
function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);}return t;}
function noiseFill(g,w,h,base,amt,n=9000,size=2){g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=Math.random()<.5?0:255;g.fillStyle=`rgba(${v},${v},${v},${amt*Math.random()})`;g.fillRect(Math.random()*w,Math.random()*h,size,size);}}

// ================= HIMMEL & LICHT =================
const hemi=new THREE.HemisphereLight(0xcfe6ff,0x5a4a35,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,near:1,far:800});
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.05;
scene.add(sun);scene.add(sun.target);
const sky=new Sky();sky.scale.setScalar(4500);
const su=sky.material.uniforms;su.turbidity.value=5;su.rayleigh.value=1.5;su.mieCoefficient.value=0.004;su.mieDirectionalG.value=0.86;
su.skyGain={value:.7};
sky.material.fragmentShader='uniform float skyGain;\n'+sky.material.fragmentShader.replace(/gl_FragColor\s*=\s*vec4\(\s*retColor\s*,\s*1\.0\s*\)\s*;/,'gl_FragColor = vec4( retColor*skyGain, 1.0 );');
scene.add(sky);
const envScene=new THREE.Scene();let envRT=null;
function updateEnv(){envScene.add(sky);const n=pmrem.fromScene(envScene,0,0.1,10000);scene.add(sky);if(envRT)envRT.dispose();envRT=n;scene.environment=n.texture;}
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(30,24,12),new THREE.MeshBasicMaterial({color:new THREE.Color(2.4,2.5,2.8),fog:false}));scene.add(moonMesh);
const starGeo=new THREE.BufferGeometry();{const a=[];for(let i=0;i<2500;i++){const t=Math.random()*Math.PI*2,p=Math.acos(Math.random()*0.97);a.push(Math.sin(p)*Math.cos(t)*2500,Math.cos(p)*2500,Math.sin(p)*Math.sin(t)*2500);}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(a,3));}
const starMat=new THREE.PointsMaterial({color:0xffffff,size:1.7,sizeAttenuation:false,transparent:true,fog:false,depthWrite:false});
const stars=new THREE.Points(starGeo,starMat);scene.add(stars);
const cloudTex=canvasTex(256,128,(g,w,h)=>{for(let i=0;i<45;i++){const x=40+Math.random()*(w-80),y=45+Math.random()*(h-75),r=14+Math.random()*30;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}});
const cloudMat=new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,fog:false,opacity:.9});
const clouds=[];for(let i=0;i<46;i++){const s=new THREE.Sprite(cloudMat);const sc=R(380,820);s.scale.set(sc,sc*.45,1);s.position.set(R(-3000,3000),R(380,620),R(-3000,2200));scene.add(s);clouds.push(s);}

// ================= STADT-LAYOUT =================
const N=14,CELL=70,ROAD=14,HALF=N*CELL/2,BLK=CELL-ROAD;
const nodeX=i=>i*CELL-HALF;
const nd=(i,j)=>({x:nodeX(i),z:nodeX(j)});
const COAST=HALF+ROAD/2;            // Ende Asphalt
const WATER_Z=COAST+32;            // Wasserkante
const PIERX=210;
const GBLK={i:4,j:5},PBLK={i:9,j:8},HBLK={i:11,j:9};
const AIRX0=600,AIRX1=920,AIRZ0=-380,AIRZ1=380,RWX=790;
const GARAGE={x:nodeX(GBLK.i)+35,z:nodeX(GBLK.j+1)};
const POLICE_SPAWN={x:nodeX(PBLK.i)+35,z:nodeX(PBLK.j+1)-11};
const HOSPITAL_SPAWN={x:nodeX(HBLK.i)+35,z:nodeX(HBLK.j+1)-9.5};
const PARKS=new Set(['9,3','10,3','9,4','10,4','6,10','2,9']),LAKE='10,4';

// Kollision: räumliches Raster
const GRID=40,grid=new Map(),bigSolids=[];
function addSolid(x0,x1,z0,z1,h){const s={x0,x1,z0,z1,h};if(x1-x0>400||z1-z0>400){bigSolids.push(s);return;}
 for(let gx=Math.floor(x0/GRID);gx<=Math.floor(x1/GRID);gx++)for(let gz=Math.floor(z0/GRID);gz<=Math.floor(z1/GRID);gz++){const k=gx*10007+gz;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(s);}}
function solidsNear(x,z,r){const out=[];for(let gx=Math.floor((x-r)/GRID);gx<=Math.floor((x+r)/GRID);gx++)for(let gz=Math.floor((z-r)/GRID);gz<=Math.floor((z+r)/GRID);gz++){const a=grid.get(gx*10007+gz);if(a)for(const s of a)out.push(s);}for(const s of bigSolids)out.push(s);return out;}
const B=HALF+60;
addSolid(-9000,-B,-9000,9000,-10);addSolid(960,9000,-9000,9000,-10);addSolid(B,960,-9000,-B,-10);addSolid(-9000,9000,-9000,-B,-10);
addSolid(-9000,PIERX-5,WATER_Z-2,9000,-10);addSolid(PIERX+5,9000,WATER_Z-2,9000,-10);addSolid(PIERX-5,PIERX+5,WATER_Z+66,9000,-10);
function groundY(x,z){

 P.pos.set(c.pos.x+Math.cos(c.h)*2.4,groundY(c.pos.x,c.pos.z),c.pos.z-Math.sin(c.h)*2.4);collideCircle(P.pos,.5);P.inCar=null;P.char.g.visible=true;scene.add(headSpot);scene.add(headTgt);headSpot.intensity=0;P.face=c.h;}
function toggleCar(){
 if(P.dead)return;if(P.inAir){exitAir(false);return;}
 if(P.inCar){exitCar(false);return;}
 const a=nearestAir(7.5);if(a){enterAir(a);return;}
 const c=nearestCar(4.3);if(!c)return;
 if(c.mode==='police'){police.splice(police.indexOf(c),1);setWanted(Math.max(wanted,2));}

}

// ================= KOLLISION =================
function collideCircle(p,r){let hit=false;
 for(const b of solidsNear(p.x,p.z,r+1)){if(p.x+r<b.x0||p.x-r>b.x1||p.z+r<b.z0||p.z-r>b.z1)continue;
  const cx=clamp(p.x,b.x0,b.x1),cz=clamp(p.z,b.z0,b.z1),dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
  if(d<r){hit=true;if(d<1e-4){const l=p.x-b.x0,rr=b.x1-p.x,t=p.z-b.z0,bt=b.z1-p.z,m=Math.min(l,rr,t,bt);
    if(m===l)p.x=b.x0-r;else if(m===rr)p.x=b.x1+r;else if(m===t)p.z=b.z0-r;else p.z=b.z1+r;}
   else{p.x=cx+dx/d*r;p.z=cz+dz/d*r;}}}
 return hit;}
function separateCar(c){let hit=false;
 for(const o of cars){if(o===c)continue;const dx=c.pos.x-o.pos.x,dz=c.pos.z-o.pos.z,d2=dx*dx+dz*dz;
  if(d2<11.6&&d2>1e-4){const d=Math.sqrt(d2),push=3.4-d,nx=dx/d,nz=dz/d;hit=true;
   if(o.mode==='ai'){c.pos.x+=nx*push;c.pos.z+=nz*push;o.bump=2.5;}
   else{c.pos.x+=nx*push/2;c.pos.z+=nz*push/2;o.pos.x-=nx*push/2;o.pos.z-=nz*push/2;}}}
 return hit;}
function camBlocked(x,y,z){for(const b of solidsNear(x,z,.1)){if(y<b.h&&x>b.x0&&x<b.x1&&z>b.z0&&z<b.z1)return true;}return false;}

function updateFoot(dt){
 const f=(key('KeyW','ArrowUp')?1:0)-(key('KeyS','ArrowDown')?1:0),r=(key('KeyD','ArrowRight')?1:0)-(key('KeyA','ArrowLeft')?1:0);
 const sy=Math.sin(camYaw),cy=Math.cos(camYaw);let mx=sy*f-cy*r,mz=cy*f+sy*r;const len=Math.hypot(mx,mz);
 const sp=K.ShiftLeft||K.ShiftRight?9:4.5;
 if(len>0){mx/=len;mz/=len;P.pos.x+=mx*sp*dt;P.pos.z+=mz*sp*dt;P.face=lerpAng(P.face,Math.atan2(mx,mz),dt*12);P.phase+=dt*sp*1.7;}
 collideCircle(P.pos,.5);
 for(const c of cars){const dx=P.pos.x-c.pos.x,dz=P.pos.z-c.pos.z,d=Math.hypot(dx,dz);if(d<1.9&&d>1e-3){P.pos.x=c.pos.x+dx/d*1.9;P.pos.z=c.pos.z+dz/d*1.9;}}
 const gy=groundY(P.pos.x,P.pos.z);P.vy-=25*dt;P.pos.y+=P.vy*dt;
 if(P.pos.y<=gy){P.pos.y=gy;P.vy=0;if(K.Space)P.vy=8;}
 P.swing+=((len>0?Math.sin(P.phase)*(sp>5?.9:.6):0)-P.swing)*Math.min(1,dt*12);
 animChar(P.char,P.swing);P.char.g.position.copy(P.pos);P.char.g.rotation.y=P.face;
}
function updatePlayerCar(dt){
 const c=P.inCar,up=key('KeyW','ArrowUp'),dn=key('KeyS','ArrowDown'),hb=K.Space;
 const s=(key('KeyA','ArrowLeft')?1:0)-(key('KeyD','ArrowRight')?1:0);
 if(up)c.speed+=(c.speed<0?32:15)*dt;else if(dn)c.speed-=(c.speed>0?30:10)*dt;else c.speed*=1-.6*dt;
 if(hb)c.speed*=1-2.2*dt;
 c.speed=clamp(c.speed,-13,48);
 c.steer+=(s-c.steer)*Math.min(1,dt*6);
 const turn=c.steer*1.9*clamp(Math.abs(c.speed)/6,0,1)*Math.sign(c.speed)*(hb?1.55:1)*(1-Math.min(Math.abs(c.speed),48)/100);
 c.h+=turn*dt;
 c.pos.x+=Math.sin(c.h)*c.speed*dt;c.pos.z+=Math.cos(c.h)*c.speed*dt;
 const sp0=Math.abs(c.speed);
 if(collideCircle(c.pos,1.6)){if(sp0>6){shake=Math.min(1,sp0/30);crashSound(sp0);}c.speed*=-.25;}
 if(separateCar(c)){if(sp0>8){shake=Math.min(1,sp0/35);crashSound(sp0);c.speed*=.55;}}
 if(sp0>6)for(const p of peds){if(p.kind==='dummy'||p.state==='ko'||p.state==='fly')continue;const dx=p.c.g.position.x-c.pos.x,dz=p.c.g.position.z-c.pos.z;
  if(dx*dx+dz*dz<5){p.hp=0;p.state='fly';p.vel.set(Math.sin(c.h)*sp0*.6+dx,7+sp0*.15,Math.cos(c.h)*sp0*.6+dz);p.timer=p.kind==='cop'?15:12;tone(120,.12,'sine',.08);
   if(!p.aggro)addHeat(1,p.kind==='cop');}}
 c.body.rotation.z=-c.steer*Math.min(sp0,30)/30*.06;c.body.rotation.x=(up&&c.speed<15?-.02:0)+(dn&&c.speed>3?.03:0);
 for(const f of c.fronts)f.rotation.y=c.steer*.45;
 headSpot.intensity=night*80;
 P.pos.set(c.pos.x,c.g.position.y,c.pos.z);
}
function updateAI(c,dt){
 const A=nd(c.a.i,c.a.j),Bn=nd(c.b.i,c.b.j),fx=Math.sign(Bn.x-A.x),fz=Math.sign(Bn.z-A.z),h=Math.atan2(fx,fz),rx=-Math.cos(h),rz=Math.sin(h);
 let blocked=false;
 if(c.ghost>0)c.ghost-=dt;else{
  for(const o of cars){if(o===c)continue;const ox=o.pos.x-c.pos.x,oz=o.pos.z-c.pos.z;if(ox*ox+oz*oz>110)continue;const al=ox*fx+oz*fz,lat=Math.abs(ox*rx+oz*rz);if(al>.5&&al<8.5&&lat<2.6){blocked=true;break;}}
  if(!P.inCar&&!P.inAir){const ox=P.pos.x-c.pos.x,oz=P.pos.z-c.pos.z,al=ox*fx+oz*fz,lat=Math.abs(ox*rx+oz*rz);if(al>0&&al<7&&lat<2.2)blocked=true;}}
 if(blocked){c.blockT+=dt;if(c.blockT>4){c.ghost=2;c.blockT=0;}}else c.blockT=0;
 if(c.bump>0){c.bump-=dt;blocked=true;}
 c.speed+=((blocked?0:c.cruise)-c.speed)*Math.min(1,dt*(blocked?6:1.4));
 c.t+=c.speed*dt/CELL;
 if(c.t>=1){c.t-=1;const prev=c.a;c.a=c.b;let ns=nbrs(c.a).filter(n=>!(n.i===prev.i&&n.j===prev.j));if(!ns.length)ns=[prev];c.b=pick(ns);return;}
 const tx=A.x+(Bn.x-A.x)*c.t+rx*3.5,tz=A.z+(Bn.z-A.z)*c.t+rz*3.5,k=Math.min(1,dt*5);
 c.pos.x+=(tx-c.pos.x)*k;c.pos.z+=(tz-c.pos.z)*k;c.h=lerpAng(c.h,h,dt*4);
}
function updatePolice(c,dt){
 if(c.halt>0){c.halt-=dt;c.speed*=1-Math.min(1,dt*4);c.pos.x+=Math.sin(c.h)*c.speed*dt;c.pos.z+=Math.cos(c.h)*c.speed*dt;return;}
 const tx=P.pos.x-c.pos.x,tz=P.pos.z-c.pos.z,d=Math.hypot(tx,tz);
 if(c.rev>0){c.rev-=dt;c.speed=-8;c.h+=c.revDir*1.6*dt;}
 else{const des=Math.atan2(tx,tz);c.h+=clamp(angWrap(des-c.h),-2.5*dt,2.5*dt);
  const ts=d>16?24+wanted*3.5:Math.max(0,(d-4.5)*2.2);c.speed+=(ts-c.speed)*Math.min(1,dt*1.6);}
 c.pos.x+=Math.sin(c.h)*c.speed*dt;c.pos.z+=Math.cos(c.h)*c.speed*dt;
 if(collideCircle(c.pos,1.6)){c.speed*=.3;c.stuck+=dt;if(c.stuck>.7){c.rev=1.1;c.revDir=Math.random()<.5?-1:1;c.stuck=0;}}else c.stuck=Math.max(0,c.stuck-dt*.5);
 separateCar(c);
}
function syncCar(c,dt){
 if(cineHide&&cineHide(c)){c.g.visible=false;return;}
 const d=Math.hypot(c.pos.x-camera.position.x,c.pos.z-camera.position.z);c.g.visible=d<260||c.mode==='police';if(!c.g.visible)return;
 const gy=groundY(c.pos.x,c.pos.z);c.g.position.x=c.pos.x;c.g.position.z=c.pos.z;c.g.position.y+=(gy-c.g.position.y)*Math.min(1,dt*10);c.g.rotation.y=c.h;
 for(const w of c.wheels)w.rotation.x+=c.speed*dt/.4;
}

 g.rotation.y=lerpAng(g.rotation.y,Math.atan2(ux,uz),dt*10);g.rotation.x=0;g.rotation.z=0;n.phase+=dt*sp*1.7;animChar(n.c,Math.sin(n.phase)*.8);g.visible=true;}

function makeDummy(x,z,kind){const g=new THREE.Group();let dh;
 if(kind==='bag'){g.add(mesh(new THREE.CylinderGeometry(.04,.04,2.4,6),cm(0x555555,.5,.6),0,1.2,0),mesh(new THREE.CylinderGeometry(.33,.33,1.15,14),cm(0x8b2a1a,.8),0,1.25,0));dh=1.9;}
 else{const t=canvasTex(128,128,(c)=>{const cols=['#ffffff','#d22222','#ffffff','#d22222','#ffffff','#d22222'];for(let i=0;i<6;i++){c.fillStyle=cols[i];c.beginPath();c.arc(64,64,62-i*10,0,7);c.fill();}});

function npcShoot(n){const g=n.c.g;const from=new THREE.Vector3(g.position.x,g.position.y+1.45,g.position.z);
 const to=P.inAir?P.inAir.g.position.clone():new THREE.Vector3(P.pos.x,P.pos.y+(P.inCar?1:1.2),P.pos.z);
 const d=to.clone().sub(from);const dist=d.length();d.normalize();
 if(worldHitT(from,d,dist)<dist-1.5)return;
 const moving=P.inCar?Math.min(1,Math.abs(P.inCar.speed)/25):P.inAir?1:(K.KeyW||K.KeyA||K.KeyS||K.KeyD)?.45:0;
 const acc=clamp(.7-dist*.012-moving*.35,.06,.75);
 const mz=from.clone().addScaledVector(d,.8);flash(mz,.45);gunSound(.09*Math.max(.15,1-dist/70),'pistol');
 const end=to.clone();if(Math.random()<acc)hurtPlayer(n.kind==='cop'?7:6,from);else end.add(tmpV.set(RR(-1.5,1.5),RR(-1,1),RR(-1.5,1.5)));
 tracer(mz,end);}
function updateNPCs(dt){
 const pp=P.pos,onFoot=!P.inCar&&!P.inAir&&!P.dead,play=mode==='play';
 for(let i=peds.length-1;i>=0;i--){const n=peds[i];const g=n.c.g;
  if(n.kind==='dummy'){if(n.wob>0){n.wob-=dt;if(n.state!=='ko')g.rotation.z=Math.sin(n.wob*25)*n.wob*.5;}continue;}
  if(n.stagger>0)n.stagger-=dt;
  const dx=pp.x-g.position.x,dz=pp.z-g.position.z,dist=Math.hypot(dx,dz);
  if(n.state==='walk'){n.s+=n.dir*n.spd*dt;const [x,z,f]=pedPos(n);g.position.set(x,.3,z);g.rotation.y=f;
   g.visible=Math.hypot(x-camera.position.x,z-camera.position.z)<170;if(g.visible){n.phase+=dt*n.spd*4;animChar(n.c,Math.sin(n.phase)*.55);}
   if(n.aggro&&play&&onFoot&&dist<6.5)n.state='fight';}
  else if(n.state==='flee'){n.fleeT-=dt;const tx=n.threat?n.threat.x:pp.x,tz=n.threat?n.threat.z:pp.z;const ax=g.position.x-tx,az=g.position.z-tz,l=Math.hypot(ax,az)||1;moveNPC(n,ax/l,az/l,6.5,dt);
   if(n.fleeT<=0){if(dist>60||!play)placePed(n,pp);else n.fleeT=4;}}
  else if(n.state==='guard'){g.visible=true;animChar(n.c,0);if(n.armed)n.c.armR.rotation.x=-.35;
   if(play&&!P.dead&&dist<26){n.state='fight';alertGroup(n);}}
  else if(n.state==='fight'){
   if(n.mission&&(!play||P.dead||dist>70)){n.state='guard';continue;}
   if(!play||P.dead||dist>55){if(n.kind==='cop'){if(dist>90||!play){scene.remove(g);n.c.dispose();peds.splice(i,1);}else moveNPC(n,dx/dist,dz/dist,6,dt);}else placePed(n,pp);continue;}
   n.atkT-=dt;const ux=dx/(dist||1),uz=dz/(dist||1);
   const ranged=n.kind==='cop'?wanted>=2:n.armed;
   if(n.kind==='civ'&&!ranged&&!onFoot){n.state='flee';n.fleeT=8;n.threat=null;continue;}
   if(ranged){const want=n.kind==='cop'?13:9;
    if(dist>want+5)moveNPC(n,ux,uz,n.kind==='cop'?5.5:4.5,dt);else if(dist<want-5)moveNPC(n,-ux,-uz,3,dt);else{faceNPC(n,ux,uz,dt);animChar(n.c,0);}
    n.c.armR.rotation.x=-Math.PI/2;n.c.g.rotation.y=lerpAng(n.c.g.rotation.y,Math.atan2(ux,uz),dt*10);
    if(n.atkT<=0&&dist<48){n.atkT=n.kind==='cop'?RR(.8,1.4):RR(1,1.7);npcShoot(n);}}
   else{
    if(dist>1.35)moveNPC(n,ux,uz,n.kind==='cop'?6.2:5.3,dt);else{faceNPC(n,ux,uz,dt);animChar(n.c,0);
     if(n.kind!=='cop'&&n.atkT<=0&&onFoot){n.atkT=1.0;n.punchT=.3;hurtPlayer(9,g.position);tone(170,.1,'square',.05);}}
    if(n.punchT>0){n.punchT-=dt;n.c.armR.rotation.x=-1.7*Math.sin(Math.max(0,.3-n.punchT)/.3*Math.PI);}}}
  else if(n.state==='fly'){n.timer-=dt;n.vel.y-=22*dt;g.position.addScaledVector(n.vel,dt);g.rotation.x+=dt*7;
   const gy=groundY(g.position.x,g.position.z);if(g.position.y<=gy&&n.vel.y<0){g.position.y=gy+.15;n.state='ko';g.rotation.set(-Math.PI/2,g.rotation.y,0);}
   if(n.timer<-6){n.state='ko';g.position.y=gy+.15;}}
  else if(n.state==='ko'){n.timer-=dt;if(n.timer<=0){n.mission=false;if(n.kind==='cop'){scene.remove(g);n.c.dispose();peds.splice(i,1);}else placePed(n,pp);}}
 }

function updateMission(dt){
 if(!mission){if(!storyDone&&missionWait>0){missionWait-=dt;if(missionWait<=0)startMission();}return;}
 const st=mission.steps[si];
 if(mTimer!=null){mTimer-=dt;if(mTimer<=0){failMission('Die Zeit ist abgelaufen.');return;}}
 if(st.type==='goto'){if(Math.hypot(P.pos.x-st.pos.x,P.pos.z-st.pos.z)<7&&(!st.car||P.inCar))completeStep();}
 else if(st.type==='car'){if(P.inCar)completeStep();}
 else if(st.type==='lose'){if(wanted===0)completeStep();}
 else if(st.type==='check'){if(st.check())completeStep();}
}

function rayAABB(o,d,b,maxT){let t0=0,t1=maxT;const mn=[b.x0,0,b.z0],mx=[b.x1,b.h,b.z1],oo=[o.x,o.y,o.z],dd=[d.x,d.y,d.z];
 for(let a=0;a<3;a++){if(Math.abs(dd[a])<1e-9){if(oo[a]<mn[a]||oo[a]>mx[a])return -1;}else{let ta=(mn[a]-oo[a])/dd[a],tb=(mx[a]-oo[a])/dd[a];if(ta>tb){const t=ta;ta=tb;tb=t;}if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return -1;}}return t0;}
function worldHitT(o,d,maxT){let best=maxT;if(d.y<-1e-4){const tg=(.05-o.y)/d.y;if(tg>0&&tg<best)best=tg;}
 const seen=new Set();const steps=Math.ceil(maxT/25);
 for(let k=0;k<=steps;k++){const t=Math.min(maxT,k*25);if(t>best+25)break;const x=o.x+d.x*t,z=o.z+d.z*t;for(const sd of solidsNear(x,z,26)){if(sd.h<=0||seen.has(sd))continue;seen.add(sd);const th=rayAABB(o,d,sd,best);if(th>=0&&th<best)best=th;}}
 return best;}
function charHit(o,d,base,maxT,r,h){const dx=d.x,dz=d.z,hh=dx*dx+dz*dz;if(hh<1e-8)return -1;const t=((base.x-o.x)*dx+(base.z-o.z)*dz)/hh;if(t<0||t>maxT)return -1;
 const px=o.x+dx*t-base.x,pz=o.z+dz*t-base.z;if(px*px+pz*pz>r*r)return -1;const y=o.y+d.y*t-base.y;if(y<0||y>h)return -1;return t;}
function sphereHit(o,d,c,r,maxT){const ox=o.x-c.x,oy=o.y-c.y,oz=o.z-c.z;const b=ox*d.x+oy*d.y+oz*d.z,cc=ox*ox+oy*oy+oz*oz-r*r;const disc=b*b-cc;if(disc<0)return -1;const t=-b-Math.sqrt(disc);return t>=0&&t<maxT?t:-1;}
function raycast(o,d,range,ignore){
 let best=worldHitT(o,d,range),res={};
 for(const n of peds){if(n===ignore||n.state==='ko'||n.state==='fly')continue;const dm=n.kind==='dummy';const t=charHit(o,d,n.c.g.position,best,dm?.6:.42,dm?n.dh:1.85);if(t>=0&&t<best){best=t;res={npc:n,head:!dm&&(o.y+d.y*t-n.c.g.position.y)>1.55};}}
 for(const c of cars){if(c===P.inCar||c===ignore||c.mode==='cine')continue;tmpV.set(c.pos.x,c.g.position.y+.9,c.pos.z);const t=sphereHit(o,d,tmpV,2.1,best);if(t>=0&&t<best){best=t;res={car:c};}}
 for(const a of aircraft){if(a===P.inAir||a===ignore||a.dead)continue;const t=sphereHit(o,d,a.g.position,a.r,best);if(t>=0&&t<best){best=t;res={air:a};}}
 res.t=best;res.point=o.clone().addScaledVector(d,best);return res;}

 INV.clip[w.id]--;fireCD=w.rate;shootPoseT=1.6;P.face=camYaw;
 const o=camera.position.clone(),dir=new THREE.Vector3();camera.getWorldDirection(dir);
 const mz=muzzlePos();

 else for(let k=0;k<(w.pellets||1);k++){const d=dir.clone();if(w.spread){d.x+=RR(-w.spread,w.spread);d.y+=RR(-w.spread,w.spread);d.z+=RR(-w.spread,w.spread);d.normalize();}
  const hit=raycast(o,d,w.range,null);tracer(mz,hit.point);
  if(hit.npc)damageNPC(hit.npc,w.dmg*(hit.head?2:1),d,'player');else if(hit.car)damageCar(hit.car,w.dmg,'player');else if(hit.air)damageAir(hit.air,w.dmg,'player');else sparks(hit.point);}

}

  damageNPC(n,w.dmg,new THREE.Vector3(fxx,0,fzz),'player');hit=true;}
 if(w.id==='bat')for(const c of cars){const dx=c.pos.x-P.pos.x,dz=c.pos.z-P.pos.z,d=Math.hypot(dx,dz);if(d<3.2&&(dx*fxx+dz*fzz)/d>.3){damageCar(c,15,'player');hit=true;}}
 if(hit){tone(w.id==='bat'?130:170,.12,'square',.08);shake=Math.max(shake,.12);}else tone(380,.05,'sine',.02);}

 {d:7,txt:'Port Solara.',
  cam(t,u){const a=-0.95+u*1.0,r=400-u*110;camera.position.set(Math.cos(a)*r,155-u*60,Math.sin(a)*r+60);cineFocus.set(0,35,-20);camera.lookAt(cineFocus);}},
 {d:5,txt:'Neue Stadt. Neues Leben.',
  start(){cineHide=c=>c.mode==='ai'&&Math.abs(c.pos.z-nodeX(6))<9&&Math.abs(c.pos.x-camera.position.x)<30;},
  cam(t,u){const x=nodeX(4)-10+u*95;camera.position.set(x,2.2+u*3,nodeX(6)+4.5);cineFocus.set(x+40,8+u*40,nodeX(6)-28);camera.lookAt(cineFocus);}},
 {d:6.2,txt:'Nachts gehören die Straßen den Rennfahrern …',
  start(){race1=cineCar(0xff8c1a,'sport');race2=cineCar(0x1f5fbf,'sport');cineHide=c=>c.mode==='ai'&&Math.abs(c.pos.z-RZ)<10;},
  cam(t,u){const base=nodeX(1)+t*36,w=Math.sin(t*1.4)*3;
   setCar(race1,base+w,RZ-3.5,Math.PI/2,36);setCar(race2,base-w,RZ+3.5,Math.PI/2,36);
   const lead=base+Math.abs(w);
   if(t<3.7){camera.position.set(nodeX(1)+128,1.1,RZ+7.5);cineFocus.set(lead,1,RZ);}
   else{camera.position.set(base-11,2.3,RZ+Math.sin(t*1.1)*2);cineFocus.set(base+14,1.2,RZ);}
   camera.lookAt(cineFocus);}},
 {d:7,txt:'… und die Polizei ist nie weit weg.',
  start(){removeCine(race1,race2);flee=cineCar(0x6c3483,'sedan');cop1=cineCar(0,'sedan',true);cop2=cineCar(0,'sedan',true);cineHide=c=>c.mode==='ai'&&Math.abs(c.pos.x-PX)<10;},
  cam(t,u){const z=nodeX(N-1)-t*31,lane=PX+3.5,wv=k=>Math.sin((t-k)*2.1)*2.2;
   setCar(flee,lane+wv(0),z,Math.PI-Math.cos(t*2.1)*.15,31);
   setCar(cop1,lane+wv(.4),z+11,Math.PI-Math.cos((t-.4)*2.1)*.15,31);
   setCar(cop2,lane-1.2+wv(.8),z+21,Math.PI-Math.cos((t-.8)*2.1)*.15,31);
   if(t<3.6){camera.position.set(PX-28,38,z+36);cineFocus.set(PX,0,z+8);}
   else{const zc=nodeX(N-1)-3.6*31-75;camera.position.set(PX+9.5,1.5,zc);cineFocus.set(flee.pos.x,1.2,flee.pos.z+2);}
   camera.lookAt(cineFocus);
   polRed.emissiveIntensity=(time*7|0)%2?7:0;polBlue.emissiveIntensity=(time*7|0)%2?0:7;}},
 {d:9,txt:'',
  start(){removeCine(flee,cop1,cop2);cineHide=null;polRed.emissiveIntensity=0;polBlue.emissiveIntensity=0;$('ctitle').style.opacity=1;},
  cam(t,u){$('cpre').style.opacity=t>.6&&t<3.6?1:0;$('ch1').style.opacity=t>4?1:0;$('cby').style.opacity=t>5?1:0;camera.position.set(PIERX+45-u*30,5+u*5,WATER_Z+45);cineFocus.set(PIERX-130,32+u*10,-60);camera.lookAt(cineFocus);}},
];
const CINE_TOTAL=SHOTS.reduce((a,s)=>a+s.d,0);
function startIntro(){
 if(mode!=='title')return;mode='cine';$('title').style.display='none';$('cine').style.display='block';$('fade').style.opacity=1;
 initAudio();cineT=0;shotI=0;shotT=0;camera.fov=50;camera.updateProjectionMatrix();
 if(SHOTS[0].start)SHOTS[0].start();ctext(SHOTS[0].txt);
}
function endCine(){
 if(mode!=='cine')return;
 removeCine(...cineCars.slice());cineHide=null;shadowFocus=null;
 $('cine').style.display='none';$('ctitle').style.opacity=0;for(const id of ['cpre','ch1','cby'])$(id).style.opacity=0;const ct=$('ctext');ct.textContent='';ct.dataset.t='';ct.style.opacity=0;
 polRed.emissiveIntensity=0;polBlue.emissiveIntensity=0;
 if(AC){sirGain.gain.setTargetAtTime(0,AC.currentTime,.05);engGain.gain.setTargetAtTime(0,AC.currentTime,.05);}
 tod=.705;lastEnvTod=-1;mode='title';openCreator();
}
$('skip').onclick=endCine;
function cineUpdate(dt){
 time+=dt;cineT+=dt;shotT+=dt;
 let sh=SHOTS[shotI];
 if(shotT>=sh.d){shotI++;shotT=0;if(shotI>=SHOTS.length){endCine();return;}sh=SHOTS[shotI];if(sh.start)sh.start();ctext(sh.txt);}
 tod=.60+Math.min(1,cineT/CINE_TOTAL)*.105;
 worldTick(dt);
 sh.cam(shotT,shotT/sh.d);
 shadowFocus=cineFocus;
 const first=shotI===0?1.2:.45,f=Math.max(0,1-shotT/first,shotI===SHOTS.length-1?0:1-(sh.d-shotT)/.45);$('fade').style.opacity=f;
 if(AC){const t=AC.currentTime;
  sirGain.gain.setTargetAtTime(shotI===3?.03:0,t,.1);sirOsc.frequency.setTargetAtTime((time%1)<.5?720:960,t,.02);
  engGain.gain.setTargetAtTime(shotI===2||shotI===3?.04:0,t,.1);engOsc.frequency.setTargetAtTime(170+Math.sin(time*3)*20,t,.05);}
 updateSky(dt);
}

// ================= HAUPTSCHLEIFE =================
let time=0,last=performance.now(),frame=0,shownMoney=0;
function worldTick(dt){
 for(const c of cars){if(c.mode==='ai')updateAI(c,dt);else if(c.mode==='police')updatePolice(c,dt);else if(c.mode==='parked')c.speed*=.9;}
 for(const c of cars)syncCar(c,dt);
 updateNPCs(dt);updateFX(dt);updateRockets(dt);updatePickups(dt);updateAircraftWorld(dt);
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];
  if(c.mode==='wreck'){c.wreckT-=dt;if(Math.random()<dt*5)smoke(new THREE.Vector3(c.pos.x,c.g.position.y+1.2,c.pos.z),1.6,.12,2.5);if(c.wreckT<=0&&Math.hypot(c.pos.x-P.pos.x,c.pos.z-P.pos.z)>80)removeCar(c);}
  else if(c.hp<200&&c.g.visible&&Math.random()<dt*4)smoke(new THREE.Vector3(c.pos.x+Math.sin(c.h)*1.6,c.g.position.y+1,c.pos.z+Math.cos(c.h)*1.6),1,.3,1.6);}
 waterN.offset.set(time*.008,time*.005);foamMat.opacity=.25+Math.sin(time*1.3)*.12;
 for(const [k,b] of boats.entries()){b.position.y=Math.sin(time*1.2+k)*.15;b.rotation.z=Math.sin(time*.9+k)*.04;}
 for(const cl of clouds){cl.position.x+=dt*4;if(cl.position.x>3200)cl.position.x=-3200;}
}
function updateFootCombat(dt){
 const w=curW(),gun=!w.melee,ch=P.char;
 if(gun&&(aimHeld||shootPoseT>0)){P.face=camYaw;const ap=-Math.PI/2+camPitch*.55;ch.armR.rotation.x=ap;ch.armR.rotation.z=.06;
  if(w.id!=='pistol'){ch.armL.rotation.x=ap+.2;ch.armL.rotation.z=.5;}else ch.armL.rotation.z=-.06;}
 else ch.armL.rotation.z=-.06;
 if(meleeT>0){const pr=1-meleeT/.3;ch.armR.rotation.x=-2.3*Math.sin(pr*Math.PI);ch.armR.rotation.z=w.id==='bat'?.7*Math.sin(pr*Math.PI):.06;}
 ch.g.rotation.y=P.face;
 ch.g.visible=!scoped();
}
function update(dt){
 time+=dt;tod=(tod+dt*(K.KeyT?0.02:1/720))%1;mouseIdle+=dt;heatT-=dt;
 fireCD-=dt;shootPoseT-=dt;meleeT-=dt;hitT-=dt;
 if(reloadT>0){reloadT-=dt;if(reloadT<=0)finishReload();}
 if(fireHeld&&!P.inAir&&curW().auto)tryFire();
 if(P.dead){P.deadT-=dt;if(P.deadT<=0)respawnHospital();}
 else if(P.inAir)updateAirPlayer(dt);
 else if(P.inCar)updatePlayerCar(dt);
 else{updateFoot(dt);updateFootCombat(dt);}
 if(!P.dead&&P.hp<100&&time-lastHurtT>6)P.hp=Math.min(100,P.hp+5*dt);
 worldTick(dt);
 updatePoliceHeli(dt);
 const ai=cars.filter(c=>c.mode==='ai').length;if(ai<52)spawnTraffic(P.pos);
 const parked=cars.filter(c=>c.mode==='parked'&&c!==prologCar);if(parked.length>25){const c=parked[0];if(Math.hypot(c.pos.x-P.pos.x,c.pos.z-P.pos.z)>150)removeCar(c);}
 if(wanted>0&&!P.dead){
  const want=Math.min(6,wanted+(wanted>2?1:0));spawnT-=dt;if(police.length<want&&spawnT<=0){spawnPolice();spawnT=2.5;}
  let nearest=1e9;for(const c of police){const d=Math.hypot(c.pos.x-P.pos.x,c.pos.z-P.pos.z);nearest=Math.min(nearest,d);
   if(d>320){police.splice(police.indexOf(c),1);removeCar(c);break;}}
  let cops=0,nearCop=1e9;for(const n of peds)if(n.kind==='cop'&&n.state==='fight'){cops++;nearCop=Math.min(nearCop,n.c.g.position.distanceTo(P.pos));}
  for(const c of police){if(c.deployT>0){c.deployT-=dt;continue;}const d=Math.hypot(c.pos.x-P.pos.x,c.pos.z-P.pos.z);
   if(d<26&&Math.abs(c.speed)<9&&cops<8&&!P.inAir){c.deployT=25;c.halt=5;for(const sx of [-1,1])spawnCop(c.pos.x+Math.cos(c.h)*2.3*sx,c.pos.z-Math.sin(c.h)*2.3*sx);cops+=2;}}
  const pspd=P.inCar?Math.abs(P.inCar.speed):0;
  if(!P.inAir&&wanted<=2&&((P.inCar&&nearest<7&&pspd<3)||(!P.inCar&&(nearest<5||wanted<=1&&nearCop<1.8))))bustT+=dt;else bustT=Math.max(0,bustT-dt);
  if(bustT>2.2){bustT=0;busted();}
  const far=nearest>95&&nearCop>60;
  if(far){evadeT+=dt;if(evadeT>(wanted>=3?14:10)){evadeT=0;setWanted(wanted-1);}}else evadeT=0;
  polRed.emissiveIntensity=(time*7|0)%2?7:0;polBlue.emissiveIntensity=(time*7|0)%2?0:7;
 }
 updateMission(dt);
 if(marker.visible){marker.children[1].scale.setScalar(1+Math.sin(time*4)*.1);marker.children[0].material.opacity=.22+Math.sin(time*3)*.06;}
 // ---------- Kamera ----------
 const c=P.inCar,a=P.inAir,aim=aiming(),sc=scoped();
 let tx=P.pos.x,ty=c?c.g.position.y+1.4:a?a.g.position.y+2:P.pos.y+1.6,tz=P.pos.z;
 if(c&&mouseIdle>1.3&&Math.abs(c.speed)>2)camYaw=lerpAng(camYaw,c.h,dt*2.5);
 if(a&&(mouseIdle>1||a.type==='plane'&&a.airborne))camYaw=lerpAng(camYaw,a.h,dt*(a.type==='plane'?4:2));
 let dist=c?8.8+Math.abs(c.speed)*.07:a?(a.type==='heli'?15:19):aim?2.3:4.8;
 const pitchEff=a&&a.type==='plane'?camPitch*.6-a.p*.8:camPitch;
 const cp=Math.cos(pitchEff),spp=Math.sin(pitchEff);
 const rx=-Math.cos(camYaw),rz=Math.sin(camYaw),side=aim&&!sc?.75:0;
 if(sc){dist=.05;}
 for(let d=1;d<=dist;d+=.5){if(camBlocked(tx+rx*side-Math.sin(camYaw)*cp*d,ty+spp*d,tz+rz*side-Math.cos(camYaw)*cp*d)){dist=Math.max(1.0,d-.6);break;}}
 const want=tmpP.set(tx+rx*side-Math.sin(camYaw)*cp*dist,ty+spp*dist+(sc?0:.4),tz+rz*side-Math.cos(camYaw)*cp*dist);
 if(aim||P.dead)camera.position.copy(camera.position.lerp(want,1-Math.exp(-dt*22)));else camera.position.lerp(want,1-Math.exp(-dt*(c||a?9:14)));
 camera.position.y=Math.max(camera.position.y,groundY(camera.position.x,camera.position.z)+.4);
 if(aim){camera.lookAt(tmpV.set(camera.position.x+Math.sin(camYaw)*cp*50,camera.position.y-spp*50,camera.position.z+Math.cos(camYaw)*cp*50));}
 else camera.lookAt(tx,ty+.3,tz);
 if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*2.5);}
 const vs=c?Math.abs(c.speed):a?(a.type==='heli'?a.vel.length():a.speed)*.5:0;
 const fov=sc?14:aim?48:62+Math.min(vs,48)*.35;if(Math.abs(camera.fov-fov)>.1){camera.fov+=(fov-camera.fov)*Math.min(1,dt*(sc?20:6));camera.updateProjectionMatrix();}
 updateSky(dt);
 if(AC){const t=AC.currentTime;const eng=c?42+Math.abs(c.speed)*4.2:a?(a.type==='heli'?28+a.spool*20:60+a.speed*2.2):42;
  engOsc.frequency.setTargetAtTime(eng,t,.05);engGain.gain.setTargetAtTime(c||a?.05:0,t,.1);
  let nd2=1e9;for(const p of police)nd2=Math.min(nd2,Math.hypot(p.pos.x-P.pos.x,p.pos.z-P.pos.z));
  sirGain.gain.setTargetAtTime(wanted>0&&nd2<160?.035*(1-nd2/160):0,t,.1);sirOsc.frequency.setTargetAtTime((time%1)<.5?720:960,t,.02);}
 // ---------- HUD ----------
 shownMoney+=(P.money-shownMoney)*Math.min(1,dt*6);$('money').textContent='$'+Math.round(shownMoney).toLocaleString('de-DE');
 if(frame%6===0){let s='';for(let i=0;i<5;i++)s+=`<span class="${i<wanted?'on':'off'}">★</span>`;$('stars').innerHTML=s;$('stars').className=wanted>0&&police.length?'flash':'';}
 $('timer').textContent=mTimer!=null?`⏱ ${Math.floor(mTimer/60)}:${String(Math.floor(mTimer%60)).padStart(2,'0')}`:'';
 if(c)$('speed').innerHTML=`${Math.round(Math.abs(c.speed)*3.6)}<small> km/h</small>`;
 else if(a)$('speed').innerHTML=`${Math.round((a.type==='heli'?a.vel.length():a.speed)*3.6)}<small> km/h · ${Math.max(0,Math.round(a.g.position.y))} m</small>`;
 else $('speed').innerHTML='';
 if(frame%3===0){const w=curW();let wh='';
  if(a)wh=a.armed?`<div class="wn">${a.name}</div><div class="ws">Linksklick MG · Rechtsklick Raketen</div>`:`<div class="wn">${a.name}</div>`;
  else if(!c){wh=`<div class="wn">${w.name}</div>`;if(!w.melee)wh+=reloadT>0?`<div class="wa">lädt …</div>`:`<div class="wa">${INV.clip[w.id]||0} <span style="font-size:18px;color:#ddd">/ ${INV.ammo[w.id]||0}</span></div>`;wh+=`<div class="ws">${aim?'':'Rechtsklick zielen · '}1–7 / Mausrad wechseln</div>`;}
  const we=$('weapon');if(we.innerHTML!==wh)we.innerHTML=wh;}
 const hp=Math.max(0,P.hp);const hb=$('hpbar');hb.style.width=hp+'%';hb.style.background=hp<30?'linear-gradient(90deg,#d42020,#ff6060)':'linear-gradient(90deg,#3ddc6a,#8cff8c)';
 hurtFade=Math.max(0,hurtFade-dt*1.5);$('hurt').style.opacity=Math.max(hurtFade,hp<30?.35+Math.sin(time*5)*.1:0);
 $('scope').style.display=sc?'block':'none';
 const cr=$('cross');const showGun=(!c&&!a&&!curW().melee)||(a&&a.armed&&a.type==='heli');cr.className=(showGun?'gun':'')+(hitT>0?' hit':'');cr.style.display=(c||P.dead||(a&&!(a.armed&&a.type==='heli')))?'none':'block';
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
 if(flyTutT>0){flyTutT-=dt;if(flyTutT<=0)setTut(mission&&mission.steps[si]?mission.steps[si].tut:'');}
 const st=mission?mission.steps[si]:null;
 $('mission').textContent=st?`${mission.name}: ${st.text}`:storyDone?'Freies Spiel':'';
 let hint='';if(!c&&!a&&!P.dead){const na=nearestAir(7.5);if(na)hint=`<k>E</k> Einsteigen (${na.name})`;else if(nearestCar(4.3))hint='<k>E</k> Einsteigen';else if(st&&st.car)hint='Steig in ein Auto ein (<k>E</k>)';}
 if(bustT>0)hint='<span style="color:#ff6060">Die Polizei nimmt dich gleich fest – hau ab!</span>';
 const he=$('hint');if(he.innerHTML!==hint)he.innerHTML=hint;
 if(bigT>0){bigT-=dt;if(bigT<=0)$('big').style.opacity=0;}
 if(dialogT>0){dialogT-=dt;if(dialogT<=0)$('dialog').innerHTML='';}
 if(frame%2===0)drawMini();
}
function menuCam(dt){
 time+=dt;worldTick(dt);
 if(mode==='title'){const a=time*.04;camera.position.set(Math.cos(a)*420,170,Math.sin(a)*420+100);camera.lookAt(0,30,60);}
 else{ // Editor: Kamera vor der Figur
  P.char.g.position.copy(P.pos);P.char.g.rotation.y=P.face+creatorYaw;animChar(P.char,Math.sin(time*1.5)*.04);
  const fx=Math.sin(P.face),fz=Math.cos(P.face);const camPos=tmpP.set(P.pos.x+fx*3.6,P.pos.y+1.35,P.pos.z+fz*3.6);
  camera.position.lerp(camPos,1-Math.exp(-dt*6));
  camera.lookAt(P.pos.x-fz*1.0,P.pos.y+1.0,P.pos.z+fx*1.0);
  if(Math.abs(camera.fov-50)>.1){camera.fov=50;camera.updateProjectionMatrix();}
 }
 updateSky(dt);
}
function loop(){
 requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;frame++;
 if(mode==='play')update(dt);else if(mode==='cine')cineUpdate(dt);else menuCam(dt);
 composer.render();
}
updateSky(0);
loop();
window.__openCreator=startIntro;
__status('Bereit! Klick auf NEUES SPIEL.');
if(window.__start)openCreator();
</script>
