<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Krawall-Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#10183a;font-family:"Arial Black","Trebuchet MS",Arial,sans-serif;color:#fff}
canvas#c{display:block;position:fixed;inset:0;touch-action:none}
.screen{position:fixed;inset:0;overflow:hidden}
.hidden{display:none!important}
.out{text-shadow:0 2px 0 #000,0 0 3px #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000}
.menu{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 40px,transparent 40px 80px),radial-gradient(circle at 50% 45%,#2f7bf5 0%,#1d47b8 45%,#10183a 100%)}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:2}
.prof{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer}
.ava{width:46px;height:46px;border-radius:10px;background:#ffc312;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:24px}
.prof b{font-size:17px}
.tro{font-size:15px;color:#ffd84d}
.cur{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-size:15px}
.ico{font-size:18px;padding:6px 10px;border-radius:12px}
.side{position:absolute;left:10px;top:50%;transform:translateY(-45%);display:flex;flex-direction:column;gap:8px;z-index:2}
.sbtn{position:relative;width:clamp(58px,8vw,78px);height:clamp(54px,8vw,70px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:clamp(20px,3vw,26px);padding:0;border-radius:14px;
 background:linear-gradient(#5aa9ff,#2563d6);color:#fff;box-shadow:0 4px 0 #123b8a,0 6px 10px rgba(0,0,0,.4);border:3px solid #0b1f4d}
.sbtn span{font-size:clamp(9px,1.4vw,12px)}
.sbtn i,.badge{position:absolute;top:-6px;right:-6px;background:#ff3b3b;color:#fff;border:2px solid #000;border-radius:12px;font-style:normal;font-size:12px;padding:0 6px;min-width:22px;text-align:center}
.sbtn i:empty{display:none}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
#prev{width:clamp(180px,32vh,300px);height:clamp(180px,32vh,300px)}
.fname{font-size:clamp(24px,4vw,38px);margin-top:-10px}
.fsub{font-size:15px;opacity:.95}
.playbox{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:2}
.modebtn{background:linear-gradient(#ffffff,#d6e4ff);color:#123;font-size:16px;border:3px solid #000;border-radius:14px;padding:8px 16px;box-shadow:0 4px 0 #6b7fa8;min-width:210px;text-align:left}
.modebtn small{display:block;font-size:11px;opacity:.7;font-family:Arial}
.play{font-size:clamp(28px,5vw,42px);padding:14px 40px;border:4px solid #000;border-radius:18px;background:linear-gradient(#fff36b,#ffc312 55%,#f39c12);color:#000;box-shadow:0 7px 0 #a8630a,0 10px 18px rgba(0,0,0,.5);letter-spacing:1px}
.credits{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:Arial;font-size:11px;opacity:.6;white-space:nowrap}
button{font-family:inherit;cursor:pointer;border:3px solid #000;border-radius:12px;padding:10px 18px;font-size:17px;color:#000;background:linear-gradient(#fff36b,#ffc312);box-shadow:0 4px 0 #a8630a;transition:transform .07s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8630a}
button.blue{background:linear-gradient(#7fd1ff,#3a86ff);color:#fff;box-shadow:0 4px 0 #1d4fb8}
button.green{background:linear-gradient(#9cf58f,#2ecc40);color:#fff;box-shadow:0 4px 0 #1b7a26}
button.gray{background:#8a8fa3;color:#eee;box-shadow:0 4px 0 #4a4f63}
button.red{background:linear-gradient(#ff8a8a,#e8413c);color:#fff;box-shadow:0 4px 0 #8a1f1b}
button.sm{font-size:14px;padding:7px 12px}
#panel{background:rgba(5,10,30,.82);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#panel .box{background:linear-gradient(#2b5fd9,#1a3a8f);border:4px solid #000;border-radius:20px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#panel h2{font-size:28px;text-align:center}
.row{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:2px solid rgba(0,0,0,.4);border-radius:14px;padding:10px}
.row .grow{flex:1}
.row small,.desc{font-family:Arial;font-weight:normal;font-size:13px;opacity:.9;display:block}
.done{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fc{background:rgba(0,0,0,.3);border:3px solid #000;border-radius:14px;padding:6px;text-align:center;cursor:pointer;position:relative}
.fc canvas{width:100%;height:auto}
.fc .bar{height:6px;border-radius:3px;margin:3px 0}
.fc.locked{filter:grayscale(.9) brightness(.6)}
.fc .lv{position:absolute;top:6px;left:6px;background:#000;border-radius:8px;font-size:12px;padding:1px 6px}
.big{font-size:42px;text-align:center}
.reward{font-size:21px;text-align:center;line-height:1.7}
.prog{height:16px;background:rgba(0,0,0,.45);border:2px solid #000;border-radius:9px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(#9cf58f,#2ecc40)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px var(--g))}50%{filter:drop-shadow(0 0 26px var(--g))}}
.pop{animation:pop .4s ease-out}
.drop{width:150px;height:150px;margin:6px auto;border:5px solid #000;border-radius:28px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;animation:glow 1s infinite}
.drop span{transform:rotate(-45deg);font-size:54px}
.drop.sh{animation:shake .2s 3,glow 1s infinite}
#mm,#vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:8}
#mm{background:radial-gradient(circle,#2f7bf5,#10183a)}
#vs{background:linear-gradient(180deg,#e8413c 0%,#7a1020 49.5%,#000 49.5%,#000 50.5%,#10307a 50.5%,#3a86ff 100%)}
.vsrow{display:flex;gap:14px;justify-content:center}
.vsc{background:rgba(0,0,0,.35);border:3px solid #000;border-radius:14px;padding:6px;text-align:center;width:clamp(90px,14vw,140px)}
.vsc canvas{width:100%}
.vsc div{font-size:12px;font-family:Arial;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstxt{font-size:64px;color:#ffc312}
.spin{width:60px;height:60px;border:8px solid rgba(255,255,255,.25);border-top-color:#ffc312;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#exitBtn{position:fixed;top:8px;left:8px;z-index:5;font-size:15px;padding:6px 11px}
input.nm{font:inherit;font-size:20px;padding:8px;border:3px solid #000;border-radius:10px;width:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen menu">
 <div class="topbar">
  <div class="prof" id="profBtn"><div class="ava">😎</div><div><b id="pName" class="out"></b><div class="tro out">🏆 <span id="mTro"></span></div></div></div>
  <div class="cur">

   <span class="pill out">💎 <span id="mGems"></span></span>
   <button class="ico blue" id="muteBtn">🔊</button>
  </div>
 </div>
 <div class="side">
  <button class="sbtn" id="bShop">🛒<span class="out">Shop</span><i id="shopBadge"></i></button>

  <button class="sbtn" id="bRoad">🏆<span class="out">Pfad</span><i id="roadBadge"></i></button>
  <button class="sbtn" id="bOnline">🌐<span class="out">Online</span></button>
  <button class="sbtn" id="bDrops">🎁<span class="out">Drops</span><i id="dropBadge"></i></button>
 </div>
 <div class="center" id="centerF"><canvas id="prev" width="300" height="300"></canvas><div class="fname out" id="selName"></div><div class="fsub out" id="selSub"></div></div>
 <div class="playbox"><button class="modebtn" id="bMode"></button><button class="play out" id="bPlay" style="color:#fff">SPIELEN</button></div>
 <div class="credits">Ideen von Valle, JavaScript von Claude.ai</div>
</div>

<div id="mm" class="screen hidden"><div class="spin"></div><div class="big out" id="mmTxt">Spieler werden gesucht…</div><div class="out" id="mmMode"></div></div>
<div id="vs" class="screen hidden"><div class="vsrow" id="vsTop"></div><div class="vstxt out">VS</div><div class="vsrow" id="vsBot"></div></div>
<div id="panel" class="screen hidden"><div class="box"><div id="pBody"></div><button id="pClose" class="red">Zurück</button></div></div>
<button id="exitBtn" class="gray hidden">✕</button>

<script>
"use strict";
// =====================================================================
//  DATEN
// =====================================================================
const T=48;
let COLS=21,ROWS=31,MW=COLS*T,MH=ROWS*T;
const RAR=['Start','Selten','Super selten','Episch','Mythisch','Legendär'];
const RARC=['#b0bec5','#2ecc71','#3498db','#a55eea','#ff4757','#ffc312'];
const F={
 funke:{name:'Funke',role:'Schütze',rar:0,hp:3400,spd:205,range:430,reload:1.3,sc:4200,pspd:950,col:'#ffb703',skin:'#ffd9a8',dmgTxt:'3 × 360',
  atk:'Feuert 3 schnelle Schüsse hintereinander.',sup:'Kugelfächer: 12 Kugeln auf einmal.',gad:'Turbo: 3 Sekunden lang 50 % schneller.',star:'Heiße Kugeln: +12 % Schaden.'},
 schrot:{name:'Schrot',role:'Panzer',rar:1,hp:5600,spd:185,range:290,reload:1.5,sc:3600,pspd:820,col:'#e76f51',skin:'#f1c27d',dmgTxt:'5 × 300',
  atk:'Streuschuss mit 5 Kugeln auf kurze Distanz.',sup:'Rammsprint: rennt durch Gegner und Wände.',gad:'Schutzschild: 3 Sekunden nur halber Schaden.',star:'Dickhäuter: Rammsprint heilt 15 % Leben.'},
 pfeil:{name:'Pfeil',role:'Scharfschütze',rar:1,hp:2600,spd:200,range:680,reload:1.8,sc:3900,pspd:1400,col:'#2a9d8f',skin:'#e0ac69',dmgTxt:'1300',
  atk:'Ein präziser Fernschuss.',sup:'Durchschlag: Strahl geht durch Wände und Gegner.',gad:'Zielfernrohr: nächster Schuss macht doppelten Schaden.',star:'Adlerauge: +10 % Reichweite und +15 % Schaden.'},
 bummi:{name:'Bummi',role:'Werfer',rar:2,hp:2900,spd:195,range:400,reload:1.6,sc:4400,pspd:0,col:'#9b5de5',skin:'#ffe0bd',dmgTxt:'1100 (Fläche)',
  atk:'Wirft eine Bombe über Wände.',sup:'Mega-Bombe: riesige Explosion, sprengt Wände.',gad:'Mine: legt eine Mine, die kurz danach explodiert.',star:'Großer Knall: +25 % Explosionsradius.'},
 frosti:{name:'Frosti',role:'Kontrolle',rar:3,hp:3700,spd:205,range:460,reload:1.4,sc:4000,pspd:750,col:'#4cc9f0',skin:'#dff6ff',dmgTxt:'700 + langsam',
  atk:'Eiskugel, die Gegner verlangsamt.',sup:'Frostwelle: friert alle Gegner in der Nähe ein.',gad:'Eispanzer: heilt sofort 1200 Leben.',star:'Dauerfrost: Verlangsamung hält viel länger.'},
 moosi:{name:'Moosi',role:'Heiler',rar:3,hp:3200,spd:200,range:420,reload:1.5,sc:3800,pspd:0,col:'#57cc99',skin:'#c7f9cc',dmgTxt:'800 / heilt 500',
  atk:'Sporenwolke: schadet Gegnern und heilt Teamkollegen.',sup:'Heilblume: pflanzt eine Blume, die das Team heilt.',gad:'Erste Hilfe: heilt dich und Teamkollegen in der Nähe.',star:'Giftblüte: die Blume schadet auch Gegnern.'},
 schatten:{name:'Schatten',role:'Assassine',rar:4,hp:3600,spd:225,range:140,reload:1.1,sc:3000,pspd:0,col:'#3d3d5c',skin:'#2b2b44',dmgTxt:'1100 (Nahkampf)',
  atk:'Klingenhieb im Nahkampf.',sup:'Schattensprung: springt über Wände und schlägt ein.',gad:'Unsichtbar: 2,5 Sekunden unsichtbar.',star:'Jagdfieber: nach dem Sprung 3 Sekunden schneller.'},
 brumm:{name:'Brumm',role:'Unterstützer',rar:5,hp:3500,spd:200,range:520,reload:1.4,sc:4000,pspd:1000,col:'#f4a261',skin:'#f1c27d',dmgTxt:'950',
  atk:'Schraubenbolzen auf mittlere Distanz.',sup:'Geschützturm: baut einen Turm, der selbst schießt.',gad:'Überladung: Türme feuern 4 Sekunden doppelt so schnell.',star:'Stahlbau: Türme haben mehr Leben und Schaden.'}
};
const MODES={
 kristall:{name:'Kristallraub',icon:'💎',desc:'Sammelt 10 Kristalle und haltet sie 15 Sekunden.'},
 torball:{name:'Torball',icon:'⚽',desc:'Wer zuerst 2 Tore schießt, gewinnt.'},
 ueberleben:{name:'Überleben',icon:'☠️',desc:'Jeder gegen jeden. Sammle Kraftwürfel und überlebe!'},
 sternjagd:{name:'Sternjagd',icon:'⭐',desc:'Schaltet Gegner aus. Wer mehr Sterne hat, gewinnt.'}
};
const UPC=[0,20,35,75,140,290,480,800,1250],UPP=[0,20,30,50,80,130,210,340,550];
const ROAD=[{t:10,type:'coins',v:80},{t:30,type:'unlock',v:'schrot'},{t:60,type:'pp',v:60},{t:100,type:'unlock',v:'pfeil'},{t:150,type:'drop',v:2},
 {t:200,type:'unlock',v:'bummi'},{t:260,type:'coins',v:300},{t:330,type:'unlock',v:'frosti'},{t:420,type:'gems',v:30},{t:520,type:'unlock',v:'moosi'},
 {t:650,type:'drop',v:3},{t:800,type:'pp',v:300},{t:1000,type:'coins',v:1000},{t:1250,type:'drop',v:5},{t:1500,type:'gems',v:100}];
const PASS=(()=>{const a=[];for(let i=1;i<=25;i++){let r;if(i===10)r={type:'unlock',v:'schatten'};else if(i===25)r={type:'unlock',v:'brumm'};
 else if(i%4===1)r={type:'coins',v:80+i*10};else if(i%4===2)r={type:'pp',v:30+i*4};else if(i%4===3)r={type:'drop',v:1};else r={type:'gems',v:10};a.push(r);}return a;})();
const PASS_STEP=150, PRICE=[0,400,800,1500,3000,6000];
const BOTN=['Kralle','Zisch','Brummer','Wirbel','Knall','Flitz','Rumpel','Zacke','Sprotte','Muck','Wumms','Fetzer','Kobold','Blitzi','Kiesel','Fuchsi','Dröhn','Pixel','Tornado','Socke'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};

// =====================================================================
//  SPEICHERSTAND
// =====================================================================
function newSave(){const s={name:'Valle',coins:200,gems:0,pp:0,mode:'kristall',selected:'funke',road:[],pass:0,passClaimed:[],drops:1,gift:'',qDay:'',quests:[],dDay:'',dToday:0,muted:false,fighters:{},stats:{matches:0,wins:0}};
 for(const k in F)s.fighters[k]={unlocked:k==='funke',lvl:1,tro:0,best:0};return s;}
let save=newSave();
try{const s=JSON.parse(localStorage.getItem('krawall2'));if(s){const d=newSave();save=Object.assign(d,s);for(const k in F)if(!save.fighters[k])save.fighters[k]=d.fighters[k];}}catch(e){}
function persist(){try{localStorage.setItem('krawall2',JSON.stringify(save));}catch(e){}}
const totalTro=()=>Object.values(save.fighters).reduce((a,f)=>a+f.tro,0);
function giveReward(r){
 switch(r.type){
  case 'coins':save.coins+=r.v;return '🪙 '+r.v+' Münzen';
  case 'pp':save.pp+=r.v;return '⚡ '+r.v+' Kraftpunkte';
  case 'gems':save.gems+=r.v;return '💎 '+r.v+' Edelsteine';
  case 'drop':save.drops+=r.v;return '🎁 '+r.v+' Glücksdrop'+(r.v>1?'s':'');
  case 'unlock':{const f=save.fighters[r.v];if(f.unlocked){const c=PRICE[F[r.v].rar]/2|0;save.coins+=c;return F[r.v].name+' hast du schon → 🪙 '+c;}
   f.unlocked=true;return '🎉 NEUER KÄMPFER: <b style="color:'+RARC[F[r.v].rar]+'">'+F[r.v].name+'</b>!';}
 }return '';
}
function rewardLabel(r){return r.type==='coins'?'🪙 '+r.v:r.type==='pp'?'⚡ '+r.v:r.type==='gems'?'💎 '+r.v:r.type==='drop'?'🎁 ×'+r.v:'🔓 '+F[r.v].name;}

// =====================================================================
//  HILFEN & SOUND
// =====================================================================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return Math.abs(d);};
let AC=null;const sfxLast={};
function sfx(t){
 if(save.muted)return;const now=performance.now();if(sfxLast[t]&&now-sfxLast[t]<45)return;sfxLast[t]=now;
 try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const P={shot:[520,180,0.07,'square',0.035],hit:[220,90,0.08,'sawtooth',0.04],hurt:[160,60,0.15,'sawtooth',0.06],kill:[300,900,0.25,'triangle',0.08],
   pick:[880,1320,0.1,'sine',0.06],super:[180,820,0.32,'sawtooth',0.06],boom:[120,40,0.3,'square',0.07],goal:[400,1200,0.5,'triangle',0.1],
   win:[500,1000,0.6,'triangle',0.09],lose:[400,120,0.6,'triangle',0.08],click:[700,900,0.04,'sine',0.04]}[t];if(!P)return;
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=P[3];o.frequency.setValueAtTime(P[0],n);o.frequency.exponentialRampToValueAtTime(P[1],n+P[2]);
  g.gain.setValueAtTime(P[4],n);g.gain.exponentialRampToValueAtTime(0.0001,n+P[2]);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+P[2]+0.02);}catch(e){}
}
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR,SC;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
 cv.style.width=W+'px';cv.style.height=H+'px';SC=clamp(Math.min(W/1000,H/820),0.45,1.3);}
addEventListener('resize',resize);resize();
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// =====================================================================
//  FIGUREN ZEICHNEN (eigene Designs)
// =====================================================================
function drawChar(c,x,y,type,face,walk,ring,s,alpha){
 const d=F[type];s=s||1;c.save();c.translate(x,y);c.scale(s,s);if(alpha!=null)c.globalAlpha=alpha;
 if(ring){c.strokeStyle=ring;c.lineWidth=4;c.beginPath();c.ellipse(0,16,27,12,0,0,7);c.stroke();}
 c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(0,16,22,9,0,0,7);c.fill();
 const sw=Math.sin(walk)*5,back=Math.sin(face)<-0.45;
 c.fillStyle='#1d1d2b';c.beginPath();c.ellipse(-8,14-Math.max(0,sw),6,4.5,0,0,7);c.fill();c.beginPath();c.ellipse(8,14-Math.max(0,-sw),6,4.5,0,0,7);c.fill();
 c.translate(0,-Math.abs(Math.sin(walk))*2);
 if(back)drawWeapon(c,type,face);
 c.lineWidth=3;c.strokeStyle='#1d1d2b';
 rr(c,-14,-10,28,24,9);c.fillStyle=d.col;c.fill();c.stroke();
 if(type==='brumm'||type==='schrot'){c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-9,-9,4,20);c.fillRect(5,-9,4,20);}

const solidMove=c=>c==='#'||c==='X'||c==='~'||c==='G';

function blank(){const g=[];for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push((x===0||y===0||x===COLS-1||y===ROWS-1)?'X':'.');g.push(r);}return g;}
function fillRect(g,x,y,w,h,ch,only){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(yy>0&&xx>0&&yy<ROWS-1&&xx<COLS-1&&(!only||g[yy][xx]===only))g[yy][xx]=ch;}
function clearArea(g,cx,cy,r){for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(Math.hypot(x-cx,y-cy)<=r&&g[y][x]!=='G')g[y][x]='.';}

  if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen[n]||solidMove(g[ny][nx]))continue;seen[n]=1;q.push(n);}}
 return list.every(p=>seen[p[1]*COLS+p[0]]);
}
const SHAPES=[[1,3],[3,1],[2,2],[1,4],[4,1],[2,3],[3,2],[4,2]];
function genTeamMap(mode){
 COLS=21;ROWS=31;MW=COLS*T;MH=ROWS*T;
 for(let tries=0;tries<40;tries++){
  const g=blank(),hy=15;
  const nw=mode==='torball'?7:11;
  for(let i=0;i<nw;i++){const[w,h]=SHAPES[rnd(SHAPES.length)];fillRect(g,1+rnd(COLS-1-w),4+rnd(hy-4-h),w,h,'#');}
  if(mode!=='torball')for(let i=0;i<2;i++){const w=2+rnd(2),h=1+rnd(2);fillRect(g,1+rnd(COLS-1-w),4+rnd(hy-4-h),w,h,'~','.');}
  for(let i=0;i<7;i++){const w=2+rnd(3),h=2+rnd(2);fillRect(g,1+rnd(COLS-1-w),3+rnd(hy-3-h),w,h,'*','.');}
  for(let y=0;y<hy;y++)for(let x=0;x<COLS;x++)g[ROWS-1-y][COLS-1-x]=g[y][x];
  for(let x=0;x<10;x++)g[hy][COLS-1-x]=g[hy][x];
  clearArea(g,10,15,2.3);
  const sp=[[7,2],[10,2],[13,2],[7,ROWS-3],[10,ROWS-3],[13,ROWS-3]];
  for(const s of sp)clearArea(g,s[0],s[1],1.5);
  if(mode==='torball'){for(let x=8;x<=12;x++){g[0][x]='G';g[ROWS-1][x]='G';}fillRect(g,6,1,9,3,'.');fillRect(g,6,ROWS-4,9,3,'.');}
  if(reachable(g,[10,ROWS-3],sp.concat([[10,15]])))return{g,sp};
 }

}
function genSoloMap(){

  const g=blank();

  for(let i=0;i<8;i++){const w=2+rnd(2),h=2+rnd(2);fillRect(g,1+rnd(15-w),1+rnd(15-h),w,h,'*','.');}
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=g[y][x];g[y][COLS-1-x]=c;g[ROWS-1-y][x]=c;g[ROWS-1-y][COLS-1-x]=c;}
  clearArea(g,15,15,2);for(const s of sp)clearArea(g,s[0],s[1],1.5);

function tileAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return 'X';return G.map[ty][tx];}

 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  const c=(tx<0||ty<0||tx>=COLS||ty>=ROWS)?'X':G.map[ty][tx];if(!fn(c))continue;
  const nx=clamp(x,tx*T,tx*T+T),ny=clamp(y,ty*T,ty*T+T);if((x-nx)**2+(y-ny)**2<r*r)return true;}

function moveCircle(e,dx,dy,fn){fn=fn||solidMove;let ok=true;e.x+=dx;if(collides(e.x,e.y,e.r,fn)){e.x-=dx;ok=false;}e.y+=dy;if(collides(e.x,e.y,e.r,fn)){e.y-=dy;ok=false;}return ok;}
function LOS(x1,y1,x2,y2,fn){fn=fn||solidShot;const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/14);

function freeSpot(x,y,r){if(!collides(x,y,r,solidMove))return{x,y};for(let rad=12;rad<300;rad+=12)for(let a=0;a<6.28;a+=0.4){const nx=x+Math.cos(a)*rad,ny=y+Math.sin(a)*rad;if(!collides(nx,ny,r,solidMove))return{x:nx,y:ny};}return{x,y};}
function bfsPath(sx,sy,gx,gy){
 if(gx<0||gy<0||gx>=COLS||gy>=ROWS||sx<0||sy<0||sx>=COLS||sy>=ROWS)return null;
 const N=COLS*ROWS,prev=new Int32Array(N).fill(-1),q=new Int32Array(N);let h=0,t=0;const s=sy*COLS+sx,goal=gy*COLS+gx;prev[s]=s;q[t++]=s;
 while(h<t){const c=q[h++];if(c===goal)break;const cx=c%COLS,cy=(c/COLS)|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const n=ny*COLS+nx;
   if(prev[n]>=0||solidMove(G.map[ny][nx]))continue;prev[n]=c;q[t++]=n;}}
 if(prev[goal]<0)return null;const path=[];let c=goal;while(c!==s){path.push(c);c=prev[c];}return path.reverse();
}

 if(src&&src.kind==='f'&&src!==t){if(!o.noCharge)src.sc=Math.min(1,src.sc+dmg/F[src.type].sc);src.dmgDone+=dmg;}
 if(fx&&t.kind==='f'){if(fx.slow)t.slow=Math.max(t.slow,fx.slow);if(fx.stun)t.stun=Math.max(t.stun,fx.stun);}
 if(!o.silent&&dmg>=50)G.floats.push({x:t.x+(Math.random()-.5)*20,y:t.y-46,text:Math.round(dmg),t:0.8,color:t.isP?'#ff6b6b':'#fff'});
 if(t.isP)sfx('hurt');else if(src&&src.isP)sfx('hit');
 if(t.hp<=0){
  if(t.kind==='f')kill(t,src);
  else{t.dead=true;spark(t.x,t.y,t.kind==='box'?'#c08552':'#999',16);
   if(t.kind==='box')G.picks.push({kind:'cube',x:t.x,y:t.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100});}
 }
}
function kill(t,src){
 const aliveBefore=G.fighters.filter(f=>!f.dead).length;
 t.dead=true;t.hp=0;t.burst=[];t.dash=null;t.leap=null;t.deaths++;t.respawn=G.mode==='kristall'?5:3;t.place=aliveBefore;t.invis=0;
 for(let i=0;i<24;i++){const a=Math.random()*7,s=80+Math.random()*260;G.parts.push({x:t.x,y:t.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.7,max:0.7,r:4+Math.random()*4,color:F[t.type].col});}
 for(let i=0;i<t.crystals;i++){const a=Math.random()*7;G.picks.push({kind:'crystal',x:t.x,y:t.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220});}t.crystals=0;
 if(G.mode==='ueberleben'){const n=Math.max(1,t.cubes);for(let i=0;i<n;i++){const a=Math.random()*7;G.picks.push({kind:'cube',x:t.x,y:t.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180});}}
 if(G.ball&&G.ball.carrier===t)G.ball.carrier=null;
 const killer=src&&src.kind==='f'?src:null;
 if(killer&&killer.team!==t.team){killer.kills++;if(G.mode==='sternjagd')G.score[killer.team]++;}
 G.feed.unshift({a:killer?killer.name:'☠ Gift',at:killer?killer.team:null,b:t.name,bt:t.team,t:5});if(G.feed.length>5)G.feed.pop();
 if(killer&&killer.isP)sfx('kill');
}
function respawn(f){const p=freeSpot(f.spawn.x,f.spawn.y,f.r);f.dead=false;f.hp=f.maxHp;f.ammo=3;f.x=p.x;f.y=p.y;f.slow=0;f.stun=0;f.lastHurt=G.time;f.invis=0;}
function spark(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=60+Math.random()*180;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.35,max:0.35,r:3,color});}}
function explode(p){
 for(const o of targets())if(!o.dead&&o.team!==p.team&&Math.hypot(o.x-p.tx,o.y-p.ty)<p.rad+o.r*0.5)hurt(o,p.dmg,p.owner);
 if(p.heal)for(const f of G.fighters)if(!f.dead&&f.team===p.team&&Math.hypot(f.x-p.tx,f.y-p.ty)<p.rad+f.r)heal(f,p.heal);
 if(p.breakWalls){for(let ty=1;ty<ROWS-1;ty++)for(let tx=1;tx<COLS-1;tx++){const c=G.map[ty][tx];
  if((c==='#'||c==='*')&&Math.hypot(tx*T+T/2-p.tx,ty*T+T/2-p.ty)<p.rad){G.map[ty][tx]='.';G.mapVer=(G.mapVer||0)+1;spark(tx*T+T/2,ty*T+T/2,c==='#'?'#c08552':'#40916c',8);}}}
 G.parts.push({ring:true,x:p.tx,y:p.ty,r:p.rad,t:0.35,max:0.35,color:p.spore?'#80ed99':'#ffd166'});
 spark(p.tx,p.ty,p.spore?'#80ed99':'#ff9f1c',p.big?30:12);
 if(!p.spore&&Math.hypot(p.tx-G.player.x,p.ty-G.player.y)<700)sfx('boom');
}
function kickBall(f,tx,ty,spd){const b=G.ball,a=Math.atan2(ty-f.y,tx-f.x);b.carrier=null;b.x=f.x+Math.cos(a)*30;b.y=f.y+Math.sin(a)*30;
 if(collides(b.x,b.y,b.r,solidBall)){b.x=f.x;b.y=f.y;}b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.noPick=f;b.noPickT=0.35;b.kicker=f;f.face=a;if(f.isP)sfx('shot');}

function setupMatch(mode,humans){
 const solo=mode==='ueberleben';
 const {g,sp}=solo?genSoloMap():genTeamMap(mode);
 G={mode,map:g,time:0,fighters:[],proj:[],parts:[],floats:[],feed:[],picks:[],deps:[],boxes:[],mines:[],over:false,score:[0,0],
  timeLeft:mode==='kristall'?150:mode==='torball'?150:120,intro:3.2,pause:0,banner:null,cdTeam:-1,cd:15,mineT:3,gas:0,cam:{x:0,y:0}};
 const pType=save.selected,pLvl=save.fighters[pType].lvl;
 G.skill=clamp(0.3+save.fighters[pType].tro/700,0.3,0.92);
 const types=Object.keys(F),names=shuffle(BOTN);let ni=0;
 const bot=(team)=>{const ty=types[rnd(types.length)];return mkF(ty,team,clamp(pLvl+rnd(3)-1,1,9),false,names[ni++]);};
 humans=humans||[Object.assign(myInfo(),{id:'host',team:0})];
 const mkH=h=>{const f=mkF(h.type,h.team,h.lvl,h.id==='host',h.name||'Du');if(h.id!=='host'){f.remote=true;f.netId=h.id;}return f;};
 if(!solo){const t1=humans.filter(h=>h.team===1).map(mkH),t0=humans.filter(h=>h.team===0).map(mkH);
  while(t1.length<3)t1.push(bot(1));while(t0.length<3)t0.splice(t0.length===1?0:t0.length,0,bot(0));G.fighters=t1.concat(t0);}
 else{G.fighters=humans.map((h,i)=>mkH(Object.assign({},h,{team:i})));for(let i=G.fighters.length;i<10;i++)G.fighters.push(bot(i));
  const free=[];for(let y=2;y<ROWS-2;y++)for(let x=2;x<COLS-2;x++)if(g[y][x]==='.'&&sp.every(s=>Math.hypot(s[0]-x,s[1]-y)>3)&&Math.hypot(x-15,y-15)>2)free.push([x,y]);
  for(const [x,y] of shuffle(free).slice(0,16))G.boxes.push({kind:'box',team:-1,x:x*T+T/2,y:y*T+T/2,r:24,hp:3600,maxHp:3600,dead:false});}
 G.fighters.forEach((f,i)=>{f.spawn={x:sp[i][0]*T+T/2,y:sp[i][1]*T+T/2};f.x=f.spawn.x;f.y=f.spawn.y;});
 if(solo)G.fighters.forEach(f=>f.face=Math.atan2(MH/2-f.y,MW/2-f.x));
 if(mode==='torball')G.ball={x:MW/2,y:MH/2,vx:0,vy:0,r:14,carrier:null,noPick:null,noPickT:0,kicker:null};
 G.player=G.fighters.find(f=>f.isP);
}

const keys={},mouse={x:0,y:0,down:false};
const TS={move:null,atk:null,sup:null,isTouch:false};
function ctrlPos(){return{atk:{x:W-105,y:H-110,r:58},sup:{x:W-235,y:H-75,r:42},gad:{x:W-80,y:H-235,r:30}};}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
 if(G&&!G.over){if(k===' '||k==='e'){playerSuper();e.preventDefault();}if(k==='f'||k==='q')pGadget();}
 if(G&&k==='escape')leaveMatch();});

cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mousedown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(!G||G.over)return;
 if(e.button===0){mouse.down=true;const w=mouseWorld();pAttack(w.x,w.y);}else if(e.button===2)playerSuper();});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function mouseWorld(){return{x:mouse.x/SC+G.cam.x,y:mouse.y/SC+G.cam.y};}
function autoTarget(f,range){let best=null,bd=range;
 for(const o of G.fighters){if(o.dead||o.team===f.team||!visibleTo(o,f))continue;const d=dist(o,f);if(d<bd){bd=d;best=o;}}
 if(!best)for(const o of G.deps.concat(G.boxes)){if(o.dead||o.team===f.team)continue;const d=dist(o,f);if(d<bd){bd=d;best=o;}}
 return best;}
function playerSuper(dir){
 const p=G.player;if(p.dead||p.sc<1)return;
 if(ballCarrier(p)){const tg=G.player.team===0?{x:MW/2,y:0}:{x:MW/2,y:MH};if(dir)pSuper(p.x+dir.x*500,p.y+dir.y*500);else if(TS.isTouch)pSuper(tg.x,tg.y);else{const w=mouseWorld();pSuper(w.x,w.y);}return;}
 if(dir){pSuper(p.x+dir.x,p.y+dir.y);return;}
 if(TS.isTouch){const t=autoTarget(p,rangeOf(p)*1.3);if(t)pSuper(t.x,t.y);else pSuper(p.x+Math.cos(p.face)*250,p.y+Math.sin(p.face)*250);}
 else{const w=mouseWorld();pSuper(w.x,w.y);}
}
cv.addEventListener('touchstart',e=>{e.preventDefault();TS.isTouch=true;if(!G||G.over)return;const cp=ctrlPos();
 for(const t of e.changedTouches){const x=t.clientX,y=t.clientY,o={id:t.identifier,x,y};
  if(!TS.atk&&Math.hypot(x-cp.atk.x,y-cp.atk.y)<cp.atk.r+30){TS.atk=Object.assign(o,{ox:cp.atk.x,oy:cp.atk.y});}
  else if(!TS.sup&&Math.hypot(x-cp.sup.x,y-cp.sup.y)<cp.sup.r+22){TS.sup=Object.assign(o,{ox:cp.sup.x,oy:cp.sup.y});}
  else if(Math.hypot(x-cp.gad.x,y-cp.gad.y)<cp.gad.r+18){pGadget();}
  else if(!TS.move&&x<W*0.6){TS.move=Object.assign(o,{ox:x,oy:y});}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)for(const k of['move','atk','sup'])if(TS[k]&&TS[k].id===t.identifier){TS[k].x=t.clientX;TS[k].y=t.clientY;}},{passive:false});
function stickDir(s,R){const dx=s.x-s.ox,dy=s.y-s.oy,l=Math.hypot(dx,dy);if(l<18)return null;const k=Math.min(1,l/60)*R;return{x:dx/l*k,y:dy/l*k};}
function touchEnd(e){for(const t of e.changedTouches){
 if(TS.move&&TS.move.id===t.identifier)TS.move=null;
 if(TS.atk&&TS.atk.id===t.identifier){const s=TS.atk;TS.atk=null;if(!G||G.over)continue;const p=G.player,R=rangeOf(p),d=stickDir(s,R);
  if(ballCarrier(p)){if(d)pAttack(p.x+d.x,p.y+d.y);else pAttack(MW/2,p.team===0?0:MH);continue;}
  if(d)pAttack(p.x+d.x,p.y+d.y);else{const tg=autoTarget(p,R*1.05);if(tg)pAttack(tg.x,tg.y);else pAttack(p.x+Math.cos(p.face)*R,p.y+Math.sin(p.face)*R);}}
 if(TS.sup&&TS.sup.id===t.identifier){const s=TS.sup;TS.sup=null;if(!G||G.over)continue;const d=stickDir(s,rangeOf(G.player));playerSuper(d);}}}
cv.addEventListener('touchend',touchEnd);cv.addEventListener('touchcancel',touchEnd);
$('exitBtn').addEventListener('click',leaveMatch);

function steerTo(b,x,y){
 if(walkLOS(b.x,b.y,x,y)){const dx=x-b.x,dy=y-b.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l};}
 const ai=b.ai,gx=Math.floor(x/T),gy=Math.floor(y/T),key=gx+','+gy;
 if(!ai.path||ai.pathKey!==key||G.time>ai.pathT){ai.path=bfsPath(Math.floor(b.x/T),Math.floor(b.y/T),gx,gy);ai.pathKey=key;ai.pathT=G.time+0.6;}
 const P=ai.path;if(!P||!P.length){const dx=x-b.x,dy=y-b.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l};}
 const cen=i=>({x:(P[i]%COLS)*T+T/2,y:((P[i]/COLS)|0)*T+T/2});
 while(P.length>1&&Math.hypot(cen(0).x-b.x,cen(0).y-b.y)<26)P.shift();
 let tg=cen(0);for(let i=Math.min(4,P.length-1);i>0;i--){const c=cen(i);if(walkLOS(b.x,b.y,c.x,c.y)){tg=c;break;}}
 const dx=tg.x-b.x,dy=tg.y-b.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l};
}
function inGas(x,y,m){m=m||0;return G.mode==='ueberleben'&&(x<G.gas+m||y<G.gas+m||x>MW-G.gas-m||y>MH-G.gas-m);}
function botThink(b,dt){
 const ai=b.ai,d=F[b.type],R=rangeOf(b);ai.t-=dt;ai.cd-=dt;ai.wpT-=dt;
 let tgt=null,bs=1e9;
 for(const o of G.fighters){if(o.team===b.team||o.dead||!visibleTo(o,b))continue;const dd=dist(b,o);if(dd>(G.mode==='ueberleben'?560:850))continue;
  let s=dd*(o.hp<o.maxHp*0.4?0.8:1);if(ballCarrier(o))s*=0.5;if(s<bs){bs=s;tgt=o;}}
 const tgtD=tgt?dist(b,tgt):1e9;
 let sec=null;if(!tgt||tgtD>R*1.2){let sd=G.mode==='ueberleben'?650:R*1.1;for(const o of G.deps.concat(G.boxes)){if(o.dead||o.team===b.team)continue;const dd=dist(b,o);if(dd<sd){sd=dd;sec=o;}}}
 let goal=null,retreat=false,noShoot=false;
 const carrying=ballCarrier(b),mates=G.fighters.filter(f=>f.team===b.team&&!f.dead);
 if(G.mode==='kristall'){
  const lead=G.cdTeam===b.team;
  if(b.crystals>=4||(lead&&b.crystals>0&&tgt&&tgtD<500)){goal=b.spawn;retreat=true;}
  else{let best=null,bd=lead?400:900;for(const c of G.picks){if(c.kind!=='crystal')continue;const dd=Math.hypot(c.x-b.x,c.y-b.y);if(dd<bd){bd=dd;best=c;}}
   if(best)goal={x:best.x,y:best.y};else if(mates.indexOf(b)===0&&!lead)goal={x:MW/2,y:MH/2+(b.team===0?60:-60)};}
 } else if(G.mode==='torball'){
  const ball=G.ball,eg={x:MW/2,y:b.team===0?T*0.5:MH-T*0.5},og={x:MW/2,y:b.team===0?MH-T*2:T*2};
  if(carrying){goal=eg;noShoot=true;const dg=dist(b,eg);
   if(dg<500&&LOS(b.x,b.y,eg.x,eg.y,solidBall))attack(b,eg.x+(Math.random()-.5)*80,eg.y);
   else if(b.sc>=1&&dg<850&&LOS(b.x,b.y,eg.x,eg.y,solidBall))useSuper(b,eg.x,eg.y);
   else if(tgt&&tgtD<140){const mate=mates.find(m=>m!==b&&dist(m,eg)<dg-100);if(mate)attack(b,mate.x,mate.y);}}
  else if(!ball.carrier){let closest=mates.slice().sort((p,q)=>dist(p,ball)-dist(q,ball));
   if(closest[0]===b||closest[1]===b&&dist(b,ball)<300)goal={x:ball.x,y:ball.y};else if(closest[closest.length-1]===b)goal={x:(ball.x+og.x)/2,y:(ball.y*0.4+og.y*0.6)};}
  else if(ball.carrier.team===b.team){goal={x:ball.carrier.x+(b.x<ball.carrier.x?-120:120),y:ball.carrier.y+(b.team===0?-150:150)};}
  else{if(visibleTo(ball.carrier,b)){tgt=ball.carrier;}goal={x:ball.carrier.x,y:ball.carrier.y};}
 } else if(G.mode==='ueberleben'){
  if(inGas(b.x,b.y,90)){goal={x:MW/2,y:MH/2};}
  else{let best=null,bd=550;for(const c of G.picks){if(c.kind!=='cube'||inGas(c.x,c.y,40))continue;const dd=Math.hypot(c.x-b.x,c.y-b.y);if(dd<bd){bd=dd;best=c;}}
   if(best&&(!tgt||tgtD>300))goal={x:best.x,y:best.y};
   else if(!tgt&&sec&&sec.kind==='box'&&dist(b,sec)>R*0.8)goal={x:sec.x,y:sec.y};}
 }
 if(b.hp<b.maxHp*0.3&&tgt&&tgtD<R*1.1&&G.mode!=='torball'){retreat=true;}
 let mv={x:0,y:0};
 if(goal&&(carrying||retreat&&G.mode==='kristall'||!tgt||tgtD>R*1.1||inGas(b.x,b.y,60))){mv=steerTo(b,goal.x,goal.y);if(Math.hypot(goal.x-b.x,goal.y-b.y)<20)mv={x:0,y:0};}
 else if(tgt){
  const lobber=b.type==='bummi'||b.type==='moosi';
  if(!lobber&&!LOS(b.x,b.y,tgt.x,tgt.y)){mv=steerTo(b,tgt.x,tgt.y);}
  else{const dx=tgt.x-b.x,dy=tgt.y-b.y,dd=tgtD||1,ux=dx/dd,uy=dy/dd,want=R*0.7;let fwd=0;
   if(retreat)fwd=-1;else if(dd>want)fwd=1;else if(dd<want*0.5)fwd=-0.7;
   if(ai.t<=0){ai.t=0.5+Math.random()*1.2;ai.strafe=Math.random()<.5?1:-1;}
   const s=0.65*ai.strafe;mv={x:ux*fwd-uy*s,y:uy*fwd+ux*s};
   if(fwd===1&&!walkLOS(b.x,b.y,tgt.x,tgt.y))mv=steerTo(b,tgt.x,tgt.y);}
 } else if(goal){mv=steerTo(b,goal.x,goal.y);}
 else{
  if(!ai.wp||ai.wpT<=0||Math.hypot(b.x-ai.wp.x,b.y-ai.wp.y)<60){
   ai.wp=G.mode==='ueberleben'?{x:MW/2+(Math.random()-.5)*(MW-2*G.gas-200),y:MH/2+(Math.random()-.5)*(MH-2*G.gas-200)}:{x:MW*(0.2+Math.random()*0.6),y:MH*(b.team===0?0.25+Math.random()*0.4:0.35+Math.random()*0.4)};
   const p=freeSpot(ai.wp.x,ai.wp.y,20);ai.wp=p;ai.wpT=4+Math.random()*3;}
  mv=steerTo(b,ai.wp.x,ai.wp.y);}
 if(ai.altT>0){ai.altT-=dt;mv=ai.alt;}
 b.mx=mv.x;b.my=mv.y;
 if(mv.x||mv.y)b.face=Math.atan2(mv.y,mv.x);
 // Angriff
 if(!noShoot&&!carrying&&G.time>G.introEnd+(G.mode==='ueberleben'?4:1.5)){
  const lobber=b.type==='bummi'||b.type==='moosi';
  if(tgt&&tgtD<R*0.95&&(lobber||LOS(b.x,b.y,tgt.x,tgt.y))){
   b.face=Math.atan2(tgt.y-b.y,tgt.x-b.x);
   const travel=lobber?(0.45+tgtD/1400):(d.pspd?tgtD/d.pspd:0),err=(1-G.skill);
   const ax=tgt.x+tgt.vx*travel*G.skill+(Math.random()-.5)*err*120,ay=tgt.y+tgt.vy*travel*G.skill+(Math.random()-.5)*err*120;
   if(ai.cd<=0&&b.ammo>=1){attack(b,ax,ay);ai.cd=0.45+Math.random()*(1.2-G.skill*0.8);}
   if(b.sc>=1){const sr={funke:420,schrot:300,pfeil:780,bummi:460,frosti:210,moosi:9999,schatten:380,brumm:480}[b.type];
    if(b.type==='moosi'){if(b.hp<b.maxHp*0.75||mates.some(m=>m!==b&&m.hp<m.maxHp*0.6&&dist(m,b)<300))useSuper(b,b.x,b.y);}
    else if(tgtD<sr)useSuper(b,ax,ay);}
  } else if(sec&&dist(b,sec)<R*0.95&&(lobber||LOS(b.x,b.y,sec.x,sec.y))&&ai.cd<=0&&b.ammo>=1.5){attack(b,sec.x,sec.y);ai.cd=0.5+Math.random()*0.5;}
 }
 // Gadget
 if(b.gadgets>0&&b.gadCd<=0&&G.time>G.introEnd+2){
  const low=b.hp<b.maxHp*0.45,near=tgt&&tgtD<200;
  if((b.type==='frosti'||b.type==='moosi'||b.type==='schrot'||b.type==='schatten'||b.type==='funke')&&low&&tgt)useGadget(b);
  else if(b.type==='bummi'&&near)useGadget(b);
  else if(b.type==='pfeil'&&tgt&&tgtD<R*0.9&&b.ammo>=1)useGadget(b);
  else if(b.type==='brumm'&&tgt&&G.deps.some(dd=>dd.owner===b&&!dd.dead&&dist(dd,tgt)<450))useGadget(b);
 }
}

function updFighter(f,dt){
 if(f.dead){if(G.mode!=='ueberleben'){f.respawn-=dt;if(f.respawn<=0)respawn(f);}return;}
 const d=F[f.type];
 f.atkCd-=dt;f.slow-=dt;f.stun-=dt;f.gadCd-=dt;f.spdBuff-=dt;f.shield-=dt;f.invis-=dt;f.overload-=dt;
 if(f.ammo<3)f.ammo=Math.min(3,f.ammo+dt/d.reload);

function dropReward(rar){

 const lockedUpTo=locked.filter(k=>F[k].rar<=rar);
 switch(rar){
  case 1:return Math.random()<.5?{type:'coins',v:50}:{type:'pp',v:25};

  case 4:return lockedUpTo.length&&Math.random()<.35?{type:'unlock',v:lockedUpTo[rnd(lockedUpTo.length)]}:[{type:'coins',v:500},{type:'pp',v:200}][rnd(2)];
  default:return locked.length?{type:'unlock',v:locked[rnd(locked.length)]}:{type:'coins',v:1000};
 }
}

const NET={role:null,peer:null,conns:[],conn:null,lobby:[],lobbyView:[],mode:'kristall',code:'',sendT:0,inT:0,myIdx:0,lastAtk:-9,inLobby:false,seenLobby:false};
const R1=v=>Math.round(v),R2=v=>Math.round(v*100)/100;

function pAttack(x,y){if(NET.role==='client')netAct('atk',x,y);else attack(G.player,x,y);}

function netAct(a,x,y){
 if(!G||G.over||G.player.dead)return;
 if(a==='atk'){if(G.time-NET.lastAtk<0.3||G.player.ammo<1)return;NET.lastAtk=G.time;sfx('shot');}
 if(NET.conn&&NET.conn.open)NET.conn.send({t:'act',a,x:R1(x),y:R1(y)});
}
function loadPeer(cb){

 const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
 s.onload=cb;s.onerror=()=>netStatus('❌ PeerJS konnte nicht geladen werden. Bist du mit dem Internet verbunden?');document.head.appendChild(s);
}
function netStatus(t){const e=$('netSt');if(e)e.innerHTML=t;}
function openOnline(){
 openPanel(`<h2>🌐 Online spielen</h2><div class="desc" style="text-align:center">Spiele mit Freunden über das Internet. Einer erstellt einen Raum, die anderen geben den Code ein. Freie Plätze werden mit Bots gefüllt. Jeder spielt mit dem Kämpfer, den er im Menü ausgewählt hat.</div>
 <button class="green" id="nHost">Raum erstellen</button>
 <div class="row"><input class="nm" id="nCode" maxlength="5" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px"><button class="blue" id="nJoin">Beitreten</button></div>
 <div id="netSt" style="text-align:center"></div>`);
 $('nHost').onclick=()=>loadPeer(netHost);

function netHost(){
 netShutdown();
 const code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
 netStatus('Raum wird erstellt…');
 const peer=new Peer('krawall-arena-'+code,{debug:0});NET.peer=peer;
 peer.on('open',()=>{NET.role='host';NET.code=code;NET.lobby=[Object.assign(myInfo(),{id:'host',team:0})];NET.conns=[];openLobby();});
 peer.on('error',e=>{if(e.type==='unavailable-id'&&!NET.role){peer.destroy();netHost();return;}netStatus('❌ Fehler: '+e.type);});
 peer.on('connection',conn=>{conn.on('data',d=>netHostData(conn,d));conn.on('close',()=>netDrop(conn));conn.on('error',()=>netDrop(conn));});
}
function netLobbyBroadcast(){const players=NET.lobby.map(p=>({name:p.name,type:p.type,lvl:p.lvl,team:p.team}));
 for(const c of NET.conns)if(c.open)c.send({t:'lobby',mode:save.mode,players});
 if(NET.inLobby&&!G)openLobby();}
function netHostData(conn,d){
 if(!d||typeof d!=='object')return;
 if(d.t==='hello'){
  if(G&&!G.over){conn.send({t:'busy'});return;}
  if(NET.lobby.length>=10){conn.send({t:'full'});return;}
  if(!NET.conns.includes(conn))NET.conns.push(conn);
  const cnt=[0,0];NET.lobby.forEach(p=>cnt[p.team]++);
  NET.lobby.push({id:conn.peer,name:String(d.name||'Spieler').slice(0,14),type:F[d.type]?d.type:'funke',lvl:clamp(d.lvl|0,1,9),team:cnt[0]<=cnt[1]?0:1});
  netLobbyBroadcast();sfx('pick');return;}
 if(!G)return;
 const f=G.fighters.find(x=>x.netId===conn.peer&&x.remote);if(!f)return;
 if(d.t==='in'){f.mx=clamp(+d.mx||0,-1,1);f.my=clamp(+d.my||0,-1,1);if(!f.dash&&!f.leap)f.face=+d.f||0;}
 else if(d.t==='act'){if(d.a==='atk')attack(f,+d.x,+d.y);else if(d.a==='sup')useSuper(f,+d.x,+d.y);else if(d.a==='gad')useGadget(f);}
}
function netDrop(conn){
 if(NET.role!=='host')return;
 NET.conns=NET.conns.filter(c=>c!==conn);NET.lobby=NET.lobby.filter(p=>p.id!==conn.peer);
 if(G){const f=G.fighters.find(x=>x.netId===conn.peer);if(f&&f.remote){f.remote=false;f.name+=' (Bot)';}}
 netLobbyBroadcast();
}

 const md=host?save.mode:NET.mode,list=host?NET.lobby:NET.lobbyView,team=md!=='ueberleben';
 let h='<h2>🌐 Lobby</h2>';
 if(host)h+=`<div class="big out" style="letter-spacing:8px;color:#ffc312">${NET.code}</div><div class="desc" style="text-align:center">Gib diesen Code deinen Freunden – sie tippen auf 🌐 Online → Beitreten.</div>`;
 else h+=`<div style="text-align:center">Raum <b style="color:#ffc312;letter-spacing:4px">${NET.code}</b></div>`;
 h+=`<div class="row" id="lMode" style="${host?'cursor:pointer':''}"><div style="font-size:30px">${MODES[md].icon}</div><div class="grow"><b>${MODES[md].name}</b><small>${host?'Tippen, um den Modus zu wechseln':MODES[md].desc}</small></div></div>`;
 list.forEach((p,i)=>{const tc=p.team===0?'#5aa9ff':'#ff4d6d',tn=p.team===0?'Team A':'Team B';
  h+=`<div class="row"><canvas width="50" height="46" data-p="${p.type}" style="border-radius:8px"></canvas><div class="grow"><b>${p.name}${i===0?' 👑':''}</b><small>${F[p.type].name} · Stufe ${p.lvl}</small></div>`+
   (team?(host?`<button class="sm ${p.team===0?'blue':'red'}" data-tm="${i}">${tn}</button>`:`<b style="color:${tc}">${tn}</b>`):'')+'</div>';});
 h+=`<div class="desc" style="text-align:center">${list.length} Spieler · freie Plätze bekommen Bots${team?' · max. 3 pro Team':''}</div>`;
 h+=host?'<button class="green" id="lStart" style="font-size:24px">STARTEN</button>':'<div style="text-align:center" class="out">Warte, bis der Host startet…</div>';
 h+='<div id="netSt" style="text-align:center"></div>';
 openPanel(h);document.querySelectorAll('#pBody [data-p]').forEach(c=>portrait(c,c.dataset.p,false));
 if(host){
  $('lMode').onclick=()=>{const ks=Object.keys(MODES);save.mode=ks[(ks.indexOf(save.mode)+1)%ks.length];persist();netLobbyBroadcast();openLobby();};
  document.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>{const p=NET.lobby[+b.dataset.tm];const other=1-p.team;
   if(NET.lobby.filter(x=>x.team===other).length>=3)return;p.team=other;netLobbyBroadcast();openLobby();});
  $('lStart').onclick=netStart;
 }
}
function netStart(){
 const mode=save.mode,solo=mode==='ueberleben';
 const humans=NET.lobby.slice(0,solo?10:6);
 if(!solo){const cnt=[0,0];for(const h of humans){if(cnt[h.team]>=3)h.team=1-h.team;cnt[h.team]++;}}
 setupMatch(mode,humans);
 const fs=G.fighters.map(f=>({type:f.type,team:f.team,name:f.name,lvl:f.lvl,star:f.star}));
 const map=G.map.map(r=>r.join('')).join('|');
 for(const c of NET.conns)if(c.open){const idx=G.fighters.findIndex(f=>f.netId===c.peer);if(idx>=0)c.send({t:'start',mode,cols:COLS,rows:ROWS,map,fs,you:idx});}
 NET.inLobby=false;G.mapSent=G.mapVer;$('panel').classList.add('hidden');$('menu').classList.add('hidden');
 if(solo)beginMatch();else showVS();
}
function buildSnap(){
 const fs=G.fighters.map(f=>[R1(f.x),R1(f.y),R1(f.hp),R1(f.maxHp),R2(f.face),f.dead?1:0,R2(f.ammo),R2(f.sc),f.crystals,f.cubes,f.inBush?1:0,R2(Math.max(0,f.invis)),
  R2(Math.max(0,f.stun)),R2(Math.max(0,f.slow)),R2(Math.max(0,f.shield)),f.leap?R2(f.leap.t/f.leap.dur):-1,f.gadgets,R2(Math.max(0,f.gadCd)),R2(f.respawn),
  G.time-f.lastAtk<0.8?1:0,f.kills,R1(f.dmgDone),f.collected,f.goals,f.place]);
 const proj=G.proj.map(p=>p.lob?{l:1,sx:R1(p.sx),sy:R1(p.sy),tx:R1(p.tx),ty:R1(p.ty),t:R2(p.t),d:R2(p.dur),r:R1(p.rad),b:p.big?1:0,s:p.spore?1:0,tm:p.team}
  :{x:R1(p.x),y:R1(p.y),vx:R1(p.vx),vy:R1(p.vy),r:p.r,c:p.color,bm:p.beam?1:0,tm:p.team});
 const parts=[];for(const q of G.parts){if(q._s)continue;q._s=1;
  parts.push(q.ring?{g:1,x:R1(q.x),y:R1(q.y),r:R1(q.r),m:R2(q.max),c:q.color}:q.slash?{sl:1,x:R1(q.x),y:R1(q.y),a:R2(q.a)}:{x:R1(q.x),y:R1(q.y),vx:R1(q.vx),vy:R1(q.vy),m:R2(q.max),r:R2(q.r),c:q.color});}
 const floats=[];for(const q of G.floats){if(q._s)continue;q._s=1;floats.push({x:R1(q.x),y:R1(q.y),tx:q.text,c:q.color});}
 const s={t:'s',fs,proj,parts,floats,picks:G.picks.map(c=>[c.kind==='crystal'?0:1,R1(c.x),R1(c.y)]),
  deps:G.deps.map(d=>[d.dtype==='flower'?0:1,d.team,R1(d.x),R1(d.y),R1(d.hp),R1(d.maxHp),R2(d.face||0),d.owner.star?1:0]),
  boxes:G.boxes.map(b=>[R1(b.x),R1(b.y),R1(b.hp)]),mines:G.mines.map(m=>[R1(m.x),R1(m.y),m.rad]),score:G.score,crys:G.crys||[0,0],cd:R2(G.cd),cdT:G.cdTeam,
  tl:R2(G.timeLeft),gas:R1(G.gas),intro:R2(G.intro),pause:R2(G.pause),banner:G.banner?{team:G.banner.team,t:R2(G.banner.t)}:null,
  feed:G.feed.map(k=>({a:k.a,at:k.at,b:k.b,bt:k.bt,t:R2(k.t)}))};
 if(G.ball)s.ball=[R1(G.ball.x),R1(G.ball.y),G.ball.carrier?G.fighters.indexOf(G.ball.carrier):-1];
 if(G.mapVer!==G.mapSent){G.mapSent=G.mapVer;s.map=G.map.map(r=>r.join('')).join('|');}
 return s;
}
function netHostTick(dt){NET.sendT-=dt;if(NET.sendT>0||!NET.conns.length)return;NET.sendT=0.05;const s=buildSnap();for(const c of NET.conns)if(c.open)c.send(s);}
function netSendEnd(){const places=G.fighters.map(f=>f.place||0),wt=G.result.winTeam,snap=buildSnap();setTimeout(()=>{for(const c of NET.conns)if(c.open){c.send(snap);c.send({t:'end',winTeam:wt,places});}},0);}
// ---- Client
function netJoin(code){
 netShutdown();netStatus('Verbinde mit Raum '+code+'…');
 const peer=new Peer({debug:0});NET.peer=peer;
 peer.on('open',()=>{
  const conn=peer.connect('krawall-arena-'+code,{serialization:'json',reliable:true});NET.conn=conn;
  const to=setTimeout(()=>{if(NET.role!=='client')netStatus('❌ Raum „'+code+'“ antwortet nicht.');},9000);
  conn.on('open',()=>{clearTimeout(to);NET.role='client';NET.code=code;NET.seenLobby=false;conn.send(Object.assign({t:'hello'},myInfo()));});
  conn.on('data',netClientData);conn.on('close',netLost);conn.on('error',netLost);});
 peer.on('error',e=>netStatus(e.type==='peer-unavailable'?'❌ Raum „'+code+'“ nicht gefunden.':'❌ Fehler: '+e.type));
}
function netClientData(d){
 if(!d||typeof d!=='object')return;
 if(d.t==='lobby'){NET.lobbyView=d.players;NET.mode=d.mode;if(!G&&(NET.inLobby||!NET.seenLobby)){NET.seenLobby=true;openLobby();}}
 else if(d.t==='busy'||d.t==='full'){const m=d.t==='busy'?'Dort läuft gerade ein Match. Versuch es gleich nochmal.':'Der Raum ist voll.';netShutdown();netStatus('❌ '+m);}
 else if(d.t==='start')clientStart(d);
 else if(d.t==='s'){if(G)applySnap(d);}
 else if(d.t==='end'){if(G&&!G.over){G.over=true;G.overT=2.2;const pl=d.places[NET.myIdx]||G.player.place||1;
  G.result={res:myRes(d.winTeam),place:pl,winTeam:d.winTeam};G.player.place=pl;
  sfx(G.result.res==='win'||G.result.res==='place'&&pl<=3?'win':'lose');TS.move=TS.atk=TS.sup=null;mouse.down=false;}}
 else if(d.t==='bye')netLost();
}
function clientStart(d){
 COLS=d.cols;ROWS=d.rows;MW=COLS*T;MH=ROWS*T;
 G={mode:d.mode,map:d.map.split('|').map(r=>r.split('')),time:0,fighters:[],proj:[],parts:[],floats:[],feed:[],picks:[],deps:[],boxes:[],mines:[],over:false,
  score:[0,0],timeLeft:150,intro:3.2,pause:0,banner:null,cdTeam:-1,cd:15,gas:0,cam:{x:0,y:0},crys:[0,0]};
 G.fighters=d.fs.map((s,i)=>{const f=mkF(s.type,s.team,s.lvl,i===d.you,s.name);f.star=s.star;f.x=MW/2;f.y=MH/2;return f;});
 G.player=G.fighters[d.you];NET.myIdx=d.you;
 if(d.mode==='torball')G.ball={x:MW/2,y:MH/2,vx:0,vy:0,r:14,carrier:null};
 NET.inLobby=false;$('panel').classList.add('hidden');$('menu').classList.add('hidden');
 if(d.mode==='ueberleben')beginMatch();else showVS();
}
function applySnap(s){
 s.fs.forEach((a,i)=>{const f=G.fighters[i];if(!f)return;
  if(!f.seen||(f.dead&&!a[5])||Math.hypot(a[0]-f.x,a[1]-f.y)>160){f.x=a[0];f.y=a[1];}
  f.seen=true;f.tx=a[0];f.ty=a[1];const prev=f.hp;
  f.hp=a[2];f.maxHp=a[3];if(!f.isP)f.face=a[4];f.dead=!!a[5];f.ammo=a[6];f.sc=a[7];f.crystals=a[8];f.cubes=a[9];f.inBush=!!a[10];f.invis=a[11];f.stun=a[12];f.slow=a[13];
  f.shield=a[14];f.leap=a[15]>=0?{t:a[15],dur:1}:null;f.gadgets=a[16];f.gadCd=a[17];f.respawn=a[18];f.lastAtk=a[19]?G.time:-9;f.kills=a[20];f.dmgDone=a[21];
  f.collected=a[22];f.goals=a[23];f.place=a[24];
  if(f.isP&&f.hp<prev-1&&!f.dead)sfx('hurt');});
 G.proj=s.proj.map(p=>p.l?{lob:true,sx:p.sx,sy:p.sy,tx:p.tx,ty:p.ty,t:p.t,dur:p.d,rad:p.r,big:!!p.b,spore:!!p.s,team:p.tm}:{x:p.x,y:p.y,vx:p.vx,vy:p.vy,r:p.r,color:p.c,beam:!!p.bm,team:p.tm});
 for(const q of s.parts)G.parts.push(q.g?{ring:true,x:q.x,y:q.y,r:q.r,t:q.m,max:q.m,color:q.c}:q.sl?{slash:true,x:q.x,y:q.y,a:q.a,t:0.2,max:0.2}:{x:q.x,y:q.y,vx:q.vx,vy:q.vy,t:q.m,max:q.m,r:q.r,color:q.c});
 for(const q of s.floats)G.floats.push({x:q.x,y:q.y,text:q.tx,t:0.8,color:q.c});
 G.picks=s.picks.map(c=>({kind:c[0]?'cube':'crystal',x:c[1],y:c[2]}));
 G.deps=s.deps.map(d=>({kind:'dep',dtype:d[0]?'turret':'flower',team:d[1],x:d[2],y:d[3],hp:d[4],maxHp:d[5],face:d[6],owner:{star:!!d[7]},r:20}));
 G.boxes=s.boxes.map(b=>({kind:'box',team:-1,x:b[0],y:b[1],hp:b[2],maxHp:3600,r:24}));
 G.mines=s.mines.map(m=>({x:m[0],y:m[1],rad:m[2]}));
 if(s.banner&&!G.banner)sfx('goal');
 G.score=s.score;G.crys=s.crys;G.cd=s.cd;G.cdTeam=s.cdT;G.timeLeft=s.tl;G.gas=s.gas;G.intro=s.intro;G.pause=s.pause;G.banner=s.banner;G.feed=s.feed;
 if(s.ball&&G.ball){const b=G.ball;b.tx=s.ball[0];b.ty=s.ball[1];b.carrier=s.ball[2]>=0?G.fighters[s.ball[2]]:null;if(Math.hypot(b.x-b.tx,b.y-b.ty)>200){b.x=b.tx;b.y=b.ty;}}
 if(s.map)G.map=s.map.split('|').map(r=>r.split(''));
}
function clientUpdate(dt){
 G.time+=dt;updFx(dt);
 if(G.over){G.overT-=dt;if(G.overT<=0&&!G.shown){G.shown=true;showResults();}return;}
 const k=Math.min(1,dt*14);
 for(const f of G.fighters){if(f.tx==null)continue;const ox=f.x,oy=f.y;f.x+=(f.tx-f.x)*k;f.y+=(f.ty-f.y)*k;
  f.vx=(f.x-ox)/dt;f.vy=(f.y-oy)/dt;if(Math.hypot(f.vx,f.vy)>20)f.walk+=dt*14;else f.walk=0;}
 for(const q of G.proj){if(q.lob)q.t=Math.min(q.dur,q.t+dt);else{q.x+=q.vx*dt;q.y+=q.vy*dt;}}
 const b=G.ball;if(b&&b.tx!=null){if(b.carrier){b.x=b.carrier.x+Math.cos(b.carrier.face)*24;b.y=b.carrier.y+Math.sin(b.carrier.face)*24+8;}else{b.x+=(b.tx-b.x)*k;b.y+=(b.ty-b.y)*k;}}
 if(G.intro<=0&&G.pause<=0&&G.mode!=='ueberleben')G.timeLeft=Math.max(0,G.timeLeft-dt);
 if(G.intro>0)G.intro-=dt;
 if(G.intro<=0&&G.pause<=0)readInput(G.player);
}
function netClientTick(dt){NET.inT-=dt;if(NET.inT>0||!G||G.over)return;NET.inT=1/30;const p=G.player;
 if(NET.conn&&NET.conn.open)NET.conn.send({t:'in',mx:R2(p.mx||0),my:R2(p.my||0),f:R2(p.face)});}
function netLost(){
 if(NET.role!=='client')return;netShutdown();G=null;$('exitBtn').classList.add('hidden');$('mm').classList.add('hidden');$('vs').classList.add('hidden');
 openPanel('<h2>Verbindung getrennt</h2><div class="desc" style="text-align:center">Der Host hat das Spiel verlassen oder die Verbindung ist abgebrochen.</div>');
}
function netShutdown(){
 const role=NET.role;NET.role=null;NET.inLobby=false;
 try{if(role==='host')for(const c of NET.conns){try{c.send({t:'bye'});c.close();}catch(e){}}
  if(NET.conn)NET.conn.close();if(NET.peer)NET.peer.destroy();}catch(e){}
 NET.peer=null;NET.conn=null;NET.conns=[];NET.lobby=[];NET.lobbyView=[];
}

// =====================================================================
//  LOOP
// =====================================================================
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;
 if(G&&$('mm').classList.contains('hidden')&&$('vs').classList.contains('hidden')){update(dt);if(G)render();}
 if(G&&NET.role==='host')netHostTick(dt);if(G&&NET.role==='client')netClientTick(dt);
 requestAnimationFrame(loop);}
showMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
