<meta charset="utf-8">
<title>Sky Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: hochkantes Spielfeld (9:16) mittig; frischer Frühlingsgarten, Holz- und Blattgrün-Töne, Panels wie Gartenschilder. Bewusst ein heller Look. */
:root{
  --sky:#9fdcff; --sky-2:#e9f8ff; --leaf:#3fae4f; --leaf-d:#26803a; --wood:#b97a45; --wood-d:#87522a; --cream:#fff8ea; --ink:#2f3a1f; --muted:#6b7a55;
  --sun:#ffc531; --sun-d:#cf8f00; --rose:#ff6f8e; --rose-d:#c4405f; --water:#3fa8ff;
  --f-display:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--ink);font-family:var(--f-body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
#app{height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#wrap{position:relative;touch-action:none}
#cv{display:block;border-radius:22px;box-shadow:0 18px 50px rgba(30,70,30,.3);touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px;border-radius:22px;background:linear-gradient(rgba(255,248,234,.75),rgba(255,248,234,.96));text-align:center;overflow-y:auto;overflow-x:hidden}
.ov>*{flex:none}
.ov.center{justify-content:center}
.ov.hub{background:none;justify-content:space-between;pointer-events:none;padding:10px}
.ov.hub>*{pointer-events:auto}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:.85;margin:8px 0 2px;color:var(--leaf);text-shadow:0 3px 0 #fff,0 6px 0 var(--leaf-d)}
.logo span{color:var(--rose);text-shadow:0 3px 0 #fff,0 6px 0 var(--rose-d)}
h2.t{font-family:var(--f-display);font-weight:800;font-size:28px;margin:2px 0;color:var(--leaf-d)}
.sub{color:var(--muted);font-size:13px;margin:0;max-width:34ch;line-height:1.4}
.btn{font-family:var(--f-display);font-weight:800;font-size:19px;border:0;border-radius:16px;padding:9px 18px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.wide{min-width:230px}
.btn.sun{background:var(--sun);color:#5a3a00;box-shadow:0 5px 0 var(--sun-d)}
.btn.rose{background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-d)}
.btn.wood{background:var(--wood);color:#fff;box-shadow:0 5px 0 var(--wood-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9caa8}
.btn.sm{font-size:15px;padding:5px 11px;border-radius:12px;box-shadow:0 3px 0 var(--leaf-d)}
.btn.sm.ghost{box-shadow:0 3px 0 #d9caa8}
.btn.sm.sun{box-shadow:0 3px 0 var(--sun-d)}
.btn[disabled]{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font-family:var(--f-body);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #fff;animation:bump 1.2s infinite}
@keyframes bump{50%{transform:scale(1.15)}}
.hubtop{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.pill{background:var(--cream);border-radius:999px;padding:5px 10px;font-size:13px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #d9caa8}
.star{color:var(--sun-d)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b8,var(--sun) 50%,var(--sun-d));display:inline-block;flex:none}
.hubbot{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.rowb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px}
.rowb .btn{font-size:13px;padding:7px 2px;border-radius:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px}
#hud{position:absolute;inset:0;pointer-events:none;border-radius:22px}
.ht{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:stretch}
.moves{background:var(--wood);color:#fff;border-radius:14px;padding:4px 10px;text-align:center;box-shadow:0 3px 0 var(--wood-d);min-width:62px}
.moves b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.moves small{font-size:10px}
.goals{flex:1;background:var(--cream);border-radius:14px;display:flex;gap:4px;justify-content:space-around;align-items:center;padding:4px;box-shadow:0 3px 0 #d9caa8;min-width:0}
.goal{display:flex;flex-direction:column;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.goal canvas{width:30px;height:30px}
.goal.done b{color:var(--leaf)}
.hbtn{pointer-events:auto;width:40px;border-radius:12px;border:0;background:var(--cream);box-shadow:0 3px 0 #d9caa8;font-size:15px}
#pbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;justify-content:center;pointer-events:auto}
.pw{border:0;background:var(--cream);border-radius:14px;box-shadow:0 3px 0 #d9caa8;padding:4px 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;min-width:80px;position:relative}
.pw b{font-family:var(--f-display);font-size:15px}
.pw.on{background:var(--rose);color:#fff;box-shadow:0 3px 0 var(--rose-d)}
.pw .n{position:absolute;top:-7px;right:-7px;background:var(--leaf);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center}
.list{width:100%;max-width:330px;display:flex;flex-direction:column;gap:8px;text-align:left}
.item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 #e6d9bb}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14px}
.item .tx small{color:var(--muted);font-size:12px;display:block}
.item.done{opacity:.6}
.bar{height:8px;border-radius:5px;background:#efe6cf;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--leaf)}
.tabs{display:flex;gap:6px}
.tabs button{border:0;border-radius:11px;padding:7px 12px;background:#fff;font-weight:800;font-size:13px;box-shadow:0 2px 0 #e6d9bb}
.tabs button.on{background:var(--leaf);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:330px}
.day{border-radius:11px;padding:6px 1px;background:#fff;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15;box-shadow:0 2px 0 #e6d9bb}
.day b{font-size:11px}
.day.got{background:#d8f5cf}
.day.today{background:var(--sun);transform:scale(1.08)}
#wheel{width:220px;height:220px;max-width:100%;transition:transform 3.6s cubic-bezier(.15,.85,.2,1)}
.wheelwrap{position:relative;width:220px;max-width:100%}
.wheelwrap::after{content:"";position:absolute;left:50%;top:-6px;margin-left:-10px;border:10px solid transparent;border-top:18px solid var(--rose)}
.stars3{font-size:44px;letter-spacing:4px;color:#e6d9bb;margin:0}
.stars3 .on{color:var(--sun);text-shadow:0 3px 0 var(--sun-d)}
.toasts{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{background:#fff;border:2px solid var(--leaf);border-radius:14px;padding:7px 10px;font-size:12px;animation:pop .35s both;text-align:left;box-shadow:0 6px 18px rgba(30,70,30,.25)}
.toast b{display:block;font-size:13px;color:var(--leaf-d)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"><div id="wrap">
  <canvas id="cv" aria-label="Spielfeld"></canvas>
  <div id="hud" hidden>
    <div class="ht"><div class="moves"><b id="mv">0</b><small>Züge</small></div><div class="goals" id="goals"></div><button class="hbtn" id="pauseBtn" aria-label="Pause">II</button></div>
    <div id="pbar"></div>
  </div>
  <div id="menu" class="ov"></div>
  <div class="toasts" id="toasts"></div>
</div></div>
<script>
'use strict';
const VW=360,VH=640,N=8,CS=42,BX=12,BY=128,HOUR=3600000;
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');let SC=1,DPR=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.floor(n).toLocaleString('de-DE'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0'),dayStr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),today=()=>dayStr(new Date());
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const durTxt=ms=>{if(ms<=0)return'bereit';const m=Math.ceil(ms/60000),h=Math.floor(m/60);return h?h+' h '+pad2(m%60)+' min':m+' min'};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const circ=(c,x,y,r,f)=>{c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
const ell=(c,x,y,a,b,f)=>{c.fillStyle=f;c.beginPath();c.ellipse(x,y,a,b,0,0,7);c.fill()};

/* ===== Speicher ===== */
const KEY='skygarden_v1',SALT='skygarden|2026';let STORAGE_OK=true,TAMPER=false;
const DEF=()=>({coins:500,stars:0,level:1,lvStars:{},tasks:{},area:0,pw:{hammer:2,cross:1,shuffle:1},pre:{rocket:1,bomb:1,rainbow:0},streak:{n:0,last:null,best:0},wheel:null,gift:0,maxTime:0,xp:0,plv:1,ach:{},q:{date:null,list:[],bonus:false},
 st:{wins:0,matches:0,specials:0,rainbows:0,boxes:0,grass:0,pw:0,tasks:0,combos:0}});
let S=DEF();
function sGet(){try{return localStorage.getItem(KEY)}catch(e){STORAGE_OK=false;return null}}
function load(){const raw=sGet();let s=null;TAMPER=false;if(raw){try{const o=JSON.parse(raw);if(o&&typeof o.d==='string'){if(hashStr(o.d+SALT)!==o.h)TAMPER=true;s=JSON.parse(o.d)}}catch(e){}}
 S=Object.assign(DEF(),s||{});for(const k of['pw','pre','streak','q','st'])S[k]=Object.assign(DEF()[k],(s&&s[k])||{});if(TAMPER){S.coins=0}}
function save(){S.maxTime=Math.max(S.maxTime||0,Date.now());const d=JSON.stringify(S);try{localStorage.setItem(KEY,JSON.stringify({d,h:hashStr(d+SALT)}))}catch(e){STORAGE_OK=false}}
function fresh(){if(STORAGE_OK&&sGet()!==null)load()}
const clockBad=()=>Date.now()<(S.maxTime||0)-10*60*1000;

/* ===== Belohnungen ===== */
function toast(t,s){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${esc(t)}</b>${esc(s||'')}`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3200);while($('#toasts').children.length>3)$('#toasts').firstChild.remove()}
const PWN={hammer:'Hammer',cross:'Kreuz',shuffle:'Mischen'},PREN={rocket:'Rakete',bomb:'Bombe',rainbow:'Regenbogen'};
function give(r){if(r.t==='coins')S.coins+=r.v;else if(r.t==='stars')S.stars+=r.v;else if(PWN[r.t])S.pw[r.t]+=r.v;else if(PREN[r.t])S.pre[r.t]+=r.v}
const rName=r=>r.t==='coins'?fmt(r.v)+' Münzen':r.t==='stars'?r.v+' Stern'+(r.v>1?'e':''):r.v+'× '+(PWN[r.t]||PREN[r.t]);
const STREAK=[{t:'coins',v:150},{t:'hammer',v:1},{t:'coins',v:250},{t:'rocket',v:2},{t:'coins',v:400},{t:'bomb',v:2},{t:'stars',v:2}];
function streakRew(n){const r=STREAK[(n-1)%7],w=Math.min(4,Math.floor((n-1)/7));return r.t==='coins'?{t:'coins',v:Math.round(r.v*(1+w*.5))}:{t:r.t,v:r.v+(r.t==='stars'?0:w)}}
const canStreak=()=>S.streak.last!==today()&&!clockBad(),canWheel=()=>S.wheel!==today()&&!clockBad(),giftReady=()=>Date.now()>=(S.gift||0)&&!clockBad();
const xpNeed=l=>200+(l-1)*120;
function addXP(x){S.xp+=x;while(S.xp>=xpNeed(S.plv)){S.xp-=xpNeed(S.plv);S.plv++;const r=S.plv%5===0?{t:'rainbow',v:1}:pick([{t:'coins',v:200},{t:'hammer',v:1},{t:'rocket',v:1},{t:'bomb',v:1}]);give(r);toast('Spielerlevel '+S.plv+'!','Belohnung: '+rName(r));snd('lvl')}}
const QPOOL=[{k:'wins',n:[2,3,5],t:'Gewinne {n} Level',r:[100,160,250]},{k:'specials',n:[5,10,20],t:'Erschaffe {n} Spezialteile',r:[90,150,220]},{k:'rainbows',n:[1,2,3],t:'Erschaffe {n} Regenbogen',r:[120,200,300]},
 {k:'boxes',n:[10,25,40],t:'Zerbrich {n} Kisten',r:[90,150,220]},{k:'matches',n:[60,120,200],t:'Mache {n} Kombinationen',r:[80,130,200]},{k:'tasks',n:[1,2],t:'Erledige {n} Gartenaufgabe(n)',r:[120,200]},{k:'pw',n:[1,2],t:'Benutze {n} Booster',r:[70,120]}];
function ensureQ(){if(S.q.date===today())return;const R0=mulberry32(hashStr(today()+SALT)),pool=QPOOL.slice(),list=[];while(list.length<3){const q=pool.splice(Math.floor(R0()*pool.length),1)[0],i=Math.floor(R0()*q.n.length);list.push({k:q.k,n:q.n[i],r:q.r[i],t:q.t.replace('{n}',fmt(q.n[i])),p:0,c:false})}S.q={date:today(),list,bonus:false};save()}
function quest(k,v){ensureQ();for(const q of S.q.list){if(q.k!==k||q.p>=q.n)continue;q.p+=v;if(q.p>=q.n){q.p=q.n;toast('Aufgabe geschafft!',q.t)}}}
const ACH=[
 {id:'w1',n:'Erster Sieg',d:'Gewinne ein Level',r:50,g:()=>[S.st.wins,1]},{id:'w25',n:'Gärtnerlehrling',d:'Gewinne 25 Level',r:500,g:()=>[S.st.wins,25]},{id:'w100',n:'Gartenmeister',d:'Gewinne 100 Level',r:3000,g:()=>[S.st.wins,100]},
 {id:'sp50',n:'Tüftler',d:'Erschaffe 50 Spezialteile',r:300,g:()=>[S.st.specials,50]},{id:'rb10',n:'Regenbogenfänger',d:'Erschaffe 10 Regenbogen',r:500,g:()=>[S.st.rainbows,10]},
 {id:'bx100',n:'Kistenknacker',d:'Zerbrich 100 Kisten',r:400,g:()=>[S.st.boxes,100]},{id:'gr200',n:'Rasenmäher',d:'Räume 200 Grasfelder',r:400,g:()=>[S.st.grass,200]},
 {id:'t1',n:'Erste Verschönerung',d:'Erledige eine Gartenaufgabe',r:100,g:()=>[S.st.tasks,1]},{id:'a1',n:'Vorgarten fertig',d:'Stelle den Vorgarten fertig',r:800,g:()=>[S.area,1]},{id:'a2',n:'Teich fertig',d:'Stelle den Teich fertig',r:1500,g:()=>[S.area,2]},{id:'a3',n:'Traumgarten',d:'Stelle den ganzen Garten fertig',r:5000,g:()=>[S.area,3]},
 {id:'str3',n:'Dranbleiber',d:'3 Tage in Folge gespielt',r:150,g:()=>[S.streak.best,3]},{id:'str7',n:'Wochenheld',d:'7 Tage in Folge gespielt',r:700,g:()=>[S.streak.best,7]},{id:'str30',n:'Gartenfreund fürs Leben',d:'30 Tage in Folge gespielt',r:5000,g:()=>[S.streak.best,30]},
 {id:'pw10',n:'Werkzeugkiste',d:'Benutze 10 Booster',r:300,g:()=>[S.st.pw,10]},{id:'cmb',n:'Kettenreaktion',d:'Löse 20 Kettenreaktionen mit 4+ Stufen aus',r:600,g:()=>[S.st.combos,20]},{id:'plv10',n:'Aufsteiger',d:'Erreiche Spielerlevel 10',r:1000,g:()=>[S.plv,10]}];
function checkAch(){for(const a of ACH){if(S.ach[a.id])continue;const[v,g]=a.g();if(v>=g){S.ach[a.id]=Date.now();S.coins+=a.r;toast('Erfolg: '+a.n,'+'+fmt(a.r)+' Münzen');snd('lvl')}}}

/* ===== Ton ===== */
let AC=null;function snd(t,k){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime;
 const tone=(f,d,v,tp,dl,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'sine';o.frequency.setValueAtTime(f,n+(dl||0));if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+(dl||0)+d);g.gain.setValueAtTime(.0001,n+(dl||0));g.gain.exponentialRampToValueAtTime(v,n+(dl||0)+.01);g.gain.exponentialRampToValueAtTime(.0001,n+(dl||0)+d);o.connect(g).connect(AC.destination);o.start(n+(dl||0));o.stop(n+(dl||0)+d+.05)};
 if(t==='swap')tone(500,.07,.04,'triangle');if(t==='bad')tone(200,.12,.05,'square');if(t==='match')tone(520*Math.pow(1.12,Math.min(k||0,10)),.15,.07,'triangle');
 if(t==='special')tone(300,.35,.1,'sawtooth',0,1200);if(t==='boom')tone(140,.4,.15,'sawtooth',0,40);if(t==='lvl')[784,988,1175,1568].forEach((f,i)=>tone(f,.15,.05,'square',i*.06));
 if(t==='win')[523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,.08,'triangle',i*.1));if(t==='fail')[400,330,260].forEach((f,i)=>tone(f,.28,.08,'triangle',i*.15));if(t==='coin')tone(1400,.1,.04,'square');if(t==='task')[660,880,1100,1320,1760].forEach((f,i)=>tone(f,.2,.06,'sine',i*.08))}catch(e){}}
function resize(){const a=$('#app');const aw=a.clientWidth-32,ah=a.clientHeight-16;SC=Math.min(aw/VW,ah/VH);DPR=Math.min(2,devicePixelRatio||1);const w=Math.floor(VW*SC),h=Math.floor(VH*SC);cv.style.width=w+'px';cv.style.height=h+'px';$('#wrap').style.width=w+'px';$('#wrap').style.height=h+'px';cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR)}
addEventListener('resize',resize);
/* ===== Match-3 ===== */
const COLS=['#4fbf4a','#ff6fa8','#ffc531','#3fa8ff','#9b5cd6','#ff7a3d'];
const TNAME=['Blätter','Blüten','Sonnenblumen','Tropfen','Beeren','Pilze'];
function drawTile(c,col,sp,x,y,s,al){c.save();c.globalAlpha=al==null?1:al;c.translate(x,y);const k=s/40;c.scale(k,k);
 if(sp==='rb'){const g=c.createRadialGradient(-5,-6,2,0,0,17);g.addColorStop(0,'#fff');g.addColorStop(.4,'#ffe14d');g.addColorStop(.7,'#ff6fa8');g.addColorStop(1,'#6b5cff');c.fillStyle=g;c.beginPath();c.arc(0,0,16,0,7);c.fill();
  ['#ff5a5a','#ffb02e','#ffe14d','#4fe07a','#3fa8ff','#9b5cd6'].forEach((cc,i)=>{c.strokeStyle=cc;c.lineWidth=2.4;c.beginPath();c.arc(0,0,11-i*1.4,i,i+2.5);c.stroke()});c.restore();return}
 c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.ellipse(1,13,13,4,0,0,7);c.fill();
 const cl=COLS[col];

  case'quests':showMenu('quests');break;
  case'claimQ':{fresh();ensureQ();const q=S.q.list[+d.i];if(q&&!q.c&&q.p>=q.n){q.c=true;S.coins+=q.r;save();snd('coin')}showMenu('quests');break}
  case'claimQB':{fresh();ensureQ();if(!S.q.bonus&&S.q.list.every(q=>q.c)){S.q.bonus=true;S.stars++;S.coins+=200;save();snd('lvl')}showMenu('quests');break}
  case'shop':showMenu('shop');break;case'tab':TAB=d.t;showMenu('shop');break;
  case'buy':if(S.coins>=+d.p){S.coins-=+d.p;if(S.pw[d.k]!=null)S.pw[d.k]++;else S.pre[d.k]++;save();snd('coin')}showMenu('shop');break;
  case'ach':showMenu('ach');break}});
$('#pauseBtn').onclick=()=>{if(state==='play'&&B&&B.st==='idle'){state='pause';$('#hud').hidden=true;showMenu('pause')}};
/* ===== Start ===== */
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;try{if(state==='play'&&B){update(dt);drawBoard(t,dt)}else if(B&&state!=='hub')drawBoard(t,0);else drawGarden(t)}catch(e){console.error(e)}requestAnimationFrame(loop)}
load();ensureQ();resize();showHub();requestAnimationFrame(loop);
if(TAMPER)setTimeout(()=>toast('Speicherstand verändert','Die Prüfsumme stimmte nicht. Münzen wurden zurückgesetzt.'),600);
if(canStreak())setTimeout(()=>{if(state==='hub')showMenu('daily')},600);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
</script>
