<meta charset="utf-8">
<title>Sky Golf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen game. A floating sky island (canvas) fills the stage; glossy glass panels slide over it. Single sky-world look in every theme. */
:root{
  --sky-top:#3f86e8; --sky-bot:#bfe4ff;
  --glass:rgba(12,26,62,.80); --glass-2:rgba(255,255,255,.08); --line:rgba(255,255,255,.16);
  --paper:#ffffff; --muted:#b9c8ec; --ink:#14203f;
  --gold:#ffc83a; --gold-2:#ffdf6e; --gold-d:#c98a00;
  --grass:#43c75d; --grass-d:#23893a; --coral:#ff6a4d; --coral-d:#c2422a; --blue:#3d8bff; --blue-d:#2156b8;
  --lock:#7e8bab;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));color:var(--paper);font-family:var(--f-body);font-weight:700;overflow:hidden;-webkit-user-select:none;user-select:none;transition:background .6s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
#top{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap;position:relative;z-index:5}
.brand{background:none;border:0;font-family:var(--f-display);font-size:26px;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 rgba(10,30,80,.35),0 0 18px rgba(255,255,255,.35);padding:0 4px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#dfe6ee 60%,#aab7c6);box-shadow:0 2px 0 rgba(0,0,0,.25);display:inline-block}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.02em}
.chip.alert{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(255,200,58,.6);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 4px rgba(255,200,58,.2)}}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83a 45%,#c98a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block;flex:none}
.flame{width:12px;height:16px;background:linear-gradient(#ffe066,#ff6a2a);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block}
.xpbar{width:64px;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7df9a0,#3fd27a);width:0;transition:width .5s}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{display:block;touch-action:none;max-width:100%;position:relative;z-index:1}
.clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cl{position:absolute;left:0;width:150px;height:46px;border-radius:40px;background:var(--cloud,#fff);opacity:var(--cloud-o,.8);animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:70px;height:70px;left:22px;top:-34px}.cl::after{width:54px;height:54px;left:74px;top:-22px}
@keyframes drift{from{transform:translateX(-220px) scale(var(--s,1))}to{transform:translateX(calc(100vw + 40px)) scale(var(--s,1))}}
#screen{position:absolute;inset:0;overflow:auto;padding-block:8px 24px;display:flex;justify-content:center;align-items:flex-start;z-index:3}
#screen.dim{background:linear-gradient(rgba(8,18,48,.25),rgba(8,18,48,.55));border-radius:18px}
.panel{width:100%;max-width:1000px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(5,15,45,.35)}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;letter-spacing:.02em;text-wrap:balance}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:18px 0 10px;letter-spacing:.03em;color:var(--gold-2)}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph .sp{flex:1}
.sub{color:var(--muted);font-size:14px;margin:0}
.btn{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.03em;border:0;border-radius:14px;padding:10px 18px;background:linear-gradient(var(--gold-2),var(--gold));color:#4a2c00;box-shadow:0 4px 0 var(--gold-d),0 8px 16px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.green{background:linear-gradient(#6fe08a,var(--grass));color:#06350f;box-shadow:0 4px 0 var(--grass-d),0 8px 16px rgba(0,0,0,.2)}
.btn.blue{background:linear-gradient(#6aa8ff,var(--blue));color:#fff;box-shadow:0 4px 0 var(--blue-d),0 8px 16px rgba(0,0,0,.2)}
.btn.coral{background:linear-gradient(#ff8f73,var(--coral));color:#fff;box-shadow:0 4px 0 var(--coral-d),0 8px 16px rgba(0,0,0,.2)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{font-size:15px;padding:7px 12px;border-radius:11px}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.btn.on{outline:3px solid #fff}
/* menu */
.hero{text-align:center;padding:6px 0 14px}
.logo{font-family:var(--f-display);font-size:clamp(46px,9vw,92px);line-height:.95;letter-spacing:.02em;color:#fff;margin:0;text-shadow:0 5px 0 #2a5cb8,0 10px 0 rgba(10,30,80,.25),0 0 40px rgba(255,255,255,.4)}
.logo span{color:var(--gold-2);text-shadow:0 5px 0 #c27a00,0 10px 0 rgba(10,30,80,.25)}
.tag{color:#eaf3ff;font-size:15px;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{position:relative;border:0;border-radius:18px;padding:16px 14px 14px;text-align:left;min-height:104px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(2px)}
.tile b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em}
.tile small{font-size:13px;opacity:.9}
.tile .ico{position:absolute;right:10px;top:8px;width:46px;height:46px;opacity:.9}
.tile.big{grid-column:span 2;min-height:130px}
.tile.big b{font-size:30px}
.tile.locked{filter:saturate(.25) brightness(.8)}
.tile .lockt{position:absolute;left:12px;top:10px;font-size:12px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:9px}
@media (max-width:520px){.tile.big{grid-column:auto}}
/* level grid */
.chap{margin-top:8px}
.chap-h{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.chap-h .sw{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.chap-h b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.02em}
.chap-h small{color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lv{aspect-ratio:1;max-width:100%;border:0;border-radius:14px;background:linear-gradient(#ffffff,#dfe9f7);color:var(--ink);font-family:var(--f-display);font-size:22px;box-shadow:0 4px 0 #9fb0cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv .st{font-size:11px;letter-spacing:1px;color:#c9a000;font-family:var(--f-body);font-weight:900}
.lv .st i{color:#c8d2e3;font-style:normal}
.lv.lock{background:rgba(255,255,255,.12);color:rgba(255,255,255,.45);box-shadow:none;cursor:not-allowed}
.lv.next{background:linear-gradient(var(--gold-2),var(--gold));box-shadow:0 4px 0 var(--gold-d);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.chest{display:flex;align-items:center;gap:12px;background:var(--glass-2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;flex-wrap:wrap}
.chest .bar{flex:1;min-width:120px;height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.chest .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--glass-2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;min-width:0}
.card canvas{width:100%;max-width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.06)}
.card .nm{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em}
.card .rar{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.85}
.card.sel{box-shadow:0 0 0 3px var(--gold)}
.price{display:inline-flex;align-items:center;gap:5px;justify-content:center}
.r0{color:#cfd8ea}.r1{color:#7fd2ff}.r2{color:#d59bff}.r3{color:#ffcf4a}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;border-radius:11px;padding:8px 14px;background:rgba(255,255,255,.08);font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
.tabs button.on{background:#fff;color:var(--ink)}
.mapcard{border-radius:16px;overflow:hidden;background:var(--glass-2);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.mapcard .pv{aspect-ratio:16/10;width:100%;display:block}
.mapcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mapcard .bd b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.ach{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line)}
.ach .md{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.4)}
.ach.done .md{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83a 50%,#c98a00);color:#6a3e00;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ach .tx{flex:1;min-width:0}
.ach .tx b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em;display:block}
.ach .tx small{color:var(--muted);display:block}
.ach .pg{height:6px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.ach .pg i{display:block;height:100%;background:var(--grass)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:0;border-radius:14px;padding:12px 10px;background:rgba(255,255,255,.08);text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.seg button b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.seg button small{color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink)}
.seg button.on small{color:#4b5878}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],select{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;color:#fff;padding:8px 10px;font:inherit;font-weight:800;min-width:0}
select option{color:#000}
input[type=range]{accent-color:var(--gold)}
.code{font-family:var(--f-display);font-size:42px;letter-spacing:.18em;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 16px;user-select:all;-webkit-user-select:all}
.note{background:rgba(255,200,58,.12);border:1px solid rgba(255,200,58,.35);border-radius:12px;padding:10px 12px;font-size:14px;color:#ffeab0}
.credits{text-align:center;display:flex;flex-direction:column;gap:18px;padding:12px 0}
.credits .role{font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.credits .who{font-family:var(--f-display);font-size:34px;letter-spacing:.02em}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud-l{position:absolute;left:4px;top:4px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;max-width:60%}
.hud-l .t{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.hud-l .i{font-size:13px;color:var(--muted)}
.hud-l .i b{color:#fff}
.hud-r{position:absolute;right:4px;top:4px;display:flex;gap:6px;pointer-events:auto}
.hud-r button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center}
.hud-r svg{width:22px;height:22px}
#hudPlayers{position:absolute;left:4px;bottom:4px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 8px)}
.pl{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pl.cur{box-shadow:0 0 0 2px var(--gold)}
.pl i{width:10px;height:10px;border-radius:50%;display:inline-block}
#hudMsg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(28px,6vw,56px);letter-spacing:.03em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
#hudMsg.show{opacity:1;animation:pop .5s}
@keyframes pop{0%{transform:translateX(-50%) scale(.4)}70%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
#hudHint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px;white-space:nowrap}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,10,30,.6);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.mcard{width:100%;max-width:460px;max-height:100%;overflow:auto;background:linear-gradient(rgba(30,52,110,.97),rgba(14,28,66,.97));border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:mpop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.mcard h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0 0 6px;letter-spacing:.02em}
.mcard .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars span{font-size:48px;line-height:1;color:rgba(255,255,255,.18);transition:transform .3s}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 var(--gold-d);animation:starIn .5s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.reward{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--f-display);font-size:34px;color:var(--gold-2);margin:8px 0}
.reward .coin{width:30px;height:30px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-size:14px;color:var(--muted);margin:10px auto;max-width:300px;font-variant-numeric:tabular-nums}
.kv b{color:#fff;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.day{border-radius:12px;padding:8px 2px;background:rgba(255,255,255,.08);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.day b{font-family:var(--f-display);font-weight:400;font-size:15px}
.day.got{background:rgba(67,199,93,.3)}
.day.today{background:linear-gradient(var(--gold-2),var(--gold));color:#4a2c00;transform:scale(1.06)}
.quest{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin:8px 0}
.quest .tx{flex:1;min-width:0}
.quest .pg{height:8px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.quest .pg i{display:block;height:100%;background:var(--grass)}
table.sc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.sc td,table.sc th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center}
table.sc th{color:var(--muted);font-weight:800}
table.sc td:first-child,table.sc th:first-child{text-align:left}
.scwrap{overflow-x:auto}
/* toasts */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none;max-width:min(340px,calc(100% - 32px))}
.toast{background:linear-gradient(rgba(36,62,128,.97),rgba(18,34,80,.97));border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 10px 26px rgba(0,0,0,.35);animation:tin .4s cubic-bezier(.2,1.4,.4,1);display:flex;gap:10px;align-items:center}
.toast b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block;letter-spacing:.02em}
.toast small{color:var(--muted)}
.toast.gold{border-color:var(--gold)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
/* editors */
#edbar{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#app.editing #stage{padding-bottom:var(--edh,150px)}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tool{flex:none;border:0;border-radius:11px;padding:6px 10px;background:rgba(255,255,255,.08);font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;position:relative}
.tool canvas{width:34px;height:34px}
.tool.on{background:#fff;color:var(--ink)}
.tool.lk{opacity:.45}
.tool .lkb{position:absolute;top:2px;right:4px;font-size:10px}
.edrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.edrow input[type=text]{width:140px}
.edrow label{display:flex;gap:4px;align-items:center;color:var(--muted)}
.sk-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.sk-wrap{grid-template-columns:minmax(0,1fr)}}
.skc{width:100%;max-width:340px;aspect-ratio:1;border-radius:16px;background:repeating-conic-gradient(#d8dee9 0 25%,#f4f6fa 0 50%) 0 0/20px 20px;touch-action:none;display:block;margin:0 auto}
.pal{display:flex;flex-wrap:wrap;gap:5px}
.pal button{width:26px;height:26px;border-radius:8px;border:2px solid rgba(255,255,255,.3)}
.pal button.on{border-color:#fff;transform:scale(1.15)}
.stk{display:flex;flex-wrap:wrap;gap:6px}
.stk button{width:46px;height:46px;border-radius:10px;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;position:relative}
.stk button.on{background:#fff}
.stk button.lk{opacity:.35}
.stk canvas{width:34px;height:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- Geometrie ---------- */
function closestOnSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;return[ax+dx*t,ay+dy*t]}
function distPtSeg(px,py,ax,ay,bx,by){const c=closestOnSeg(px,py,ax,ay,bx,by);return Math.hypot(px-c[0],py-c[1])}
function segsCross(a,b,c,d,e,f,g,h){const o=(px,py,qx,qy,rx,ry)=>Math.sign((qx-px)*(ry-py)-(qy-py)*(rx-px));return o(a,b,c,d,e,f)!==o(a,b,c,d,g,h)&&o(e,f,g,h,a,b)!==o(e,f,g,h,c,d)}
function segSegDist(a,b,c,d,e,f,g,h){if(segsCross(a,b,c,d,e,f,g,h))return 0;return Math.min(distPtSeg(a,b,e,f,g,h),distPtSeg(c,d,e,f,g,h),distPtSeg(e,f,a,b,c,d),distPtSeg(g,h,a,b,c,d))}
function rectPoly(x,y,w,h,a){const c=Math.cos(a||0),s=Math.sin(a||0),hw=w/2,hh=h/2;return[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([u,v])=>[x+u*c-v*s,y+u*s+v*c])}
function ptInPoly(px,py,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)ins=!ins}return ins}
function distPtPoly(px,py,P){if(ptInPoly(px,py,P))return 0;let m=1e9;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];m=Math.min(m,distPtSeg(px,py,a[0],a[1],b[0],b[1]))}return m}
const isCirc=o=>o.r!=null&&o.w==null;
function shapeSegDist(o,ax,ay,bx,by){if(isCirc(o))return distPtSeg(o.x,o.y,ax,ay,bx,by)-o.r;const P=rectPoly(o.x,o.y,o.w,o.h,o.a);if(ptInPoly(ax,ay,P)||ptInPoly(bx,by,P))return -1;let m=1e9;for(let i=0;i<4;i++){const p=P[i],q=P[(i+1)%4];m=Math.min(m,segSegDist(ax,ay,bx,by,p[0],p[1],q[0],q[1]))}return m}
function shapePtDist(o,x,y){if(isCirc(o))return Math.hypot(x-o.x,y-o.y)-o.r;return distPtPoly(x,y,rectPoly(o.x,o.y,o.w,o.h,o.a))}
function inArea(a,x,y){if(isCirc(a)){const dx=x-a.x,dy=y-a.y;return dx*dx+dy*dy<a.r*a.r}const c=Math.cos(-(a.a||0)),s=Math.sin(-(a.a||0)),dx=x-a.x,dy=y-a.y,u=dx*c-dy*s,v=dx*s+dy*c;return Math.abs(u)<a.w/2&&Math.abs(v)<a.h/2}
function areaRad(a){return isCirc(a)?a.r:Math.hypot(a.w,a.h)/2}

function dimples(c,col){c.fillStyle=col;for(let y=3;y<64;y+=7)for(let x=(y%14?3:6.5);x<64;x+=7){c.beginPath();c.arc(x,y,1.5,0,TAU);c.fill()}}
function fillAll(c,f){c.fillStyle=f;c.fillRect(0,0,64,64)}
function circ(c,x,y,r,f){c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function star(c,x,y,r,f,ri){c.fillStyle=f;c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*(ri||.45):r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}

function genLevel(seed,d,theme,opt){opt=opt||{};
 const R=mulberry32(seed),rnd=(a,b)=>a+(b-a)*R(),ri=(a,b)=>Math.floor(a+(b-a+1)*R());
 const hw=lerp(64,12.6,Math.pow(d,0.7));
 let nSeg=opt.nSeg||clamp(1+(R()<0.5?0:1)+Math.round(d*3.4),1,5);
 let pts=null;
 for(let tries=0;tries<300&&!pts;tries++){
  if(tries===150&&nSeg>1)nSeg--;
  const p=[{x:rnd(70,W-70),y:rnd(70,H-70)}];let ok=true;
  for(let i=0;i<nSeg&&ok;i++){let placed=false;
   for(let k=0;k<50;k++){const prev=p[p.length-1],ang=rnd(0,TAU),len=nSeg===1?rnd(360,560):rnd(170,370);
    const q={x:prev.x+Math.cos(ang)*len,y:prev.y+Math.sin(ang)*len};
    if(q.x<60||q.x>W-60||q.y<60||q.y>H-60)continue;
    let bad=false;
    for(let j=0;j<p.length-1&&!bad;j++)if(distPtSeg(q.x,q.y,p[j].x,p[j].y,p[j+1].x,p[j+1].y)<hw*2+40)bad=true;
    for(let j=0;j<p.length-2&&!bad;j++)if(segSegDist(prev.x,prev.y,q.x,q.y,p[j].x,p[j].y,p[j+1].x,p[j+1].y)<hw*2+24)bad=true;
    if(!bad&&p.length>1){const a0=Math.atan2(prev.y-p[p.length-2].y,prev.x-p[p.length-2].x);const da=Math.abs(((ang-a0)%TAU+TAU*1.5)%TAU-Math.PI);if(da>2.2)bad=true}
    if(!bad){p.push(q);placed=true;break}}
   if(!placed)ok=false}
  if(ok)pts=p}
 if(!pts){nSeg=1;pts=[{x:110,y:250},{x:690,y:250}]}
 const segs=[];for(let i=0;i<pts.length-1;i++)segs.push([pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y]);

  case'deco':w.circs.push({x:o.x,y:o.y,r:o.r,e:0.55,o,flash:0});break;

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function shoot(p,ang,pw){const b=p.b,v=shotSpeed(pw);b.vx=Math.cos(ang)*v;b.vy=Math.sin(ang)*v;b.moving=true;b.sx=b.x;b.sy=b.y;b.strokes++;b.bounces=0;b.teled=false;b.shotT=G.t;b.shotFrom={x:b.x,y:b.y};b.imp=0;
 if(G.mode!=='online')G.phase='roll';
 if(G.mode!=='demo')snd('hit',0.4+pw*0.6);
 burst(b.x,b.y,7,['#ffffff',(THEMES[G.spec.theme]||THEMES.sky).turf[1]],90,0.4,2);
 if(!p.bot&&!p.net&&countsStats()){S.st.shots++;quest('shots',1)}
 if(G.mode==='online'&&!p.net)netPos(true);
 updHud()}
const countsStats=()=>['campaign','map','bot','online'].includes(G.mode);
function tick(){G.t+=DT;const w=G.w;if(!w)return;
 if(G.botShot&&G.t>=G.botShot.t0){const bs=G.botShot;G.botShot=null;const p=G.players[G.cur];if(p&&p.bot&&!p.b.moving&&!p.b.done)shoot(p,bs.a,bs.pw)}
 for(const p of G.players){const b=p.b;if(!b)continue;
  if(b.respawn>0){b.respawn-=DT;if(b.respawn<=0){b.x=b.sx;b.y=b.sy;b.vx=b.vy=0;b.trail=[];afterShot(p,'water')}continue}
  if(b.sinkA>0){b.sinkA-=DT;if(b.sinkA<=0)afterShot(p,'sink');continue}
  if(!b.moving||p.net)continue;
  b.ev=0;const r=stepBall(w,b,G.t);
  if(G.mode!=='demo'){if(b.ev&1){snd('wall',Math.min(1,(b.imp||0)/500));b.imp=0}if(b.ev&4)snd('bump');if(b.ev&2){snd('tele');burst(b.x,b.y,16,['#b38cff','#fff'],120,0.5,2.5)}if(b.ev&8&&!p.bot&&countsStats()&&!S.st.mill){S.st.mill=1;checkAch()}}
  b.rot+=Math.hypot(b.vx,b.vy)*DT/BR*0.5;
  if(Math.floor(G.t/DT)%2===0){b.trail.push({x:b.x,y:b.y});if(b.trail.length>16)b.trail.shift()}
  if(r==='sink'){b.moving=false;b.sinkA=0.3;if(G.mode!=='demo')snd('sink');burst(w.hole.x,w.hole.y,30,['#ffd23a','#ff6b6b','#5ad1ff','#7dff8a','#ffffff'],220,1.2,5,260)}
  else if(r==='water'){b.moving=false;b.strokes++;b.respawn=0.7;b.vx=b.vy=0;const th=THEMES[G.spec.theme]||THEMES.sky;burst(b.x,b.y,22,[th.lc[0],'#ffffff',th.lc[1]],140,0.7,3,200);if(G.mode!=='demo')snd('water');if(!p.bot&&!p.net&&countsStats()){S.st.water++}
   if(!p.bot&&!p.net&&G.mode!=='demo')flash(th.liq==='Lava'?'Lava! +1':th.liq==='Abgrund'?'Abgestürzt! +1':'Platsch! +1')}
  else if(r==='stop'){b.moving=false;afterShot(p,'stop')}
  if(G.mode==='online'&&!p.net&&Math.floor(G.t/DT)%6===0)netPos(false)}}
function afterShot(p,kind){const b=p.b,sp=G.spec;
 if(kind==='sink'){b.done=true;b.sunk=true;if(!p.bot&&!p.net)onSink(p);else if(p.bot&&G.mode!=='demo')flash(p.name+': '+scoreName(b.strokes,sp.par))}
 else if(b.strokes>=sp.max){b.done=true;b.sunk=false;if(!p.bot&&G.mode!=='demo')flash('Keine Schläge mehr')}
 if(G.mode==='online'&&!p.net){netPos(false);if(b.done)netSend({k:'done',hole:G.match.idx,s:holeScore(p)})}
 save();updHud();
 if(b.done&&!p.bot&&!p.net&&G.mode!=='bot'&&G.mode!=='online'){setTimeout(holeComplete,b.sunk?900:700);G.phase='over';return}
 nextTurn()}
function holeScore(p){return p.b.sunk?p.b.strokes:G.spec.max+1}
function scoreName(s,par){if(s===1)return'Hole-in-One!';const d=s-par;return d<=-3?'Albatros!':d===-2?'Eagle!':d===-1?'Birdie!':d===0?'Par':d===1?'Bogey':d===2?'Doppel-Bogey':'+'+d}
function onSink(p){const b=p.b,sp=G.spec;flash(scoreName(b.strokes,sp.par));if(!countsStats())return;
 const dist=Math.hypot(b.shotFrom.x-sp.hole.x,b.shotFrom.y-sp.hole.y)/10;
 S.st.holes++;quest('holes',1);if(b.strokes===1){S.st.hio++;quest('hio',1)}if(dist>S.st.long)S.st.long=Math.floor(dist);
 if(b.bounces>=3){S.st.bank++;quest('bank',1)}if(b.teled)S.st.tele++;if(G.t-b.shotT<1.2)S.st.speed++;if(b.strokes===sp.max&&sp.max>1)S.st.last++;if(b.strokes<sp.par){S.st.under++;quest('under',1)}
 if(G.mode==='map')quest('maps',1);
 b.lastDist=dist;checkAch()}
function nextTurn(){
 if(G.mode==='online'){const m=me();G.phase=m.b.done?'wait':'aim';updHud();onlineCheck();return}
 const live=G.players.filter(p=>!p.b.done);if(!live.length){G.phase='over';setTimeout(holeComplete,900);return}
 let n=G.cur;for(let i=1;i<=G.players.length;i++){const j=(G.cur+i)%G.players.length;if(!G.players[j].b.done){n=j;break}}
 G.cur=n;G.phase='aim';updHud();if(G.players[n].bot)botTurn()}
function botTurn(){const p=G.players[G.cur],w=G.w,b=p.b,cfg=BOTCFG[p.bot];G.phase='think';updHud();if(!w.df)w.df=distField(w);
 const t0=G.t+(G.mode==='demo'?1.2:0.9),hA=Math.atan2(w.hole.y-b.y,w.hole.x-b.x),id=++G.botJob,tot=cfg.n+cfg.ref;let best=null,i=0;
 const ev=(a,pw)=>{const r=simShot(w,b.x,b.y,a,pw,t0);return r.r==='sink'?-1000-pw*20:r.r==='water'?3000+w.df.get(b.x,b.y):w.df.get(r.x,r.y)};
 function chunk(){if(id!==G.botJob||G.w!==w)return;const end=Math.min(tot,i+10);
  for(;i<end;i++){let a,pw;if(i>=cfg.n&&best){a=best.a+(Math.random()-.5)*0.1;pw=clamp(best.pw+(Math.random()-.5)*0.1,0.05,1)}else if(i%3===0){a=hA+(Math.random()-.5)*0.5;pw=0.2+Math.random()*0.8}else{a=Math.random()*TAU;pw=0.12+Math.random()*0.88}
   const s=ev(a,pw);if(!best||s<best.s)best={a,pw,s}}
  if(i<tot){setTimeout(chunk,0);return}
  G.botShot={a:best.a+gauss()*cfg.an,pw:clamp(best.pw*(1+gauss()*cfg.pn),0.05,1),t0:Math.max(t0,G.t+0.15)}}
 setTimeout(chunk,30)}

 if(!b.sunk){snd('fail');modal(`<h2>Keine Schläge mehr</h2><p class="sub">Du hattest ${sp.max} Schläge. Atme durch und versuch es nochmal.</p><div class="btns"><button class="btn green" data-act="retry">Nochmal</button><button class="btn ghost" data-act="${mode==='test'?'backEditor':'backList'}">${mode==='test'?'Zum Editor':'Zur Auswahl'}</button></div>`);return}
 const stars=b.strokes===1||b.strokes<=sp.par?3:b.strokes<=sp.par+2?2:1;
 let base=0,prev=null,unl=[];
 if(mode==='campaign'){base=lvBase(sp.lvl);prev=S.lv[sp.lvl]}
 else if(mode==='map'){base=mapBase(sp);S.mapProg[sp.map]=S.mapProg[sp.map]||{};prev=S.mapProg[sp.map][sp.hi]}
 const mult=b.strokes===1?3:Math.max(0.2,1-(b.strokes-1)/sp.max*0.85);
 const coins=Math.round(base*mult*(prev?0.35:1));
 const xp=mode==='campaign'?15+Math.floor(sp.lvl/4):mode==='map'?20:0;
 const newRec={s:Math.max(prev?prev.s:0,stars),b:Math.min(prev?prev.b:99,b.strokes)};
 if(mode==='campaign'){S.lv[sp.lvl]=newRec;if(sp.lvl>=S.maxLv&&sp.lvl<NLEVELS+1){const old=S.maxLv;S.maxLv=sp.lvl+1;
  if(old<=5&&S.maxLv>5)unl.push('Ball-Editor freigeschaltet!');if(old<=10&&S.maxLv>10)unl.push('Map-Editor freigeschaltet!');
  if(sp.lvl%10===0&&sp.lvl<NLEVELS)unl.push('Neue Welt: '+THEMES[CHAPTERS[sp.lvl/10]].n);
  MAPS.forEach(m=>{if(m.req===sp.lvl+1&&!S.mapsOwned[m.id])unl.push('Map im Shop verfügbar: '+m.n)});
  EOBJ.forEach(o=>{if(o.lv===sp.lvl&&o.lv>0&&!o.shopOnly)unl.push('Editor-Objekt: '+o.n+(o.p?' (im Shop)':''))})}}
 if(mode==='map')S.mapProg[sp.map][sp.hi]=newRec;
 if(stars===3&&(mode==='campaign'||mode==='map'))quest('stars3',1);
 if(coins)addCoins(coins);if(xp)addXP(xp);save();checkAch();updTop();
 snd('win');
 const hasNext=mode==='campaign'?sp.lvl<NLEVELS:mode==='map'?sp.hi<8:false;
 const dist=b.lastDist!=null?b.lastDist:Math.hypot(b.shotFrom.x-sp.hole.x,b.shotFrom.y-sp.hole.y)/10;
 modal(`<h2>${b.strokes===1?'Hole-in-One!':scoreName(b.strokes,sp.par)}</h2><p class="sub">${esc(sp.name||'Eigene Map')}</p>
 <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}" style="animation-delay:${i*0.18}s">\u2605</span>`).join('')}</div>
 ${coins?`<div class="reward"><span class="coin"></span>+<span id="cnt">0</span></div>`:mode==='custom'||mode==='test'?'<p class="sub">Eigene Maps geben keine Coins.</p>':''}
 <div class="kv"><span>Schläge</span><b>${b.strokes} / ${sp.max}</b><span>Par</span><b>${sp.par}</b><span>Letzter Schlag aus</span><b>${dist.toFixed(1).replace('.',',')} m</b>${xp?`<span>Erfahrung</span><b>+${xp} XP</b>`:''}${prev&&coins?'<span>Wiederholung</span><b>35 % Coins</b>':''}</div>
 ${unl.map(u=>`<div class="note" style="margin-top:6px">${esc(u)}</div>`).join('')}
 <div class="btns">${hasNext?'<button class="btn green" data-act="nextLevel">Weiter</button>':''}<button class="btn blue" data-act="retry">Nochmal</button><button class="btn ghost" data-act="${mode==='test'?'backEditor':'backList'}">${mode==='test'?'Zum Editor':'Auswahl'}</button></div>`);
 if(coins)countUp($('#cnt'),coins)}
function countUp(el,n){if(!el)return;let v=0;const st=performance.now();const f=now=>{const k=Math.min(1,(now-st)/900);v=Math.round(n*k*(2-k));el.textContent=fmt(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f);let c=0;const iv=setInterval(()=>{snd('coin');if(++c>5)clearInterval(iv)},140)}

/* ---------- Bot-Match ---------- */
function buildCourse(src,n){const out=[];
 if(src==='campaign'){const max=Math.max(1,S.maxLv-1);const R=mulberry32(Date.now()&0xffff);for(let i=0;i<n;i++)out.push(campaignSpec(1+Math.floor(R()*max)))}
 else if(src.startsWith('map:')){const id=src.slice(4);const idx=[0,1,2,3,4,5,6,7,8];idx.sort(()=>Math.random()-.5);idx.slice(0,n).sort((a,b)=>a-b).forEach(i=>out.push(mapSpec(id,i)))}
 else if(src==='custom'){S.customMaps.slice(0,n).forEach(m=>out.push(Object.assign({},m.spec,{name:m.n,custom:true})))}
 return out}
function startBotMatch(cfg){const course=buildCourse(cfg.src,cfg.holes);if(!course.length){toast('Keine Löcher','Für diese Auswahl gibt es keine Löcher.');return}
 const players=[mkPlayer(S.name,S.skin,{col:PCOLS[0]})];const pool=SKINS.slice(1);
 for(let i=0;i<cfg.n;i++)players.push(mkPlayer(BOTNAMES[(i+Math.floor(Math.random()*3))%BOTNAMES.length],pool[Math.floor(Math.random()*pool.length)].id,{bot:cfg.diff,col:PCOLS[i+1]}));
 G.match={type:'bot',cfg,course,idx:0,players,custom:cfg.src==='custom'};startHole(course[0],players,'bot')}
function botHoleDone(){const m=G.match;m.players.forEach(p=>p.score[m.idx]=holeScore(p));
 const humanP=m.players[0];
 if(humanP.b.sunk&&!m.custom){const mult=BOTCFG[m.cfg.diff].mult;m.coins=(m.coins||0)+Math.round(8*mult+(humanP.b.strokes===1?20*mult:0));addXP(12)}
 const last=m.idx>=m.course.length-1;save();
 modal(`<h2>${last?'Endstand':'Loch '+(m.idx+1)+' geschafft'}</h2>${scoreTable(m.players,m.course)}${last?botFinal(m):''}
 <div class="btns">${last?'<button class="btn green" data-act="botAgain">Revanche</button><button class="btn ghost" data-act="home">Menü</button>':'<button class="btn green" data-act="botNext">Nächstes Loch</button>'}</div>`);

function totals(players){return players.map(p=>p.score.reduce((a,b)=>a+(b||0),0))}
function scoreTable(players,course){const tt=totals(players);return`<div class="scwrap"><table class="sc"><tr><th>Spieler</th>${course.map((c,i)=>`<th>${i+1}</th>`).join('')}<th>Σ</th></tr>
 ${players.map((p,k)=>`<tr><td><span style="color:${p.col}">●</span> ${esc(p.name)}</td>${course.map((c,i)=>`<td>${p.score[i]!=null?p.score[i]:'–'}</td>`).join('')}<td><b>${tt[k]}</b></td></tr>`).join('')}
 <tr><td style="color:var(--muted)">Par</td>${course.map(c=>`<td style="color:var(--muted)">${c.par}</td>`).join('')}<td></td></tr></table></div>`}
function botFinal(m){const tt=totals(m.players),mine=tt[0],best=Math.min(...tt.slice(1));const won=mine<best,mult=BOTCFG[m.cfg.diff].mult;let bonus=0;
 if(won){if(!m.custom)bonus=Math.round(m.course.length*10*mult);const k=m.cfg.diff==='easy'?'botEasy':m.cfg.diff==='medium'?'botMed':'botHard';S.st[k]++;quest('botwin',1)}
 const total=(m.coins||0)+bonus;if(total)addCoins(total);save();checkAch();updTop();

function addXP(x){S.xp+=x;while(S.xp>=xpNeed(S.plv)){S.xp-=xpNeed(S.plv);S.plv++;const r=40+S.plv*20;S.coins+=r;S.earned+=r;toast('Level '+S.plv+'!','Spielerlevel aufgestiegen: +'+r+' Coins','gold');snd('ach')}updTop()}

function ensureQuests(){const d=dayStr(new Date());if(S.quests.date===d)return;const R=mulberry32(hashStr(d+SALT));const pool=QPOOL.slice();const list=[];
 while(list.length<3&&pool.length){const q=pool.splice(Math.floor(R()*pool.length),1)[0];const i=Math.floor(R()*q.n.length);list.push({k:q.k,n:q.n[i],r:q.r[i],t:q.t.replace('{n}',fmt(q.n[i])),p:0,c:false})}

 ctx.drawImage(staticFor(G.spec),0,0,VW,VH);ctx.save();ctx.translate(MG,MG);drawDyn(ctx,dt,th);ctx.restore()}

 for(const a of w.areas)if(a.t==='boost'){c.save();c.translate(a.x,a.y);c.rotate(a.a||0);rrect(c,-a.w/2,-a.h/2,a.w,a.h,8);c.clip();c.strokeStyle=th.acc;c.lineWidth=4;c.lineCap='round';const o=(t*70)%22;for(let u=-a.w/2-22+o;u<a.w/2+22;u+=22){c.globalAlpha=.85;c.beginPath();c.moveTo(u-6,-10);c.lineTo(u+3,0);c.lineTo(u-6,10);c.stroke()}c.restore()}
 for(const tl of w.teles)[[tl.x,tl.y],[tl.x2,tl.y2]].forEach(([x,y],i)=>{c.save();c.translate(x,y);c.rotate(t*(i?-3:3));c.strokeStyle=i?'#ff9a4d':'#b38cff';c.lineWidth=2.5;for(let k=0;k<3;k++){c.beginPath();c.arc(0,0,4+k*3.5,k*2,k*2+3.6);c.stroke()}c.restore()});
 for(const cc of w.circs){if(!cc.bump||cc.o.t==='custom')continue;const f=cc.flash;cc.flash=Math.max(0,f-dt*4);const r=cc.r*(1+f*0.15);c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(cc.x+3,cc.y+5,r,r*.85,0,0,TAU);c.fill();circ(c,cc.x,cc.y,r,f>0?'#fff':th.acc);circ(c,cc.x,cc.y,r*.72,shade(th.acc,-.25));circ(c,cc.x,cc.y,r*.5,'#fff');circ(c,cc.x-r*.18,cc.y-r*.2,r*.18,'rgba(255,255,255,.9)')}
 for(const p of w.polys)if(p.bump&&p.flash>0)p.flash=Math.max(0,p.flash-dt*4);
 for(const m of w.movers){const st=moverState(m,t),P=rectPoly(st.x,st.y,m.w,m.h,m.a);c.fillStyle='rgba(0,0,0,.22)';polyPath(c,P,4,7);c.fill();c.fillStyle=shade(th.acc,-.35);polyPath(c,P,0,5);c.fill();c.fillStyle=th.acc;polyPath(c,P,0,0);c.fill();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1.5;c.stroke()}
 for(const m of w.mills){const s=millSeg(m,t);c.lineCap='round';c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=9;c.beginPath();c.moveTo(s[0]+4,s[1]+7);c.lineTo(s[2]+4,s[3]+7);c.stroke();c.strokeStyle='#7a4a22';c.lineWidth=9;c.beginPath();c.moveTo(s[0],s[1]+3);c.lineTo(s[2],s[3]+3);c.stroke();c.strokeStyle='#c98a4b';c.lineWidth=8;c.beginPath();c.moveTo(s[0],s[1]);c.lineTo(s[2],s[3]);c.stroke();circ(c,m.x,m.y,8,'#5a3415');circ(c,m.x,m.y,4.5,'#ffd23a')}
 // Spur & Bälle
 for(const p of G.players){const b=p.b;if(!b)continue;const info=skinInfo(p.skin);
  if(!b.moving&&b.trail.length)b.trail.shift();
  b.trail.forEach((q,i)=>{const k=(i+1)/b.trail.length;let col=info.tr||'#fff';if(col==='rainbow')col='hsl('+((i*25+t*200)%360)+',90%,60%)';else if(col==='fire')col=i%2?'#ffb02e':'#ff5a1f';c.globalAlpha=k*0.35*(p.net?0.5:1);circ(c,q.x,q.y,BR*k*0.85,col)});c.globalAlpha=1;
  if(b.done&&b.sunk&&b.sinkA<=0)continue;

  if(b.sinkA>0){const k=b.sinkA/0.3;x=lerp(w.hole.x,b.x,k);y=lerp(w.hole.y,b.y,k);r=BR*(0.35+0.65*k)}
  if(b.respawn>0){al*=Math.max(0,(b.respawn-0.35)/0.35);r*=0.7+0.3*al}
  drawBall(c,x,y,r,p.skin,b.rot,al);

/* ---------- Tagesbelohnung & Aufgaben ---------- */
function freshLoad(){if(STORAGE_OK&&sGet(SKEY)!==null)loadSave()}
function dailyModal(){freshLoad();const today=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);const yest=dayStr(y);const can=S.streak.last!==today,clockBad=Date.now()<S.maxTime-10*60*1000;
 const broken=can&&S.streak.n>0&&S.streak.last!==yest;const nextN=can?(S.streak.last===yest?S.streak.n+1:1):S.streak.n;const st=Math.floor((Math.max(1,nextN)-1)/7)*7+1;
 const mid=new Date();mid.setHours(24,0,0,0);const hrs=Math.floor((mid-Date.now())/3600000),mins=Math.floor((mid-Date.now())/60000)%60;
 modal(`<h2>Tägliche Belohnung</h2><p class="sub">${can?(broken?'Deine Serie ist gerissen. Starte heute eine neue!':'Hol dir deine Belohnung für Tag '+nextN+'.'):'Heute schon abgeholt. Nächste Belohnung in '+hrs+' h '+mins+' min.'}</p>
 <div class="days">${[0,1,2,3,4,5,6].map(i=>{const n=st+i,got=can?n<nextN:n<=S.streak.n,today2=can&&n===nextN;return`<div class="day ${got?'got':''} ${today2?'today':''}"><span>Tag ${n}</span><b>${streakReward(n)}</b><span class="coin" style="width:12px;height:12px"></span></div>`}).join('')}</div>
 <p class="sub">Jede volle Woche Serie gibt +25 % auf alle Belohnungen. Pro Kalendertag nur einmal: Neuladen bringt nichts.</p>
 ${clockBad?'<p class="note">Die Uhrzeit deines Geräts wurde zurückgestellt. Belohnungen gibt es wieder, sobald die Zeit stimmt.</p>':''}
 <div class="btns">${can&&!clockBad?`<button class="btn green" data-act="claimDaily">Abholen: +${streakReward(nextN)}</button>`:''}<button class="btn ghost" data-act="closeModal">Schließen</button></div>`)}
function claimDaily(){freshLoad();const today=dayStr(new Date());if(S.streak.last===today){toast('Schon abgeholt','Komm morgen wieder.');closeModal();updTop();return}
 if(Date.now()<S.maxTime-10*60*1000){toast('Uhrzeit stimmt nicht','Belohnung gesperrt.');return}
 const y=new Date();y.setDate(y.getDate()-1);S.streak.n=S.streak.last===dayStr(y)?S.streak.n+1:1;S.streak.last=today;S.streak.best=Math.max(S.streak.best||0,S.streak.n);
 const r=streakReward(S.streak.n);S.coins+=r;S.earned+=r;save();snd('win');checkAch();updTop();
 modal(`<h2>Tag ${S.streak.n}!</h2><div class="reward"><span class="coin"></span>+<span id="cnt">0</span></div><p class="sub">Komm morgen wieder, damit deine Serie weiterläuft.</p><div class="btns"><button class="btn green" data-act="closeModal">Super</button></div>`);countUp($('#cnt'),r)}
function questsModal(){ensureQuests();const q=S.quests;const all=q.list.every(x=>x.c);
 modal(`<h2>Tagesaufgaben</h2><p class="sub">Jeden Tag neue Aufgaben. Schaffst du alle drei, gibt es einen Bonus.</p>${q.list.map((x,i)=>`<div class="quest"><div class="tx"><b>${esc(x.t)}</b><div class="pg"><i style="width:${x.p/x.n*100}%"></i></div><small class="sub">${fmt(x.p)} / ${fmt(x.n)}</small></div>${x.c?'<span class="sub">Erledigt ✓</span>':x.p>=x.n?`<button class="btn sm green" data-act="claimQuest" data-i="${i}">+${x.r}</button>`:`<span class="price"><span class="coin"></span>${x.r}</span>`}</div>`).join('')}
 <div class="quest"><div class="tx"><b>Bonus: alle drei geschafft</b></div>${q.bonus?'<span class="sub">Erledigt ✓</span>':all?'<button class="btn sm" data-act="claimBonus">+250</button>':'<span class="price"><span class="coin"></span>250</span>'}</div>
 <div class="btns"><button class="btn ghost" data-act="closeModal">Schließen</button></div>`)}

/* ---------- Aktionen ---------- */
const ACT={
 home:goHome,closeModal:()=>{closeModal()},
 daily:dailyModal,claimDaily,quests:questsModal,
 claimQuest:d=>{freshLoad();ensureQuests();const q=S.quests.list[+d.i];if(!q||q.c||q.p<q.n)return;q.c=true;addCoins(q.r);save();snd('coin');checkAch();questsModal()},
 claimBonus:()=>{freshLoad();ensureQuests();if(S.quests.bonus||!S.quests.list.every(x=>x.c))return;S.quests.bonus=true;addCoins(250);save();snd('win');questsModal()},
 sound:()=>{S.sound=!S.sound;save();updTop()},
 levels:()=>showScreen('levels'),
 lvl:d=>{const n=+d.n;if(n>S.maxLv)return;G.last={mode:'campaign',n};startHole(campaignSpec(n),[mkPlayer(S.name,S.skin,{col:PCOLS[0]})],'campaign')},
 chest:()=>{const ci=chestInfo();if(!ci.ok)return;S.chests++;addCoins(ci.rew);save();snd('win');toast('Sternentruhe geöffnet','+'+ci.rew+' Coins','gold');showScreen('levels')},
 maps:()=>showScreen('maps'),mapTab:d=>{MAPTAB=d.t;showScreen('maps')},
 mapOpen:d=>mapHolesModal(d.id),
 mapPlay:d=>{closeModal();G.last={mode:'map',id:d.id,i:+d.i};startHole(mapSpec(d.id,+d.i),[mkPlayer(S.name,S.skin,{col:PCOLS[0]})],'map')},
 customPlay:d=>{const m=S.customMaps[+d.i];if(!m)return;G.last={mode:'custom',i:+d.i};startHole(Object.assign(JSON.parse(JSON.stringify(m.spec)),{name:m.n}),[mkPlayer(S.name,S.skin,{col:PCOLS[0]})],'custom')},
 customEdit:d=>edOpen(+d.i),
 customDel:d=>{const m=S.customMaps[+d.i];if(!m)return;modal(`<h2>Map löschen?</h2><p class="sub">„${esc(m.n)}“ wird endgültig gelöscht.</p><div class="btns"><button class="btn coral" data-act="customDelOk" data-i="${d.i}">Löschen</button><button class="btn ghost" data-act="closeModal">Abbrechen</button></div>`)},
 customDelOk:d=>{S.customMaps.splice(+d.i,1);save();closeModal();showScreen('maps')},
 retry:()=>{closeModal();const l=G.last;if(!l)return goHome();if(l.mode==='campaign')ACT.lvl({n:l.n});else if(l.mode==='map')ACT.mapPlay({id:l.id,i:l.i});else if(l.mode==='custom')ACT.customPlay({i:l.i});else if(l.mode==='test')edTest()},
 restartHole:()=>{if(['campaign','map','custom','test'].includes(G.mode))ACT.retry()},
 nextLevel:()=>{closeModal();const l=G.last;if(l.mode==='campaign')ACT.lvl({n:l.n+1});else if(l.mode==='map')ACT.mapPlay({id:l.id,i:l.i+1})},
 backList:()=>{closeModal();const l=G.last||{};if(l.mode==='map'){showScreen('maps');mapHolesModal(l.id)}else if(l.mode==='custom'){MAPTAB='custom';showScreen('maps')}else showScreen('levels');startDemo()},
 pause:()=>{G.paused=G.mode!=='online';modal(`<h2>Pause</h2><p class="sub">${esc(G.spec&&G.spec.name||'')}</p><div class="btns" style="flex-direction:column"><button class="btn green" data-act="closeModal">Weiterspielen</button>${['campaign','map','custom','test'].includes(G.mode)?'<button class="btn blue" data-act="retry">Loch neu starten</button>':''}${G.mode==='test'?'<button class="btn ghost" data-act="backEditor">Zum Editor</button>':''}<button class="btn ghost" data-act="home">Aufgeben &amp; Menü</button></div>`)},
 bots:()=>showScreen('bots'),botSet:d=>{BOTSET[d.k]=isNaN(+d.v)?d.v:+d.v;showScreen('bots')},
 botStart:()=>startBotMatch(Object.assign({},BOTSET)),
 botNext:()=>{closeModal();const m=G.match;if(!m)return goHome();m.idx++;startHole(m.course[m.idx],m.players,'bot')},
 botAgain:()=>{closeModal();startBotMatch(Object.assign({},G.match.cfg))},
 online:()=>showScreen('online'),
 shop:()=>showScreen('shop'),shopTab:d=>{SHOPTAB=d.t;showScreen('shop')},
 buySkin:d=>buy(SKINS.find(s=>s.id===d.id),()=>{S.skins.push(d.id);S.skin=d.id}),
 equip:d=>{S.skin=d.id;save();showScreen('shop')},
 delSkin:d=>{S.customSkins=S.customSkins.filter(s=>s.id!==d.id);if(S.skin===d.id)S.skin='classic';delete TEX[d.id];save();showScreen('shop')},
 buySticker:d=>buy(STICKERS.find(s=>s.id===d.id),()=>S.stickers.push(d.id)),
 buyMap:d=>{const m=MAPS.find(x=>x.id===d.id);if(S.maxLv<m.req)return;buy(m,()=>{S.mapsOwned[m.id]=true},CUR)},
 buyObj:d=>{const o=EOBJ.find(x=>x.id===d.id);if(!objLvOk(o))return;buy(o,()=>{S.objs[o.id]=true})},
 ach:()=>showScreen('ach'),credits:()=>showScreen('credits'),
 skinEd:()=>{if(!unlockedSkinEd()){toast('Noch gesperrt','Schaffe Level 5 der Kampagne, um den Ball-Editor freizuschalten.');return}showScreen('skinEd')},
 mapEd:()=>{if(!unlockedMapEd()){toast('Noch gesperrt','Schaffe Level 10 der Kampagne, um den Map-Editor freizuschalten.');return}edOpen(-1)},
 backEditor:()=>{closeModal();edResume()}
};
function buy(item,give,back){if(!item)return;if(S.coins<item.p){toast('Zu wenig Coins','Dir fehlen '+fmt(item.p-S.coins)+' Coins.');return}S.coins-=item.p;give();save();snd('coin');toast('Gekauft!',item.n,'gold');checkAch();updTop();showScreen(back||CUR||'shop')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){snd('ui');f(el.dataset,el)}});

 const lab=(t,x,y)=>{c.font='900 11px Nunito, sans-serif';c.textAlign='center';c.fillStyle='rgba(0,0,0,.55)';c.fillText(t,x+1,y+1);c.fillStyle='#fff';c.fillText(t,x,y)};lab('START',sp.start.x,sp.start.y+24);lab('LOCH',sp.hole.x,sp.hole.y+26);
 for(const o of sp.objs){if(o.t==='mill'){c.strokeStyle='rgba(255,255,255,.18)';c.setLineDash([4,5]);c.beginPath();c.arc(o.x,o.y,o.len,0,TAU);c.stroke();c.setLineDash([])}if(o.t==='mover'){c.strokeStyle='rgba(255,255,255,.3)';c.setLineDash([4,4]);c.beginPath();c.moveTo(o.x-o.ax,o.y-o.ay);c.lineTo(o.x+o.ax,o.y+o.ay);c.stroke();c.setLineDash([])}if(o.t==='custom'&&o.hit!=='none'){c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([3,3]);if(o.shape==='circle'){c.beginPath();c.arc(o.x,o.y,o.w/2,0,TAU);c.stroke()}else{polyPath(c,rectPoly(o.x,o.y,o.w,o.h,o.a),0,0);c.stroke()}c.setLineDash([])}}
 const s=ED.sel;if(s&&typeof s==='object'){c.strokeStyle='#ffd23a';c.lineWidth=2;c.setLineDash([5,4]);if(isCirc(s)||s.t==='mill'||s.t==='mover'){c.beginPath();c.arc(s.x,s.y,(s.r||(s.t==='mill'?16:18))+5,0,TAU);c.stroke()}else if(s.t==='tele'){c.beginPath();c.arc(s.x,s.y,20,0,TAU);c.stroke();c.beginPath();c.arc(s.x2,s.y2,20,0,TAU);c.stroke()}else{polyPath(c,rectPoly(s.x,s.y,s.w+8,s.h+8,s.a||0),0,0);c.stroke()}c.setLineDash([])}
 if(ED.teleA){circ(c,ED.teleA.x,ED.teleA.y,12,'rgba(179,140,255,.7)')}
 const d=ED.drag;if(d&&d.mode==='new'){c.strokeStyle='#fff';c.lineWidth=2;c.setLineDash([6,4]);if(['wall','water','sand','ice'].includes(ED.tool)){c.strokeRect(Math.min(d.x0,d.x),Math.min(d.y0,d.y),Math.abs(d.x-d.x0),Math.abs(d.y-d.y0))}else if(ED.tool==='waterc'){c.beginPath();c.arc(d.x0,d.y0,Math.hypot(d.x-d.x0,d.y-d.y0),0,TAU);c.stroke()}else{c.beginPath();c.moveTo(d.x0,d.y0);c.lineTo(d.x,d.y);c.stroke()}c.setLineDash([])}
 c.restore()}
function edTest(){const sp=JSON.parse(JSON.stringify(ED.spec));delete sp.__uid;sp.name=(ED.name||'Eigene Map')+' (Test)';edClose();G.last={mode:'test'};startHole(sp,[mkPlayer(S.name,S.skin,{col:PCOLS[0]})],'test')}
function edSave(){const sp=JSON.parse(JSON.stringify(ED.spec));delete sp.__uid;const n=(ED.name||'Meine Map').slice(0,24);
 if(ED.idx>=0&&S.customMaps[ED.idx]){S.customMaps[ED.idx]={id:S.customMaps[ED.idx].id,n,spec:sp}}else{if(S.customMaps.length>=30){toast('Kein Platz','Maximal 30 eigene Maps. Lösche eine unter Maps → Eigene Maps.');return}S.customMaps.push({id:'m_'+Date.now().toString(36),n,spec:sp});ED.idx=S.customMaps.length-1;S.st.mapsMade++}
 save();checkAch();snd('coin');toast('Map gespeichert','„'+n+'“ findest du unter Maps → Eigene Maps.','gold')}
function edTplModal(){let opts='<optgroup label="Kampagne">';for(let n=1;n<Math.min(S.maxLv,NLEVELS+1);n++)opts+=`<option value="c:${n}">Level ${n}</option>`;opts+='</optgroup>';
 MAPS.forEach(m=>{if(S.mapsOwned[m.id]){opts+=`<optgroup label="${esc(m.n)}">`;for(let i=0;i<9;i++)opts+=`<option value="m:${m.id}:${i}">${esc(m.n)} · Loch ${i+1}</option>`;opts+='</optgroup>'}});
 if(S.customMaps.length){opts+='<optgroup label="Eigene Maps">'+S.customMaps.map((m,i)=>`<option value="u:${i}">${esc(m.n)}</option>`).join('')+'</optgroup>'}
 modal(`<h2>Vorlage laden</h2><p class="sub">Starte mit einem fertigen Loch und baue es um. Es ersetzt deine aktuelle Map.</p><select id="tplSel" style="width:100%;margin:12px 0">${opts}</select><div class="btns"><button class="btn green" id="tplOk">Laden</button><button class="btn ghost" data-act="backEditor">Abbrechen</button></div>`);
 $('#tplOk').onclick=()=>{const v=$('#tplSel').value;if(!v)return;const p=v.split(':');let sp=p[0]==='c'?campaignSpec(+p[1]):p[0]==='m'?mapSpec(p[1],+p[2]):S.customMaps[+p[1]].spec;edPush();sp=JSON.parse(JSON.stringify(sp));delete sp.__uid;delete sp.lvl;delete sp.map;delete sp.hi;ED.spec=sp;ED.sel=null;closeModal();edResume()}}

/* ---------- Objekt-Werkstatt ---------- */
const OB={col:'#8b5a2b',grid:null,shape:'rect',hit:'solid',name:'Mein Objekt',tool:'brush'};
function objModal(){if(!S.objs.workshop){modal(`<h2>Objekt-Werkstatt</h2><p class="sub">Zeichne eigene Gegenstände mit echter Hitbox: Wand, Bumper, Wasser, Sand, Eis oder nur Deko.</p><p class="note">Schalte die Werkstatt im Shop unter „Editor-Objekte“ für 600 Coins frei.</p><div class="btns"><button class="btn" data-act="goShopObjs">Zum Shop</button><button class="btn ghost" data-act="backEditor">Zurück</button></div>`);return}
 OB.grid=OB.grid||new Array(32*32).fill(null);
 modal(`<h2>Objekt zeichnen</h2><canvas id="obc" width="256" height="256" style="width:100%;max-width:256px;aspect-ratio:1;touch-action:none;border-radius:12px;background:repeating-conic-gradient(#d8dee9 0 25%,#f4f6fa 0 50%) 0 0/16px 16px"></canvas>
 <div class="pal" id="obPal" style="justify-content:center;margin:8px 0">${PAL.map(c=>`<button style="background:${c}" data-c="${c}" class="${OB.col===c?'on':''}"></button>`).join('')}<button data-c="" style="background:transparent;border-style:dashed" title="Radierer" aria-label="Radierer"></button></div>
 <div class="row" style="justify-content:center"><label class="fl">Hitbox<select id="obShape"><option value="rect" ${OB.shape==='rect'?'selected':''}>Rechteck</option><option value="circle" ${OB.shape==='circle'?'selected':''}>Kreis</option></select></label>
 <label class="fl">Verhalten<select id="obHit">${[['solid','Wand (fest)'],['bouncy','Bumper (federnd)'],['water','Wasser (Strafschlag)'],['sand','Sand (bremst)'],['ice','Eis (rutschig)'],['none','Nur Deko']].map(([v,t])=>`<option value="${v}" ${OB.hit===v?'selected':''}>${t}</option>`).join('')}</select></label>
 <label class="fl">Name<input type="text" id="obName" maxlength="16" value="${esc(OB.name)}"></label></div>
 <div class="btns"><button class="btn green" id="obSave">Speichern</button><button class="btn ghost" id="obClear">Leeren</button><button class="btn ghost" data-act="backEditor">Zurück</button></div>`);
 const c=$('#obc'),x=c.getContext('2d');const paint=()=>{x.clearRect(0,0,256,256);OB.grid.forEach((v,i)=>{if(v){x.fillStyle=v;x.fillRect(i%32*8,Math.floor(i/32)*8,8,8)}});x.strokeStyle='rgba(0,0,0,.35)';x.setLineDash([4,4]);if(OB.shape==='circle'){x.beginPath();x.arc(128,128,127,0,TAU);x.stroke()}else x.strokeRect(1,1,254,254);x.setLineDash([])};paint();
 let down=false;const put=e=>{const r=c.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/r.width*32),j=Math.floor((e.clientY-r.top)/r.height*32);if(i<0||j<0||i>31||j>31)return;OB.grid[j*32+i]=OB.col||null;paint()};
 c.onpointerdown=e=>{down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}put(e)};c.onpointermove=e=>{if(down)put(e)};c.onpointerup=c.onpointercancel=()=>down=false;
 $('#obPal').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;OB.col=b.dataset.c;$('#obPal').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b))};
 $('#obShape').onchange=e=>{OB.shape=e.target.value;paint()};$('#obHit').onchange=e=>OB.hit=e.target.value;$('#obName').oninput=e=>OB.name=e.target.value;
 $('#obClear').onclick=()=>{OB.grid.fill(null);paint()};
 $('#obSave').onclick=()=>{if(!OB.grid.some(v=>v)){toast('Leer','Zeichne zuerst etwas.');return}if(S.customObjs.length>=20){toast('Kein Platz','Maximal 20 eigene Objekte.');return}
  const o=document.createElement('canvas');o.width=o.height=32;const ox=o.getContext('2d');OB.grid.forEach((v,i)=>{if(v){ox.fillStyle=v;ox.fillRect(i%32,Math.floor(i/32),1,1)}});
  const id='o_'+Date.now().toString(36);S.customObjs.push({id,n:(OB.name||'Objekt').slice(0,16),img:o.toDataURL('image/png'),shape:OB.shape,hit:OB.hit});S.st.objsMade++;save();checkAch();OB.grid=null;ED.tool='cobj:'+id;toast('Objekt gespeichert','Es ist jetzt im Werkzeugkasten ausgewählt.','gold');closeModal();edResume()}}
ACT.goShopObjs=()=>{closeModal();edClose();SHOPTAB='objs';showScreen('shop')};
/* ================= Online (PeerJS) ================= */
const NET={peer:null,conn:null,host:false,code:'',st:'idle',msg:'',err:false,opp:null,set:{holes:3,src:'campaign'}};
const FAILMSG='Keine Verbindung zum PeerJS-Server. In der eingebetteten Vorschau sind direkte Verbindungen gesperrt. Öffne Sky Golf als eigene HTML-Datei im Browser, dann klappt der Online-Modus.';
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function netStatus(m,err){NET.msg=m;NET.err=!!err;if(err)NET.st='error';renderOnline()}
function loadPeer(cb){if(window.Peer)return cb();netStatus('Lade PeerJS …');const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>window.Peer?cb():netStatus(FAILMSG,true);s.onerror=()=>netStatus(FAILMSG,true);document.head.appendChild(s)}
function netLeave(){try{NET.conn&&NET.conn.close()}catch(e){}try{NET.peer&&NET.peer.destroy()}catch(e){}NET.conn=null;NET.peer=null;NET.st='idle';NET.opp=null;NET.msg=''}
function netHost(){netLeave();loadPeer(()=>{NET.host=true;NET.code=genCode();NET.st='opening';netStatus('Raum wird erstellt …');const to=setTimeout(()=>{if(NET.st==='opening')netStatus(FAILMSG,true)},10000);
 try{NET.peer=new Peer('skygolf-'+NET.code.toLowerCase(),{debug:0})}catch(e){clearTimeout(to);netStatus(FAILMSG,true);return}
 NET.peer.on('open',()=>{clearTimeout(to);NET.st='waiting';netStatus('Warte auf Mitspieler. Gib ihm diesen Code:')});
 NET.peer.on('connection',c=>{if(NET.conn){c.close();return}setupConn(c)});
 NET.peer.on('error',e=>{clearTimeout(to);netStatus(e&&e.type==='unavailable-id'?'Code schon vergeben, versuch es nochmal.':FAILMSG,true)})})}
function netJoin(code){code=(code||'').trim().toUpperCase();if(code.length<4){toast('Code fehlt','Gib den 5-stelligen Raumcode ein.');return}netLeave();loadPeer(()=>{NET.host=false;NET.code=code;NET.st='opening';netStatus('Verbinde mit Raum '+code+' …');const to=setTimeout(()=>{if(NET.st!=='connected')netStatus(FAILMSG,true)},12000);
 try{NET.peer=new Peer({debug:0})}catch(e){clearTimeout(to);netStatus(FAILMSG,true);return}
 NET.peer.on('open',()=>{const c=NET.peer.connect('skygolf-'+code.toLowerCase(),{reliable:true});setupConn(c,to)});
 NET.peer.on('error',e=>{clearTimeout(to);netStatus(e&&e.type==='peer-unavailable'?'Raum '+code+' nicht gefunden. Stimmt der Code?':FAILMSG,true)})})}
function setupConn(c,to){NET.conn=c;
 c.on('open',()=>{if(to)clearTimeout(to);NET.st='connected';const cs=S.skin.startsWith('c_')?skinInfo(S.skin):null;netSend({k:'hello',name:S.name,skin:cs?'c_remote':S.skin,img:cs?cs.img:null});netStatus(NET.host?'Verbunden! Wähle den Kurs und starte.':'Verbunden! Der Gastgeber startet gleich.')});
 c.on('data',onNet);
 c.on('close',()=>{const was=G.mode==='online';NET.conn=null;NET.st='idle';NET.opp=null;toast('Verbindung getrennt','Dein Mitspieler ist weg.');if(was){G.match=null;closeModal();showScreen('online');startDemo()}else renderOnline()});
 c.on('error',()=>netStatus(FAILMSG,true))}
function netSend(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(o)}catch(e){}}
function netPos(){const m=me();if(m&&m.b)netSend({k:'pos',x:Math.round(m.b.x*10)/10,y:Math.round(m.b.y*10)/10,s:m.b.strokes,m:m.b.moving,h:G.match?G.match.idx:0})}
function onNet(m){if(!m||typeof m!=='object')return;switch(m.k){
 case'hello':NET.opp={name:String(m.name||'Gegner').slice(0,16),skin:String(m.skin||'classic')};if(m.img&&typeof m.img==='string'&&m.img.startsWith('data:image/')){G.remoteSkins.c_remote={id:'c_remote',n:'',img:m.img,tr:'#ffffff'};delete TEX.c_remote}if(!SKINS.some(s=>s.id===NET.opp.skin)&&NET.opp.skin!=='c_remote')NET.opp.skin='classic';renderOnline();break;
 case'start':if(m.objs)for(const id in m.objs){if(typeof m.objs[id]==='string'&&m.objs[id].startsWith('data:image/')){G.remoteObjs[id]={img:m.objs[id]};delete OBJIMG[id]}}startOnline(m.course);break;
 case'pos':if(G.mode==='online'&&G.match&&m.h===G.match.idx){const o=G.players[1];if(o&&!o.b.done){o.b.x=+m.x;o.b.y=+m.y;o.b.strokes=+m.s;o.b.moving=!!m.m;updHud()}}break;
 case'done':if(G.match){G.match.pend[m.hole]=+m.s;if(G.mode==='online'&&m.hole===G.match.idx)applyOppDone()}break}}
function applyOppDone(){const mt=G.match,s=mt.pend[mt.idx];if(s==null)return;const o=G.players[1];o.b.done=true;o.b.sunk=s<=G.spec.max;o.b.strokes=Math.min(s,G.spec.max);o.score[mt.idx]=s;updHud();onlineCheck()}
function netStart(){if(!NET.conn){toast('Niemand verbunden','Warte, bis dein Mitspieler beigetreten ist.');return}const course=buildCourse(NET.set.src,NET.set.holes).map(s=>{const c=JSON.parse(JSON.stringify(s));delete c.__uid;return c});if(!course.length)return;
 const objs={};course.forEach(s=>s.objs.forEach(o=>{if(o.t==='custom'){const co=S.customObjs.find(x=>x.id===o.id);if(co)objs[o.id]=co.img}}));netSend({k:'start',course,objs});startOnline(course)}
function startOnline(course){closeModal();const opp=NET.opp||{name:'Gegner',skin:'classic'};const players=[mkPlayer(S.name,S.skin,{col:PCOLS[0]}),mkPlayer(opp.name,opp.skin,{net:true,col:PCOLS[2]})];
 G.match={type:'online',course,idx:0,players,pend:{},custom:course.some(c=>c.custom)};startHole(course[0],players,'online');G.cur=0;updHud()}
function onlineCheck(){const mt=G.match;if(!mt||mt.checking)return;const a=G.players[0],b=G.players[1];if(!a.b.done||!b.b.done)return;mt.checking=true;a.score[mt.idx]=holeScore(a);
 if(a.b.sunk&&!mt.custom){mt.coins=(mt.coins||0)+8;addXP(18)}
 const last=mt.idx>=mt.course.length-1;
 setTimeout(()=>{if(G.match!==mt)return;
  if(!last){modal(`<h2>Loch ${mt.idx+1}</h2>${scoreTable(mt.players,mt.course)}<p class="sub">Nächstes Loch startet gleich …</p>`);setTimeout(()=>{if(G.match!==mt)return;closeModal();mt.idx++;mt.checking=false;startHole(mt.course[mt.idx],mt.players,'online');if(mt.pend[mt.idx]!=null)applyOppDone()},2600)}
  else{const tt=totals(mt.players),won=tt[0]<tt[1];S.st.online++;if(won)S.st.onlineWin++;const bonus=won&&!mt.custom?60:0;const tot=(mt.coins||0)+bonus;if(tot)addCoins(tot);save();checkAch();snd(won?'win':'fail');
   modal(`<h2>${won?'Gewonnen!':tt[0]===tt[1]?'Unentschieden':'Verloren'}</h2>${scoreTable(mt.players,mt.course)}${tot?`<div class="reward"><span class="coin"></span>+${tot}</div>`:''}<div class="btns">${NET.host?'<button class="btn green" data-act="netAgain">Neues Match</button>':'<p class="sub">Der Gastgeber kann ein neues Match starten.</p>'}<button class="btn ghost" data-act="home">Verlassen</button></div>`)}},1200)}
function renderOnline(){const el=$('#onBody');if(!el||CUR!=='online')return;let h=`<label class="fl">Dein Name<input type="text" id="onName" maxlength="16" value="${esc(S.name)}"></label>`;
 if(NET.st==='idle'||NET.st==='error'){h+=`<div class="row" style="margin-top:14px;align-items:flex-end"><button class="btn green" data-act="netHost">Raum erstellen</button><span class="sub" style="padding:0 6px">oder</span><label class="fl" style="flex:1;min-width:120px">Raumcode<input type="text" id="onCode" maxlength="5" placeholder="z. B. K7Q2M" style="text-transform:uppercase"></label><button class="btn blue" data-act="netJoin">Beitreten</button></div>`}
 if(NET.msg)h+=`<p class="${NET.err?'note':'sub'}" style="margin-top:14px">${esc(NET.msg)}</p>`;
 if(NET.host&&(NET.st==='waiting'||NET.st==='connected'))h+=`<div style="text-align:center;margin:12px 0"><span class="code">${NET.code}</span></div>`;
 if(NET.st==='connected'){h+=`<div class="note" style="margin-top:10px">Gegner: <b>${esc(NET.opp?NET.opp.name:'…')}</b></div>`;
  if(NET.host)h+=`<h3>Löcher</h3><div class="seg">${[3,6,9].map(n=>`<button class="${NET.set.holes===n?'on':''}" data-act="netSet" data-k="holes" data-v="${n}"><b>${n} Löcher</b></button>`).join('')}</div><h3>Kurs</h3><select id="onSrc" style="width:100%">${srcOptions().map(([v,t])=>`<option value="${v}" ${NET.set.src===v?'selected':''}>${esc(t)}</option>`).join('')}</select><div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn green" data-act="netStart">Match starten</button></div>`}
 if(NET.st!=='idle'&&NET.st!=='error')h+=`<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="netCancel">Abbrechen</button></div>`;
 h+=`<p class="sub" style="margin-top:16px">So geht's: Einer erstellt einen Raum und schickt den Code, der andere tritt bei. Ihr spielt gleichzeitig dieselben Löcher und seht den Ball des anderen. Wer insgesamt weniger Schläge braucht, gewinnt.</p>`;
 el.innerHTML=h;const nm=$('#onName');nm.oninput=e=>{S.name=e.target.value.slice(0,16)||'Spieler';save()};const src=$('#onSrc');if(src)src.onchange=e=>NET.set.src=e.target.value}
Object.assign(ACT,{netHost:()=>netHost(),netJoin:()=>netJoin(($('#onCode')||{}).value),netCancel:()=>{netLeave();renderOnline()},netSet:d=>{NET.set[d.k]=+d.v;renderOnline()},netStart,netAgain:()=>{closeModal();netStart()}});

/* ================= Start ================= */
loadSave();ensureQuests();resize();startDemo();showScreen('menu');updTop();
if(TAMPER)setTimeout(()=>toast('Speicherstand verändert','Die Prüfsumme stimmte nicht. Coins wurden zurückgesetzt.'),800);
if(canClaimDaily())setTimeout(()=>{if($('#modal').hidden)dailyModal()},700);
requestAnimationFrame(frame);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{freshLoad();updTop()}});
</script>
