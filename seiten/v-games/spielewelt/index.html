<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Valles Spielewelt</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;background:#eef1ff;background-image:radial-gradient(#d9defc 1.5px,transparent 1.5px);background-size:22px 22px;color:#1f2350;min-height:100vh}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(40,50,120,.1)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:24px;cursor:pointer;white-space:nowrap}
.logo .mark{width:42px;height:42px;border-radius:14px;background:conic-gradient(#ff4d6d,#ffd23f,#3cc84a,#2f7bff,#b06bff,#ff4d6d);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 0 #0002;transform:rotate(-8deg)}
.logo span b{color:#5b3cff}
#search{flex:1;max-width:420px;border:0;background:#eef1ff;border-radius:999px;padding:11px 18px;font:inherit;font-size:16px;outline:none;color:#1f2350}
#search:focus{box-shadow:0 0 0 3px #5b3cff55}
.stat{margin-left:auto;background:#5b3cff;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.cat{border:0;background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:15px;color:#1f2350;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #d0d6f5}
.cat.on{background:#5b3cff;color:#fff;box-shadow:0 3px 0 #3a1fb8}
h3{padding:14px 18px 4px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));grid-auto-rows:118px;grid-auto-flow:dense;gap:12px;padding:8px 16px 30px}
.tile{position:relative;border-radius:20px;cursor:pointer;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.12),0 8px 18px rgba(40,50,120,.15);transition:transform .15s,box-shadow .15s;display:flex;align-items:center;justify-content:center;border:0;color:#fff;font:inherit}
.tile:hover{transform:translateY(-4px) scale(1.03);z-index:2}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile .em{font-size:54px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));transition:transform .2s}
.tile.big .em{font-size:110px}
.tile:hover .em{transform:scale(1.15) rotate(-6deg)}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:700;font-size:14px;text-align:center;opacity:0;transition:opacity .15s}
.tile:hover .nm,.tile.big .nm{opacity:1}
@media(hover:none){.tile .nm{opacity:1}}
.tile .bs{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.35);border-radius:999px;font-size:11px;padding:2px 8px;font-weight:700}
.tile .new{position:absolute;top:7px;right:7px;background:#ff3b6b;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:700}
.tile .fav{position:absolute;top:4px;right:6px;font-size:18px}
.empty{padding:20px;font-weight:700;opacity:.6}
footer{text-align:center;padding:10px 0 30px;font-size:13px;opacity:.7}
/* Spielansicht */
#play{position:fixed;inset:0;z-index:10;background:#1f2350;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#2a2f6b;color:#fff}
.pbar button{border:0;background:#5b3cff;color:#fff;font:inherit;font-weight:700;font-size:18px;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #3a1fb8}
.pbar button.alt{background:#ff9d1a;box-shadow:0 3px 0 #c46a00}
.pbar button.fv{background:#ffffff22;box-shadow:none}
.pbar .t{font-weight:700;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .sc{background:#ffffff1f;border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#gc{background:#000;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,60,.6);backdrop-filter:blur(3px)}
.card{background:#fff;border-radius:24px;padding:24px;text-align:center;width:min(360px,90%);box-shadow:0 10px 0 #c9cff5}
.card .big{font-size:70px}
.card h2{font-size:30px;margin:4px 0}
.card p{opacity:.75;margin:6px 0 14px}
.card .res{font-size:22px;font-weight:700;margin:8px 0}
.card .rec{color:#ff3b6b;font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.card button{border:0;font:inherit;font-weight:700;font-size:20px;border-radius:14px;padding:12px 24px;margin:5px;cursor:pointer;color:#fff;background:#3cc84a;box-shadow:0 5px 0 #22862c}
.card button.b2{background:#5b3cff;box-shadow:0 5px 0 #3a1fb8}
.more{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.more .mini{width:64px;height:64px;border-radius:16px;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<header>
  <div class="logo" id="home"><div class="mark">🎮</div><span>Valles <b>Spielewelt</b></span></div>
  <input id="search" placeholder="🔍 Spiel suchen…" autocomplete="off">
  <div class="stat" id="stat">🏆 0</div>
</header>
<div class="cats" id="cats"></div>
<div id="recentWrap"><h3>🕒 Zuletzt gespielt</h3><div class="grid" id="recent"></div></div>
<h3 id="gridTitle">🔥 Alle Spiele</h3>
<div class="grid" id="grid"></div>
<footer>Ideen von Valle, JavaScript von Claude.ai</footer>

<div id="play" class="hide">
  <div class="pbar">
    <button id="back">⬅</button>
    <div class="t" id="pt"></div>
    <div class="sc">⭐ <span id="psc">0</span></div>
    <div class="sc">🏆 <span id="pbest">0</span></div>
    <button class="fv" id="pfav">🤍</button>
    <button class="alt" id="prs">↻</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="gc" width="480" height="640"></canvas>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
// ================== MINI-SPIELE ==================
// Jedes Spiel: make(K) -> {update(dt), draw(c), key(code), down(x,y), move(x,y), up(x,y), swipe(d)}
// K: {W,H, score(n), add(n), over(), rnd(a,b), ri(a,b), txt(c,s,x,y,size,col,al), keys}
const GAMES = [];
const reg = g => GAMES.push(g);
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KDIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function btn(c, K, b, label, col, size) { c.fillStyle = col || '#5b6cff'; rrect(c, b.x, b.y, b.w, b.h, 14); c.fill(); K.txt(c, label, b.x + b.w / 2, b.y + b.h / 2 + 1, size || 22, '#fff'); }
const hit = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const bg = (c, K, a, b) => { const g = c.createLinearGradient(0, 0, 0, K.H); g.addColorStop(0, a); g.addColorStop(1, b); c.fillStyle = g; c.fillRect(0, 0, K.W, K.H); };

// 1 Schlange
reg({ id: 'snake', name: 'Schlangen-Snack', em: '🐍', col: ['#3ddc84', '#0e9f5a'], cat: 'Klassiker', desc: 'Friss Äpfel und werde lang! Pfeiltasten oder wischen.',
  make(K) {
    const S = 24, C = 20, R = 25; let sn = [[10, 12], [9, 12], [8, 12]], dir = 'right', nd = 'right', t = 0, food = nf(), sp = 0.13;
    function nf() { let f; do f = [K.ri(0, C - 1), K.ri(0, R - 1)]; while (sn && sn.some(s => s[0] === f[0] && s[1] === f[1])); return f; }
    const turn = d => { const o = { up: 'down', down: 'up', left: 'right', right: 'left' }; if (o[d] !== dir) nd = d; };
    return {
      key(k) { if (KDIR[k]) turn(KDIR[k]); }, swipe: turn,
      update(dt) { t += dt; if (t < sp) return; t = 0; dir = nd; const [dx, dy] = DIRS[dir]; const h = [sn[0][0] + dx, sn[0][1] + dy];
        if (h[0] < 0 || h[1] < 0 || h[0] >= C || h[1] >= R || sn.some(s => s[0] === h[0] && s[1] === h[1])) return K.over();
        sn.unshift(h); if (h[0] === food[0] && h[1] === food[1]) { K.add(1); food = nf(); sp = Math.max(0.06, sp - 0.003); } else sn.pop(); },
      draw(c) { c.fillStyle = '#1b4332'; c.fillRect(0, 0, K.W, K.H);
        for (let x = 0; x < C; x++) for (let y = 0; y < R; y++) if ((x + y) % 2) { c.fillStyle = '#1e4d39'; c.fillRect(x * S, y * S + 20, S, S); }
        K.txt(c, '🍎', food[0] * S + 12, food[1] * S + 33, 20);
        sn.forEach((s, i) => { c.fillStyle = i ? (i % 2 ? '#52e08f' : '#3ddc84') : '#a7ff83'; rrect(c, s[0] * S + 1, s[1] * S + 21, S - 2, S - 2, 7); c.fill(); });
        c.fillStyle = '#000'; c.beginPath(); c.arc(sn[0][0] * S + 9, sn[0][1] * S + 30, 2.5, 0, 7); c.arc(sn[0][0] * S + 16, sn[0][1] * S + 30, 2.5, 0, 7); c.fill(); }
    };
  } });

// 2 Flatter-Vogel
reg({ id: 'flap', name: 'Flatter-Vogel', em: '🐤', col: ['#7fd3ff', '#2f8bff'], cat: 'Geschick', desc: 'Tippe oder Leertaste zum Flattern. Flieg durch die Lücken!',
  make(K) {
    let y = 300, vy = 0, pipes = [], t = 0, started = false;
    const flap = () => { started = true; vy = -330; K.sfx(600); };
    return {
      key(k) { if (k === 'Space' || k === 'ArrowUp') flap(); }, down: flap,
      update(dt) { if (!started) return; vy += 950 * dt; y += vy * dt; t -= dt;
        if (t <= 0) { t = 1.5; pipes.push({ x: K.W + 40, g: K.rnd(140, K.H - 220), p: false }); }
        for (const p of pipes) { p.x -= 170 * dt; if (!p.p && p.x < 100) { p.p = true; K.add(1); }
          if (p.x < 140 && p.x + 70 > 100 && (y - 16 < p.g || y + 16 > p.g + 170)) K.over(); }
        pipes = pipes.filter(p => p.x > -80); if (y > K.H - 40 || y < 0) K.over(); },
      draw(c) { bg(c, K, '#7fd3ff', '#d6f4ff');
        for (const p of pipes) { c.fillStyle = '#4caf50'; c.fillRect(p.x, 0, 70, p.g); c.fillRect(p.x, p.g + 170, 70, K.H); c.fillStyle = '#388e3c'; c.fillRect(p.x - 6, p.g - 24, 82, 24); c.fillRect(p.x - 6, p.g + 170, 82, 24); }
        c.fillStyle = '#e0c068'; c.fillRect(0, K.H - 40, K.W, 40);
        c.save(); c.translate(120, y); c.rotate(Math.max(-0.5, Math.min(1, vy / 600)));
        c.fillStyle = '#ffd23f'; c.beginPath(); c.ellipse(0, 0, 20, 16, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(8, -5, 6, 0, 7); c.fill(); c.fillStyle = '#000'; c.beginPath(); c.arc(10, -5, 2.5, 0, 7); c.fill(); c.fillStyle = '#ff8a00'; c.beginPath(); c.moveTo(16, 2); c.lineTo(28, 5); c.lineTo(16, 9); c.fill(); c.fillStyle = '#f5b800'; c.beginPath(); c.ellipse(-6, 4, 9, 5, -0.4, 0, 7); c.fill(); c.restore();
        if (!started) K.txt(c, 'Tippen zum Starten', K.W / 2, 200, 26, '#fff'); }
    };
  } });

// 3 Ziegel-Brecher
reg({ id: 'brick', name: 'Ziegel-Brecher', em: '🧱', col: ['#ff8a5c', '#e8322b'], cat: 'Klassiker', desc: 'Schiebe das Brett und zerschlage alle Steine!',
  make(K) {
    let px = 200, ball, br = [], lives = 3, lvl = 0; const pw = 90;
    function rows() { br = []; for (let r = 0; r < 5 + lvl; r++) for (let i = 0; i < 8; i++) br.push({ x: 8 + i * 58, y: 70 + r * 24, a: 1, c: `hsl(${r * 40},80%,60%)` }); }
    function reset() { ball = { x: K.W / 2, y: 500, vx: 180 * (Math.random() < .5 ? 1 : -1), vy: -300, st: false }; }
    rows(); reset();
    return {
      move(x) { px = x - pw / 2; }, down(x) { px = x - pw / 2; ball.st = true; },
      key(k) { if (k === 'Space') ball.st = true; },
      update(dt) { if (K.keys.ArrowLeft) px -= 420 * dt; if (K.keys.ArrowRight) px += 420 * dt; px = Math.max(0, Math.min(K.W - pw, px));
        if (!ball.st) { ball.x = px + pw / 2; ball.y = 580; return; }
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        if (ball.x < 8 || ball.x > K.W - 8) ball.vx *= -1, ball.x = Math.max(8, Math.min(K.W - 8, ball.x)); if (ball.y < 8) ball.vy = Math.abs(ball.vy);
        if (ball.y > 588 && ball.y < 604 && ball.x > px && ball.x < px + pw && ball.vy > 0) { ball.vy = -Math.abs(ball.vy) * 1.02; ball.vx = (ball.x - px - pw / 2) * 7; }
        if (ball.y > K.H) { lives--; if (!lives) return K.over(); reset(); }
        for (const b of br) if (b.a && ball.x > b.x && ball.x < b.x + 54 && ball.y > b.y && ball.y < b.y + 20) { b.a = 0; ball.vy *= -1; K.add(10); K.sfx(800); break; }
        if (br.every(b => !b.a)) { lvl++; rows(); reset(); } },
      draw(c) { bg(c, K, '#1d1b4b', '#3a2f80'); for (const b of br) if (b.a) { c.fillStyle = b.c; rrect(c, b.x, b.y, 54, 20, 5); c.fill(); }
        c.fillStyle = '#fff'; rrect(c, px, 592, pw, 14, 7); c.fill(); c.beginPath(); c.arc(ball.x, ball.y, 8, 0, 7); c.fill();
        K.txt(c, '❤️'.repeat(lives), 60, 30, 18); }
    };
  } });

// 4 Zahlen-Schieber
reg({ id: 'merge', name: 'Zahlen-Schieber', em: '🔢', col: ['#ffd36b', '#f2a33a'], cat: 'Denken', desc: 'Schiebe gleiche Zahlen zusammen. Pfeiltasten oder wischen.',
  make(K) {
    let g = Array(16).fill(0); const add = () => { const e = g.map((v, i) => v ? -1 : i).filter(i => i >= 0); if (e.length) g[e[K.ri(0, e.length - 1)]] = Math.random() < 0.9 ? 2 : 4; };
    add(); add();
    function mv(d) {
      const old = g.join(); const L = i => { const r = []; for (let k = 0; k < 4; k++) r.push(i(k)); return r; };
      for (let a = 0; a < 4; a++) {
        const idx = L(k => d === 'left' ? a * 4 + k : d === 'right' ? a * 4 + 3 - k : d === 'up' ? k * 4 + a : (3 - k) * 4 + a);
        let v = idx.map(i => g[i]).filter(Boolean);
        for (let k = 0; k < v.length - 1; k++) if (v[k] === v[k + 1]) { v[k] *= 2; K.add(v[k]); v.splice(k + 1, 1); }
        idx.forEach((i, k) => g[i] = v[k] || 0);
      }
      if (g.join() !== old) { add(); K.sfx(400); }
      const can = g.some(v => !v) || g.some((v, i) => (i % 4 < 3 && v === g[i + 1]) || (i < 12 && v === g[i + 4]));
      if (!can) K.over();
    }
    const cols = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
    return { key(k) { if (KDIR[k]) mv(KDIR[k]); }, swipe: mv, update() { },
      draw(c) { c.fillStyle = '#faf8ef'; c.fillRect(0, 0, K.W, K.H); c.fillStyle = '#bbada0'; rrect(c, 20, 140, 440, 440, 14); c.fill();
        g.forEach((v, i) => { const x = 32 + (i % 4) * 106, y = 152 + Math.floor(i / 4) * 106; c.fillStyle = v ? (cols[v] || '#3c3a32') : '#cdc1b4'; rrect(c, x, y, 96, 96, 10); c.fill(); if (v) K.txt(c, v, x + 48, y + 50, v > 512 ? 30 : 38, v > 4 ? '#fff' : '#776e65'); });
        K.txt(c, 'Erreiche 2048!', K.W / 2, 100, 26, '#776e65'); } };
  } });

// 5 Memory
reg({ id: 'memory', name: 'Tier-Memory', em: '🃏', col: ['#c58bff', '#7b3fe4'], cat: 'Denken', desc: 'Finde alle Paare mit möglichst wenigen Zügen!',
  make(K) {
    const em = ['🐶', '🐱', '🦊', '🐸', '🐼', '🐵', '🦁', '🐷']; let cards = em.concat(em).sort(() => Math.random() - .5).map(e => ({ e, open: false, done: false }));
    let sel = [], moves = 0, wait = 0, found = 0;
    return {
      down(x, y) { if (wait > 0) return; const i = Math.floor((x - 20) / 110), j = Math.floor((y - 120) / 120); if (i < 0 || i > 3 || j < 0 || j > 3) return;
        const cd = cards[j * 4 + i]; if (cd.open || cd.done) return; cd.open = true; sel.push(cd); K.sfx(500);
        if (sel.length === 2) { moves++; if (sel[0].e === sel[1].e) { sel.forEach(s => s.done = true); sel = []; found++; K.score(Math.max(10, 200 - moves * 5)); if (found === 8) setTimeout(K.over, 600); } else wait = 0.8; } },
      update(dt) { if (wait > 0) { wait -= dt; if (wait <= 0) { sel.forEach(s => s.open = false); sel = []; } } },
      draw(c) { bg(c, K, '#efe3ff', '#d4b8ff'); K.txt(c, 'Züge: ' + moves, K.W / 2, 80, 26, '#5a2ca0');
        cards.forEach((cd, k) => { const x = 20 + (k % 4) * 110, y = 120 + Math.floor(k / 4) * 120; c.fillStyle = cd.done ? '#b6f5c8' : cd.open ? '#fff' : '#7b3fe4'; rrect(c, x, y, 100, 110, 14); c.fill();
          K.txt(c, cd.open || cd.done ? cd.e : '❓', x + 50, y + 58, cd.open || cd.done ? 50 : 34); }); }
    };
  } });

// 6 Tic-Tac-Toe
reg({ id: 'ttt', name: 'Drei gewinnt', em: '⭕', col: ['#5ce1e6', '#1f8fa8'], cat: 'Denken', desc: 'Schlag den Computer bei Tic-Tac-Toe! Jeder Sieg = Punkt.',
  make(K) {
    let b = Array(9).fill(''), msg = '', wins = 0, lock = false;
    const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const win = (b, p) => L.some(l => l.every(i => b[i] === p));
    function mm(b, p) { if (win(b, 'O')) return 1; if (win(b, 'X')) return -1; if (b.every(Boolean)) return 0; let best = p === 'O' ? -9 : 9;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = p; const v = mm(b, p === 'O' ? 'X' : 'O'); b[i] = ''; best = p === 'O' ? Math.max(best, v) : Math.min(best, v); } return best; }
    function ai() { if (Math.random() < 0.25) { const e = b.map((v, i) => v ? -1 : i).filter(i => i >= 0); return e[K.ri(0, e.length - 1)]; }
      let bi = -1, bv = -9; for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = 'O'; const v = mm(b, 'X'); b[i] = ''; if (v > bv) { bv = v; bi = i; } } return bi; }
    function end(m) { msg = m; lock = true; setTimeout(() => { if (m === 'Verloren!') K.over(); else { b = Array(9).fill(''); msg = ''; lock = false; } }, 1200); }
    return {
      down(x, y) { if (lock) return; const i = Math.floor((x - 60) / 120), j = Math.floor((y - 160) / 120); if (i < 0 || i > 2 || j < 0 || j > 2 || b[j * 3 + i]) return;
        b[j * 3 + i] = 'X'; K.sfx(500); if (win(b, 'X')) { wins++; K.score(wins); return end('Gewonnen! 🎉'); } if (b.every(Boolean)) return end('Unentschieden');
        b[ai()] = 'O'; if (win(b, 'O')) return end('Verloren!'); if (b.every(Boolean)) return end('Unentschieden'); },
      update() { },

      update(dt) { if (!ball.fly) return; ball.vy += 900 * dt; const py = ball.y; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        if (!ball.sc && py < hy && ball.y >= hy && ball.x > hx - 30 && ball.x < hx + 30) { ball.sc = true; K.add(1); K.sfx(900); msg = 'TREFFER!'; }
        if (Math.hypot(ball.x - (hx - 36), ball.y - hy) < 16 || Math.hypot(ball.x - (hx + 36), ball.y - hy) < 16) ball.vx *= -0.6;
        if (ball.y > 700 || ball.x > 520 || ball.x < -40) { if (!ball.sc) msg = 'Daneben'; if (shots <= 0) K.over(); else reset(); setTimeout(() => msg = '', 700); } },
      draw(c) { bg(c, K, '#ffe8cc', '#fff'); c.fillStyle = '#c9a26b'; c.fillRect(0, 560, K.W, 80);
        c.fillStyle = '#fff'; c.fillRect(hx + 30, hy - 80, 10, 120); c.strokeStyle = '#e8322b'; c.lineWidth = 5; c.beginPath(); c.moveTo(hx - 36, hy); c.lineTo(hx + 36, hy); c.stroke();
        c.strokeStyle = '#ccc'; c.lineWidth = 2; for (let k = -30; k <= 30; k += 15) { c.beginPath(); c.moveTo(hx + k, hy); c.lineTo(hx + k * 0.6, hy + 40); c.stroke(); }
        if (drag) { c.strokeStyle = '#0005'; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(ball.x, ball.y); c.lineTo(ball.x + (drag[0] - drag[2]), ball.y + (drag[1] - drag[3])); c.stroke(); c.setLineDash([]); }
        K.txt(c, '🏀', ball.x, ball.y, 40); K.txt(c, 'Würfe übrig: ' + shots, K.W / 2, 40, 22, '#a0522d'); K.txt(c, msg, K.W / 2, 100, 40, '#e8322b'); }
    };
  } });

// 29 Sternen-Sammler (Ausweichen im Kreis)
reg({ id: 'orbit', name: 'Kreisel-Kugel', em: '🪐', col: ['#2b1055', '#7597de'], cat: 'Action', desc: 'Tippe, um die Richtung zu wechseln. Sammle Sterne, weiche den Stacheln aus!',
  make(K) {
    let a = 0, dir = 1, sp = 2.2, items = [], t = 0; const cx = 240, cy = 340, R = 130;
    return {
      down() { dir *= -1; K.sfx(500); }, key(k) { if (k === 'Space') { dir *= -1; } },
      update(dt) { a += dir * sp * dt; sp += 0.02 * dt; t -= dt;
        if (t <= 0) { t = 0.9; items.push({ a: a + K.rnd(1.5, 4.7) * (Math.random() < .5 ? 1 : -1), b: Math.random() < 0.6, life: 4 }); }
        const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
        for (const it of items) { it.life -= dt; const x = cx + Math.cos(it.a) * R, y = cy + Math.sin(it.a) * R; if (!it.d && Math.hypot(px - x, py - y) < 28) { it.d = 1; if (it.b) { K.add(1); K.sfx(900); } else K.over(); } }
        items = items.filter(i => !i.d && i.life > 0); },
      draw(c) { bg(c, K, '#2b1055', '#7597de'); c.strokeStyle = '#ffffff55'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
        items.forEach(i => K.txt(c, i.b ? '⭐' : '🌵', cx + Math.cos(i.a) * R, cy + Math.sin(i.a) * R, 32));
        c.fillStyle = '#ff6fb5'; c.beginPath(); c.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 16, 0, 7); c.fill(); K.txt(c, '🪐', cx, cy, 60); }
    };
  } });

// 30 Gleiche Emojis (Unterschied finden)
reg({ id: 'odd', name: 'Finde den Unterschied', em: '🔍', col: ['#fbc2eb', '#a6c1ee'], cat: 'Denken', desc: 'Ein Emoji ist anders! Finde es so schnell du kannst. 40 Sekunden.',
  make(K) {
    const P = [['😀', '😃'], ['🐶', '🐕'], ['🍎', '🍅'], ['⭐', '🌟'], ['🌲', '🌳'], ['🙂', '🙃'], ['🐱', '🐈'], ['🌑', '🌚'], ['🚗', '🚙'], ['💙', '💜']]; let n, odd, pair, time = 40;
    function nr() { n = Math.min(8, 3 + Math.floor(K.sc() / 3)); odd = K.ri(0, n * n - 1); pair = P[K.ri(0, P.length - 1)]; }
    nr();
    return {
      down(x, y) { const S = 440 / n, i = Math.floor((x - 20) / S), j = Math.floor((y - 140) / S); if (i < 0 || i >= n || j < 0 || j >= n) return; if (j * n + i === odd) { K.add(1); K.sfx(800); nr(); } else { time -= 3; K.sfx(150); } },
      update(dt) { time -= dt; if (time <= 0) K.over(); },
      draw(c) { bg(c, K, '#fbe3f5', '#e3ecff'); K.txt(c, '⏱ ' + Math.ceil(time), K.W / 2, 80, 30, '#553'); const S = 440 / n;
        for (let k = 0; k < n * n; k++) K.txt(c, k === odd ? pair[1] : pair[0], 20 + (k % n + 0.5) * S, 140 + (Math.floor(k / n) + 0.5) * S, S * 0.7); }
    };
  } });

(function () {
const $ = s => document.querySelector(s);
const KEY = 'vallesSpielewelt1';
let D; try { D = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { D = {}; }
D = Object.assign({ best: {}, plays: {}, recent: [], fav: [] }, D);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { } };
const byId = id => GAMES.find(g => g.id === id);

// ---------- Portal ----------
const CATS = ['Alle', '❤️ Favoriten', 'Action', 'Geschick', 'Denken', 'Klassiker'];
let cat = 'Alle', q = '';
function tile(g, big) {
  const b = document.createElement('button'); b.className = 'tile' + (big ? ' big' : '');
  b.style.background = `linear-gradient(135deg,${g.col[0]},${g.col[1]})`;
  b.innerHTML = `<div class="em">${g.em}</div><div class="nm">${g.name}</div>` + (D.best[g.id] ? `<div class="bs">🏆 ${D.best[g.id]}</div>` : '') + (D.fav.includes(g.id) ? '<div class="fav">❤️</div>' : !D.plays[g.id] ? '<div class="new">NEU</div>' : '');
  b.onclick = () => open(g.id); return b;
}
function renderPortal() {
  $('#cats').innerHTML = ''; CATS.forEach(c => { const b = document.createElement('button'); b.className = 'cat' + (c === cat ? ' on' : ''); b.textContent = c; b.onclick = () => { cat = c; renderPortal(); }; $('#cats').appendChild(b); });
  const rec = D.recent.map(byId).filter(Boolean);
  $('#recentWrap').classList.toggle('hide', !rec.length || cat !== 'Alle' || !!q);
  $('#recent').innerHTML = ''; rec.slice(0, 8).forEach(g => $('#recent').appendChild(tile(g)));
  let list = GAMES.filter(g => (cat === 'Alle' || g.cat === cat || (cat === '❤️ Favoriten' && D.fav.includes(g.id))) && (!q || (g.name + ' ' + g.desc + ' ' + g.cat).toLowerCase().includes(q)));
  $('#gridTitle').textContent = q ? '🔍 Suche: ' + q : cat === 'Alle' ? '🔥 Alle Spiele (' + GAMES.length + ')' : cat;
  $('#grid').innerHTML = ''; list.forEach((g, i) => $('#grid').appendChild(tile(g, cat === 'Alle' && !q && i % 7 === 0)));
  if (!list.length) $('#grid').innerHTML = '<div class="empty">' + (cat === '❤️ Favoriten' ? 'Noch keine Favoriten – tippe im Spiel auf 🤍' : 'Nichts gefunden 😕') + '</div>';
  const tot = Object.values(D.plays).reduce((a, b) => a + b, 0); $('#stat').textContent = '🎮 ' + tot + ' Runden';
}
$('#search').oninput = e => { q = e.target.value.trim().toLowerCase(); renderPortal(); };
$('#home').onclick = () => { cat = 'Alle'; q = ''; $('#search').value = ''; renderPortal(); };

// ---------- Spiel-Rahmen ----------
const cv = $('#gc'), ctx = cv.getContext('2d'); const W = 480, H = 640;
let cur = null, inst = null, state = 'idle', score = 0, gid = 0;
const keys = {};
let AC = null;
function sfx(f) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), gn = AC.createGain(); o.type = 'square'; o.frequency.value = f; gn.gain.setValueAtTime(0.05, AC.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.12); o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.12); } catch (e) { } }
function mkK(id) {
  return { W, H, keys,
    score(n) { if (id === gid && state === 'play') { score = n; $('#psc').textContent = score; } },
    add(n) { if (id === gid && state === 'play') { score += n; $('#psc').textContent = score; } },
    sc: () => score,
    over() { if (id === gid && state === 'play') gameOver(); },
    rnd: (a, b) => a + Math.random() * (b - a), ri: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    sfx(f) { if (id === gid) sfx(f); },
    txt(c, s, x, y, size, col) { c.font = `700 ${size}px Fredoka, 'Trebuchet MS', sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = col || '#000'; c.fillText(s, x, y); } };
}
function fit() { const st = $('#stage').getBoundingClientRect(); const s = Math.min((st.width - 16) / W, (st.height - 16) / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
window.addEventListener('resize', () => cur && fit());
function open(id) {
  cur = byId(id); D.recent = [id].concat(D.recent.filter(x => x !== id)).slice(0, 8); save();
  $('#play').classList.remove('hide'); $('#pt').textContent = cur.em + ' ' + cur.name; $('#pbest').textContent = D.best[id] || 0;
  $('#pfav').textContent = D.fav.includes(id) ? '❤️' : '🤍';
  fit(); newInst(); state = 'start';
  card(`<div class="big">${cur.em}</div><h2>${cur.name}</h2><p>${cur.desc}</p><button id="go">▶ Spielen</button>`);
  $('#go').onclick = start;
}
function newInst() { gid++; score = 0; $('#psc').textContent = 0; inst = cur.make(mkK(gid)); }
function card(html) { $('#card').innerHTML = html; $('#ov').classList.remove('hide'); }
function start() { sfx(600); newInst(); state = 'play'; $('#ov').classList.add('hide'); D.plays[cur.id] = (D.plays[cur.id] || 0) + 1; save(); }
function gameOver() {
  state = 'over'; const best = D.best[cur.id] || 0, rec = score > best; if (rec) { D.best[cur.id] = score; save(); }
  $('#pbest').textContent = D.best[cur.id] || 0;
  const others = GAMES.filter(g => g.id !== cur.id).sort(() => Math.random() - .5).slice(0, 4);
  card(`<div class="big">${rec && score > 0 ? '🏆' : '🎮'}</div><h2>${rec && score > 0 ? 'NEUER REKORD!' : 'Vorbei!'}</h2><div class="res">Punkte: ${score}</div>${rec && score > 0 ? '<div class="rec">Super gemacht!</div>' : `<p>Dein Rekord: ${best}</p>`}
    <button id="again">↻ Nochmal</button><button class="b2" id="toPortal">🏠 Alle Spiele</button>
    <p style="margin:12px 0 4px">Probier auch:</p><div class="more">${others.map(g => `<div class="mini" data-id="${g.id}" title="${g.name}" style="background:linear-gradient(135deg,${g.col[0]},${g.col[1]})">${g.em}</div>`).join('')}</div>`);
  $('#again').onclick = start; $('#toPortal').onclick = close;
  document.querySelectorAll('.mini').forEach(m => m.onclick = () => open(m.dataset.id));
  sfx(rec ? 900 : 200);
}
function close() { state = 'idle'; cur = null; inst = null; gid++; $('#play').classList.add('hide'); renderPortal(); }
$('#back').onclick = close;
$('#prs').onclick = () => { if (cur) start(); };
$('#pfav').onclick = () => { if (!cur) return; const i = D.fav.indexOf(cur.id); if (i >= 0) D.fav.splice(i, 1); else D.fav.push(cur.id); save(); $('#pfav').textContent = D.fav.includes(cur.id) ? '❤️' : '🤍'; };

// Eingabe
const P = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
let ps = null;
cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state !== 'play') return; cv.setPointerCapture(e.pointerId); const [x, y] = P(e); ps = { x, y, t: performance.now() }; inst.down && inst.down(x, y); });
cv.addEventListener('pointermove', e => { if (state !== 'play') return; const [x, y] = P(e); if (e.pointerType === 'mouse' || ps) inst.move && inst.move(x, y); });
cv.addEventListener('pointerup', e => { if (state !== 'play') return; const [x, y] = P(e); inst.up && inst.up(x, y);
  if (ps) { const dx = x - ps.x, dy = y - ps.y; if (Math.hypot(dx, dy) > 35 && inst.swipe) inst.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); else inst.tap && inst.tap(x, y); } ps = null; });
window.addEventListener('keydown', e => {
  if (!cur) return; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (state !== 'play') { if (e.code === 'Space' || e.code === 'Enter') { start(); } return; }
  if (!keys[e.code]) inst.key && inst.key(e.code); keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Schleife
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (inst && cur) { try { if (state === 'play') inst.update(dt); inst.draw(ctx); } catch (err) { console.error(err); } }
  requestAnimationFrame(loop);
}
renderPortal(); requestAnimationFrame(loop);
})();
</script>
</body>
