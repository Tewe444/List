<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenSkyAI Chat</title>
  <link rel="stylesheet" href="style.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <!-- WebLLM für WebGPU / Gemma im Browser -->
  <script type="module">
    try {
      window.webllm = await import("https://esm.run/@mlc-ai/web-llm");
    } catch (e) {
      console.warn("WebLLM konnte nicht geladen werden:", e);
    }
    window.webllmDone = true;
    window.dispatchEvent(new Event("webllm-ready"));
  </script>
</head>
<body>
<div class="chat-container">
  <header>
    <span>OpenSkyAI</span>
    <small id="llmStatus"></small>
  </header>
  <div id="msgs" class="chat-messages"></div>
  <div class="chat-input-area">
    <button id="mic" class="icon" title="Sprechen" aria-label="Sprachaufnahme"></button>
    <div id="inpWrap" class="input-wrapper">
      <div id="sugg" class="sugg" role="listbox" aria-label="Befehle" hidden></div>
      <textarea id="inp" class="chat-input" rows="1" placeholder="Nachricht… (/ für Befehle, Shift+Enter = neue Zeile)" autocomplete="off" aria-autocomplete="list" aria-controls="sugg"></textarea>
      <button id="cancelPrompt" class="cancel-prompt-btn" title="Eingabe abbrechen">✕</button>
    </div>
    <button id="send" class="send-button">Senden</button>
  </div>
</div>
<input type="file" id="file" accept=".json" hidden>
<!-- Rund, unten rechts: Pfeil nach rechts = zurück zur Liste -->
<a id="toList" class="to-list" href="../index.html" aria-label="Zur Liste" title="Zur Liste">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</a>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
